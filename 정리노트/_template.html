<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>정리노트 퀴즈</title>
<!--
  정리노트 퀴즈 마스터 템플릿 — 한 화면에 한 문제
  새 회차: cp 정리노트/_template.html 정리노트/MMDD.html
  그다음 <script> 맨 위 데이터 블록(META · QUIZ)만 바꾼다. 스타일과 엔진은 건드리지 않는다.
  file:// 로 여는 단일 파일이다. 외부 파일·네트워크 참조를 추가하지 않는다 (tests/test_note_MMDD.py 가 막는다).
-->
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ── 디자인 토큰 : 색·글자·간격·모션은 여기서만 정한다 ── */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#6b7280; --line:#d9dee7; --card:#f7f8fa;
  --ok:#067647; --okbg:#ecfdf3; --no:#b42318; --nobg:#fef3f2;
  --accent:#1677ff; --warn:#93370d; --warnbg:#fffaeb;
  --primary:#0b63e5; --on-primary:#ffffff;          /* 채운 버튼 — 흰 글자 대비 4.5:1 이상 */

  --font:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-title:18px; --fs-q:20px; --fs-body:16px; --fs-meta:14px; --fs-chip:13px;
  --lh:1.6;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s12:48px;
  --radius:8px; --radius-sm:4px; --tap:44px; --pad:16px;

  --t-fast:150ms; --t-base:200ms; --t-move:250ms; --t-exit:160ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101114; --fg:#eceef1; --muted:#9ca3af; --line:#2e3238; --card:#1a1c20;
    --ok:#47cd89; --okbg:#0b2a1c; --no:#f97066; --nobg:#3a1512;
    --accent:#4c93ff; --warn:#fdb022; --warnbg:#33240a;
    --primary:#4c93ff; --on-primary:#101114;
  }
}
@media (min-width:768px){
  :root{--fs-q:22px; --pad:24px}
}

/* ── 기본 ── */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh);word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.875em;padding:0 var(--s1);border-radius:var(--radius-sm);background:var(--card)}
.i{display:block;flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-wrap{display:inline-flex;align-items:center;justify-content:center}

/* ── 앱 셸 : 상단 바 / 스크롤 스테이지 / 하단 바 ── */
.app{height:100vh;height:100dvh}
.top-inner,.stage-inner,.actions-inner{width:100%;max-width:720px;margin-inline:auto;padding-inline:var(--pad)}

/* 상단 바 */
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{padding-top:var(--s2)}
.top-row{--od-gap:var(--s2)}
.meta summary{display:flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding-block:var(--s1);list-style:none;cursor:pointer;border-radius:var(--radius)}
.meta summary::-webkit-details-marker{display:none}
.meta summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta-heading{display:block;flex:1 1 0;min-width:0}
.eyebrow{display:block;margin:0;font-size:var(--fs-meta);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.title{display:block;margin:0;font-size:var(--fs-title);font-weight:700;line-height:1.4;letter-spacing:-.01em}
.meta-chev{color:var(--muted);transition:transform var(--t-base) var(--ease-out)}
.meta[open] .meta-chev{transform:rotate(180deg)}
.meta-body{padding-bottom:var(--s2)}
.meta-body p{margin:var(--s1) 0 0;color:var(--muted)}
.meta-body .meta-note{margin-top:var(--s2);padding:var(--s3) var(--s4);border-radius:var(--radius);background:var(--card);color:var(--fg)}
@media (hover:none){.meta-keys{display:none}}
.streak{margin:0;padding:0 var(--s2);border-radius:var(--radius-sm);background:var(--okbg);color:var(--ok);font-size:var(--fs-chip);font-weight:700;line-height:28px}
.streak.bump{animation:bump 240ms var(--ease-out)}
.round{margin:var(--s1) 0 0;font-size:var(--fs-meta);font-weight:700;color:var(--primary)}
.progress{--od-gap:var(--s3);padding-block:var(--s2)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform var(--t-move) var(--ease-out)}
.score{margin:0;font-size:var(--fs-meta);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* 문항 지도 */
.map{max-width:720px;margin-inline:auto}
.map-rail{--od-gap:var(--s2);--od-rail-pad:var(--pad);position:relative;padding-block:6px var(--s3)}
@media (hover:hover){.map-rail{scrollbar-width:thin}}
.chip{display:grid;align-content:center;justify-items:center;width:44px;min-height:48px;margin:0;padding:var(--s1) 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-variant-numeric:tabular-nums;transition:border-color var(--t-fast) var(--ease-out)}
.chip-num{display:block;font-size:var(--fs-meta);font-weight:600;line-height:20px}
.chip-mark{display:flex;justify-content:center;height:16px}
.chip-mark .i{width:14px;height:14px;stroke-width:2.5}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.chip.current{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);font-weight:700}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.chip:hover{border-color:var(--accent)}}

/* 스테이지 */
.stage{overflow-x:hidden}
.stage-inner{padding-block:var(--s6) var(--s8)}
.enter-right{animation:in-right var(--t-move) var(--ease-out) both}
.enter-left{animation:in-left var(--t-move) var(--ease-out) both}
.leave-left{animation:out-left var(--t-exit) var(--ease-in) both;pointer-events:none}
.leave-right{animation:out-right var(--t-exit) var(--ease-in) both;pointer-events:none}

/* 문항 */
.q-head{--od-gap:var(--s2);margin-bottom:var(--s2)}
.q-pos{font-size:var(--fs-meta);font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.q-num{font-size:var(--fs-meta);font-weight:600;color:var(--muted)}
.tag{padding:0 var(--s2);border-radius:var(--radius-sm);background:var(--warnbg);color:var(--warn);font-size:var(--fs-chip);font-weight:700;line-height:22px}
.q-text{margin:0;font-size:var(--fs-q);font-weight:700;line-height:1.5;letter-spacing:-.01em}
.q-text:focus{outline:none}
.q-text:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--radius-sm)}
.q-hint{margin:var(--s2) 0 0;font-size:var(--fs-meta);color:var(--muted)}
.opts{--od-gap:var(--s2);margin-top:var(--s5)}

/* 보기 — 답을 고르면 박스 안에서 해설이 펼쳐진다 */
.opt-item{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);transition:border-color var(--t-fast) var(--ease-out),background-color var(--t-fast) var(--ease-out),transform var(--t-fast) var(--ease-out)}
@media (hover:hover){.opt-item:not(.done):hover{border-color:var(--accent)}}
.opt-item:not(.done):active{transform:scale(.99)}
.opt{--od-gap:var(--s3);width:100%;min-height:52px;margin:0;padding:var(--s3) var(--s4);text-align:left;line-height:1.5;background:transparent;border:0;border-radius:var(--radius);cursor:pointer}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 채점 후: 투명도로 흐리지 않는다 */
.opt:disabled{cursor:default;opacity:1;-webkit-text-fill-color:currentColor}
.opt-mark{min-width:1.25em;font-weight:700;color:var(--muted)}
.badge{margin-top:1px;padding:0 var(--s2);border-radius:var(--radius-sm);font-size:var(--fs-chip);font-weight:700;line-height:24px}
.opt-item.ok{background:var(--okbg);border-color:var(--ok)}
.opt-item.ok .opt{color:var(--ok);font-weight:600}
.opt-item.ok .badge{background:var(--ok);color:var(--okbg)}
.opt-item.no{background:var(--nobg);border-color:var(--no)}
.opt-item.no .opt{color:var(--no)}
.opt-item.no .badge{background:var(--no);color:var(--nobg)}
.opt-item.ok .opt-mark,.opt-item.no .opt-mark{color:inherit}
.opt-item.trap{background:var(--card)}
.opt-item.trap .badge{background:var(--warnbg);color:var(--warn)}
.opt-item.dim .opt{color:var(--muted)}
.opt-item.dim .badge{background:var(--card);color:var(--muted)}
.opt-note{padding:0 var(--s4) var(--s4) calc(var(--s4) + 1.25em + var(--s3))}
.note-label{display:block;font-size:var(--fs-meta);font-weight:700}
.opt-item.ok .note-label{color:var(--ok)}
.opt-item.no .note-label{color:var(--no)}
.opt-item.trap .note-label{color:var(--warn)}
.note-text{margin:2px 0 0;color:var(--fg)}
.animate{animation:reveal var(--t-base) var(--ease-out) both;animation-delay:var(--delay,0ms)}

/* 판정 패널 */
.fb{margin-top:var(--s5);padding:var(--s4);border-radius:var(--radius)}
.fb.ok{background:var(--okbg)}
.fb.no{background:var(--nobg)}
.fb:focus{outline:none}
.fb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb-head{--od-gap:var(--s2)}
.fb.ok .fb-head{color:var(--ok)}
.fb.no .fb-head{color:var(--no)}
.fb-verdict{margin:0;font-size:17px;font-weight:700}
.fb-sub{margin:var(--s1) 0 0;font-size:var(--fs-meta);font-weight:600}
.fb-sec{margin-top:var(--s3)}
.fb-label{display:block;font-size:var(--fs-meta);font-weight:700}
.fb-text{margin:2px 0 0}
.fb-sec.keynote{padding:var(--s3) var(--s4);border-radius:var(--radius);background:var(--warnbg);color:var(--warn)}
.fb-ref .fb-text{font-weight:600}
.fb-done{margin:var(--s4) 0 var(--s2);font-weight:600}

/* 하단 바 */
.actions{background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.actions-inner{--od-gap:var(--s2);padding-block:var(--s3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;margin:0;padding:0 var(--s5);font-weight:700;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color var(--t-fast) var(--ease-out),background-color var(--t-fast) var(--ease-out)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-sm{min-height:var(--tap);padding:0 var(--s3);font-size:var(--fs-meta)}
.btn-sm .i{width:18px;height:18px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-danger{background:var(--no);border-color:var(--no);color:var(--bg)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn:disabled{cursor:not-allowed;opacity:1;color:var(--muted);background:var(--card);border-color:var(--line);-webkit-text-fill-color:currentColor}
@media (hover:hover){
  .btn:not(:disabled):hover{border-color:var(--accent)}
  .btn-primary:not(:disabled):hover,.btn-danger:not(:disabled):hover{border-color:var(--fg)}
}

/* 결과 화면 */
.result-hero{text-align:center;padding-top:var(--s4)}
.result-title{margin:var(--s1) 0 0;font-size:24px;font-weight:700;line-height:1.4}
.result-title:focus{outline:none}
.result-title:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--radius-sm)}
.score-big{margin:var(--s4) 0 0;font-size:clamp(48px,12vw,72px);font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score-den{font-size:.45em;font-weight:600;color:var(--muted)}
.score-rate{margin:var(--s2) 0 0;color:var(--muted)}
.stats{--od-cols:3;--od-gap:var(--s2);margin-top:var(--s6)}
.stat{padding:var(--s3) var(--s2);border-radius:var(--radius);background:var(--card);text-align:center}
.stat-num{font-size:24px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stat-label{font-size:var(--fs-meta);color:var(--muted)}
.stat.ok .stat-num{color:var(--ok)}
.stat.no .stat-num{color:var(--no)}
.overall{margin:var(--s3) 0 0;font-size:var(--fs-meta);color:var(--muted)}
.review-title{margin:var(--s8) 0 var(--s3);font-size:17px;font-weight:700}
.review-empty{margin:0;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:var(--s2);margin:0;padding:0;list-style:none}
.review-item{--od-gap:var(--s3);width:100%;min-height:var(--tap);margin:0;padding:var(--s3) var(--s4);text-align:left;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);cursor:pointer;transition:border-color var(--t-fast) var(--ease-out)}
.review-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.review-item:hover{border-color:var(--accent)}}
.review-icon{margin-top:2px}
.review-item.no .review-icon{color:var(--no)}
.review-item.skip .review-icon,.review-go{color:var(--muted)}
.review-meta{font-size:var(--fs-meta);font-weight:600;color:var(--muted)}
.review-go{margin-top:2px}
.result-actions{--od-gap:var(--s2);margin-top:var(--s8)}
.result-actions .btn{width:100%}

/* 빈 상태 · noscript */
.empty{padding:var(--s6) var(--s5);border-radius:var(--radius);background:var(--card)}
.empty-title{margin:0 0 var(--s1);font-size:17px;font-weight:700}
.empty-text{margin:0;color:var(--muted)}

/* 확인 대화상자 */
.confirm{width:min(400px,calc(100% - 32px));padding:0;border:0;border-radius:var(--radius);background:var(--bg);color:var(--fg)}
.confirm::backdrop{background:rgb(0 0 0 / .45)}
.confirm[open]{animation:reveal var(--t-base) var(--ease-out)}
.confirm-inner{padding:var(--s6)}
.confirm h2{margin:0 0 var(--s2);font-size:18px;font-weight:700}
.confirm p{margin:0 0 var(--s5);color:var(--muted)}
.confirm-actions{--od-gap:var(--s2)}

/* ── 모션 ── */
@keyframes in-right{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes in-left{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes out-left{to{opacity:0;transform:translateX(-16px)}}
@keyframes out-right{to{opacity:0;transform:translateX(16px)}}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app od-screen">
  <header class="top">
    <div class="top-inner">
      <div class="top-row od-row">
        <details class="meta od-fill">
          <summary>
            <span class="meta-heading">
              <span class="eyebrow" id="meta-date">MMDD · 생명과학 정리노트</span>
              <h1 class="title" id="meta-chapter">정리노트 퀴즈</h1>
            </span>
            <svg class="i meta-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <div class="meta-body">
            <p id="meta-range"></p>
            <p id="meta-srcline"></p>
            <p class="meta-note" id="meta-note" hidden></p>
            <p class="meta-keys">키보드 — 1~8 보기 선택 · ← → 이동 · Enter 다음 문제</p>
          </div>
        </details>
        <p class="streak od-fixed od-nowrap" id="streak" hidden></p>
        <button type="button" class="btn btn-sm od-fixed" id="reset" disabled>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
          <span>다시 풀기</span>
        </button>
      </div>
      <p class="round" id="round" hidden></p>
      <div class="progress od-row">
        <div class="bar od-fill" id="bar" role="progressbar" aria-label="풀이 진행도" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><i id="prog"></i></div>
        <p class="score od-fixed od-nowrap" id="score" aria-live="polite"></p>
      </div>
    </div>
    <nav class="map" id="map-wrap" aria-label="문항 지도">
      <div class="map-rail od-rail" id="map"></div>
    </nav>
  </header>

  <main class="stage od-scroll" id="stage">
    <div class="stage-inner" id="quiz"></div>
    <noscript><div class="stage-inner"><section class="empty"><p class="empty-text">이 퀴즈는 JavaScript 로 동작합니다. 브라우저에서 스크립트를 허용해 주세요.</p></section></div></noscript>
  </main>

  <footer class="actions" id="actions" hidden>
    <div class="actions-inner od-row">
      <button type="button" class="btn od-fixed" id="prev">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
        <span>이전</span>
      </button>
      <button type="button" class="btn od-fill" id="next">
        <span id="next-label">건너뛰기</span>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
      </button>
    </div>
  </footer>
</div>

<dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
  <div class="confirm-inner">
    <h2 id="confirm-title">처음부터 다시 풀까요?</h2>
    <p>지금까지 고른 답과 점수가 모두 지워집니다.</p>
    <div class="confirm-actions od-row">
      <button type="button" class="btn od-fill" id="confirm-cancel" autofocus>취소</button>
      <button type="button" class="btn btn-danger od-fill" id="confirm-ok">다시 풀기</button>
    </div>
  </div>
</dialog>

<script>
/* ════════════ 데이터 블록 — 회차마다 여기만 바꾼다 ════════════
   META  date 회차 MMDD · chapter 단원 · range 실강 범위 한 줄 · note 상단 안내 (선택, 없으면 빈 문자열)
   QUIZ  항목 필드 순서 = n · src · q · opts · answer · why · trap · keyNote · ref   (정리노트/CLAUDE.md §11)
         src      선택. 두 장에 걸친 회차만 쓰고 n 바로 다음에 둔다 (§13). 단일 출처 회차는 통째로 지운다.
         answer   0부터 센다
         why      모든 항목에 반드시 단다 → 정답 보기 아래에 '정답 해설'로 펼쳐진다
         trap     { 오답 인덱스 → 진단 } → 그 보기 아래에 펼쳐진다. 오답마다 달면 모든 보기에 해설이 나온다
         keyNote  선택. 답안지 오류 · 빈칸 문항의 보기 재구성 안내 → 문항 위 '주의' 태그 + 판정 패널
         ref      MMDD.md 의 "### §N-N …" 헤딩 문자열과 글자 단위로 일치
   아래 예시 3문항(번호 앞 '예시')은 모두 지우고 이번 회차 문항으로 바꾼다.
   ═══════════════════════════════════════════════════════════ */
const META = {
  date: "MMDD",
  chapter: "N장 단원명",
  range: "이번 회차 실강 진도 한 줄 요약",
  note: "실강 퀴즈 — 이번 STT에서 직접 다룬 문항만 넣습니다. 범위 밖 문항은 다음 회차로 미룹니다."
};
const QUIZ = [
{n:1,src:"예시",q:"세포호흡에서 전자전달계의 최종 전자수용체는?",opts:["이산화탄소","산소","물","NAD+"],answer:1,why:"산소가 전자와 H+를 받아 물이 된다. 산소가 없으면 전자가 빠져나갈 곳이 없어 전자전달계가 멈춘다.",trap:{0:"이산화탄소는 시트르산 회로에서 탄소가 떨어져 나온 산물이다. 전자를 받는 쪽이 아니다.",2:"물은 산소가 전자를 받은 뒤의 생성물이다. 받는 쪽과 생기는 쪽을 구분하자.",3:"NAD+는 해당과정·시트르산 회로에서 전자를 잠시 받는 운반체이지 최종 수용체가 아니다."},ref:"§1-1 예시 절 — md의 ### 헤딩 문자열을 그대로 붙여 넣는다"},
{n:2,src:"예시",q:"효소가 화학반응을 촉진하는 방식은?",opts:["기질에 ATP를 공급한다","반응의 활성화에너지를 낮춘다","반응의 평형을 생성물 쪽으로 옮긴다","반응 후 스스로 소모된다"],answer:1,why:"효소는 반응을 시작하는 에너지 문턱만 낮춘다. 평형과 가역성은 바꾸지 않으며, 반응 뒤에도 변하지 않아 다시 쓰인다.",trap:{2:"반응이 빨라질 뿐 평형의 위치는 그대로다."},keyNote:"인쇄된 답안지에는 ③으로 표시되어 있으나 오류로 판단됩니다.",ref:"§1-2 예시 절 — 답안지 오류 문항은 keyNote로 드러낸다"},
{n:3,src:"예시",q:"엽록체 내막 안쪽을 채우는 유동액은 (   )이다.",opts:["스트로마","틸라코이드","그라나","막간공간"],answer:0,why:"스트로마는 내막 안쪽의 유동액이다. 틸라코이드는 그 안의 막 주머니이고, 그라나는 틸라코이드가 쌓인 더미다.",keyNote:"원문은 보기 없는 빈칸 문항이라 보기를 새로 구성했습니다.",ref:"§1-3 예시 절 — 빈칸 문항도 같은 형식으로 넣는다"}
];
/* ════════════ 엔진 — 회차마다 그대로 재사용한다. 수정하지 않는다 ════════════ */
(() => {
  "use strict";
  const MARK = "①②③④⑤⑥⑦⑧";
  // 아이콘은 상수 마크업만 쓴다 (데이터는 절대 innerHTML 로 넣지 않는다)
  const ICON = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    skip: '<path d="M6 12h12"/>',
    go: '<path d="M9.5 6l6 6-6 6"/>'
  };
  const $ = id => document.getElementById(id);
  const quizEl = $("quiz"), stageEl = $("stage"), mapEl = $("map");
  const scoreEl = $("score"), progEl = $("prog"), barEl = $("bar");
  const streakEl = $("streak"), roundEl = $("round"), resetBtn = $("reset");
  const actionsEl = $("actions"), prevBtn = $("prev"), nextBtn = $("next"), nextLabel = $("next-label");
  const dlg = $("confirm");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const answers = new Map();   // QUIZ 인덱스 → 고른 보기 인덱스 (메모리에만, 새로고침하면 초기화)
  const state = { order: [], pos: 0, view: "quiz", round: 0, streak: 0, busy: false };
  let cur = null;              // 지금 화면에 있는 문항의 DOM 참조
  let swapTimer = 0;

  const mark = i => MARK[i] || (i + 1) + ".";
  const moving = () => !reduceMotion.matches;
  const isRight = qi => answers.has(qi) && answers.get(qi) === QUIZ[qi].answer;
  const label = item => (item.src ? item.src + " " : "") + item.n + "번";

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function icon(name, cls) {
    const box = el("span", "i-wrap" + (cls ? " " + cls : ""));
    box.setAttribute("aria-hidden", "true");
    box.innerHTML = '<svg class="i" viewBox="0 0 24 24">' + ICON[name] + "</svg>";
    return box;
  }

  function section(title, text, cls) {
    const box = el("div", "fb-sec" + (cls ? " " + cls : ""));
    box.append(el("span", "fb-label", title), el("p", "fb-text", text));
    return box;
  }

  /* ── 헤더 ── */
  function renderMeta() {
    document.title = META.date + " 생명과학 · " + META.chapter;
    $("meta-date").textContent = META.date + " · 생명과학 정리노트";
    $("meta-chapter").textContent = META.chapter;
    $("meta-range").textContent = "실강 범위 — " + META.range;
    const srcLine = $("meta-srcline");
    srcLine.textContent = "본문은 ";
    srcLine.append(el("code", null, META.date + ".md"), " 참조 · 문항 " + QUIZ.length + "개");
    const note = $("meta-note");
    note.textContent = META.note || "";
    note.hidden = !META.note;
  }

  /* ── 문항 지도 ── */
  function buildMap() {
    mapEl.textContent = "";
    state.order.forEach((qi, pos) => {
      const b = el("button", "chip");
      b.type = "button";
      b.append(el("span", "chip-num", String(pos + 1)), el("span", "chip-mark"));
      b.addEventListener("click", () => {
        if (state.view === "quiz" && pos === state.pos) return;
        show(pos, state.view === "result" || pos < state.pos ? -1 : 1);
      });
      mapEl.append(b);
    });
  }

  function refreshMap() {
    Array.from(mapEl.children).forEach((b, pos) => {
      const qi = state.order[pos];
      const done = answers.has(qi), right = isRight(qi);
      const current = state.view === "quiz" && pos === state.pos;
      b.className = "chip" + (done ? (right ? " ok" : " no") : "") + (current ? " current" : "");
      const slot = b.lastElementChild;
      const want = done ? (right ? "check" : "cross") : "";
      if (slot.dataset.icon !== want) {
        slot.textContent = "";
        if (want) slot.append(icon(want));
        slot.dataset.icon = want;
      }
      if (current) b.setAttribute("aria-current", "step");
      else b.removeAttribute("aria-current");
      b.setAttribute("aria-label", (pos + 1) + "번째 문제 · " + label(QUIZ[qi]) + " · " + (done ? (right ? "정답" : "오답") : "안 풂"));
    });
    const chip = mapEl.children[state.pos];
    if (chip && state.view === "quiz") {
      const left = chip.offsetLeft - (mapEl.clientWidth - chip.offsetWidth) / 2;
      mapEl.scrollTo({ left: Math.max(0, left), behavior: moving() ? "smooth" : "auto" });
    }
  }

  /* ── 진행도 · 하단 바 ── */
  function refreshChrome() {
    const total = state.order.length;
    const done = state.order.filter(qi => answers.has(qi)).length;
    const correct = state.order.filter(isRight).length;
    progEl.style.transform = "scaleX(" + (total ? done / total : 0) + ")";
    barEl.setAttribute("aria-valuemax", String(Math.max(total, 1)));
    barEl.setAttribute("aria-valuenow", String(done));
    barEl.setAttribute("aria-valuetext", total + "문제 중 " + done + "문제 풀이");
    scoreEl.textContent = "풀이 " + done + "/" + total + " · 정답 " + correct;
    roundEl.hidden = state.round === 0;
    roundEl.textContent = "다시 풀기 " + state.round + "회차 · " + total + "문제";
    streakEl.hidden = state.streak < 2;
    streakEl.textContent = "연속 정답 " + state.streak;
    resetBtn.disabled = answers.size === 0 && state.round === 0;
    refreshMap();

    const onQuiz = state.view === "quiz" && total > 0;
    actionsEl.hidden = !onQuiz;
    if (onQuiz) {
      const answered = answers.has(state.order[state.pos]);
      const last = state.pos === total - 1;
      prevBtn.disabled = state.pos === 0;
      nextLabel.textContent = last ? "결과 보기" : answered ? "다음 문제" : "건너뛰기";
      nextBtn.classList.toggle("btn-primary", answered);
    }
  }

  /* ── 문항 화면 ── */
  function buildCard(pos) {
    const qi = state.order[pos], item = QUIZ[qi], opts = item.opts || [];
    const card = el("article", "card");
    card.setAttribute("aria-labelledby", "q-title");

    const head = el("div", "q-head od-cluster");
    head.append(el("span", "q-pos od-nowrap", (pos + 1) + " / " + state.order.length), el("span", "q-num od-nowrap", label(item)));
    if (item.keyNote) head.append(el("span", "tag od-nowrap", "주의"));
    const title = el("h2", "q-text", item.q);
    title.id = "q-title";
    title.tabIndex = -1;
    card.append(head, title);

    let hint = null;
    if (answers.size === 0) {
      hint = el("p", "q-hint", "보기를 고르면 보기마다 해설이 펼쳐집니다.");
      card.append(hint);
    }

    const list = el("div", "opts od-stack");
    list.setAttribute("role", "group");
    list.setAttribute("aria-labelledby", "q-title");
    const items = opts.map((opt, i) => {
      const wrap = el("div", "opt-item");
      const b = el("button", "opt od-row-top");
      b.type = "button";
      b.append(el("span", "opt-mark od-fixed", mark(i)), el("span", "opt-text od-fill", opt));
      b.addEventListener("click", () => choose(qi, i));
      wrap.append(b);
      list.append(wrap);
      return wrap;
    });

    const fb = el("div", "fb");
    fb.tabIndex = -1;
    fb.hidden = true;
    card.append(list, fb);

    cur = { qi, pos, card, items, fb, hint };
    if (answers.has(qi)) reveal(false);
    return card;
  }

  function choose(qi, picked) {
    if (state.busy || state.view !== "quiz" || !cur || cur.qi !== qi || answers.has(qi)) return;
    answers.set(qi, picked);
    state.streak = picked === QUIZ[qi].answer ? state.streak + 1 : 0;
    if (cur.hint) cur.hint.remove();
    reveal(true);
    refreshChrome();
    if (state.streak >= 2) {
      streakEl.classList.remove("bump");
      void streakEl.offsetWidth;
      streakEl.classList.add("bump");
    }
    cur.fb.focus({ preventScroll: true });
  }

  // 보기마다 해설을 펼친다. 순서: 내가 고른 보기 → 정답 → 나머지 (40ms 시차)
  function reveal(animate) {
    const { qi, items, fb } = cur;
    const item = QUIZ[qi], picked = answers.get(qi), right = picked === item.answer, trap = item.trap || {};
    const seq = [picked, item.answer];
    items.forEach((_, i) => seq.push(i));
    const order = seq.filter((v, k) => v >= 0 && v < items.length && seq.indexOf(v) === k);

    order.forEach((i, step) => {
      const wrap = items[i], btn = wrap.firstElementChild;
      btn.disabled = true;
      let kind = "dim", badge = "오답", title = "", text = "";
      if (i === item.answer) {
        kind = "ok"; badge = i === picked ? "내 선택 · 정답" : "정답"; title = "정답 해설"; text = item.why || "";
      } else if (i === picked) {
        kind = "no"; badge = "내 선택"; title = "함정 진단"; text = trap[i] || "";
      } else if (trap[i]) {
        kind = "trap"; badge = "함정"; title = "이 보기가 끌리는 이유"; text = trap[i];
      }
      wrap.classList.add("done", kind);
      btn.append(el("span", "badge od-fixed od-nowrap", badge));
      if (text) {
        const note = el("div", "opt-note");
        note.append(el("span", "note-label", title), el("p", "note-text", text));
        if (animate) {
          note.classList.add("animate");
          note.style.setProperty("--delay", step * 40 + "ms");
        }
        wrap.append(note);
      }
    });

    // 판정 패널 (SKILL.md 브라우저 점검용 클래스: fb ok / fb no)
    fb.className = "fb " + (right ? "ok" : "no") + (animate ? " animate" : "");
    if (animate) fb.style.setProperty("--delay", order.length * 40 + "ms");
    fb.textContent = "";
    const head = el("div", "fb-head od-row");
    head.append(icon(right ? "check" : "cross", "od-fixed"), el("p", "fb-verdict od-fill", right ? "정답입니다" : "오답입니다 · 정답은 " + mark(item.answer)));
    fb.append(head);
    if (animate && right && state.streak >= 2) fb.append(el("p", "fb-sub", state.streak + "문제 연속 정답이에요."));
    if (item.keyNote) fb.append(section("주의", item.keyNote, "keynote"));
    fb.append(section("본문 참조", META.date + ".md " + (item.ref || ""), "fb-ref"));
    if (cur.pos !== state.order.length - 1 && state.order.every(q => answers.has(q))) {
      fb.append(el("p", "fb-done", "이번 판의 모든 문제를 풀었어요."));
      const go = el("button", "btn", "결과 보기");
      go.type = "button";
      go.addEventListener("click", showResult);
      fb.append(go);
    }
    fb.hidden = false;
  }

  /* ── 화면 전환 ── */
  function show(pos, dir) {
    clearTimeout(swapTimer);
    const old = quizEl.firstElementChild;
    if (!moving() || !old || !dir) { mount(pos, dir, true); return; }
    state.busy = true;
    old.classList.remove("enter-left", "enter-right");
    old.classList.add(dir > 0 ? "leave-left" : "leave-right");
    swapTimer = setTimeout(() => mount(pos, dir, true), 160);
  }

  function mount(pos, dir, focus) {
    state.busy = false;
    state.view = "quiz";
    state.pos = pos;
    quizEl.textContent = "";
    const card = buildCard(pos);
    if (dir && moving()) card.classList.add(dir > 0 ? "enter-right" : "enter-left");
    quizEl.append(card);
    stageEl.scrollTop = 0;
    refreshChrome();
    if (focus) card.querySelector(".q-text").focus({ preventScroll: true });
  }

  function next() {
    if (state.view !== "quiz" || !state.order.length) return;
    if (state.pos < state.order.length - 1) show(state.pos + 1, 1);
    else showResult();
  }

  function prev() {
    if (!state.order.length) return;
    if (state.view === "result") { show(state.order.length - 1, -1); return; }
    if (state.pos > 0) show(state.pos - 1, -1);
  }

  /* ── 결과 화면 ── */
  function showResult() {
    clearTimeout(swapTimer);
    state.busy = false;
    state.view = "result";
    cur = null;
    quizEl.textContent = "";
    const res = buildResult();
    if (moving()) res.classList.add("enter-right");
    quizEl.append(res);
    stageEl.scrollTop = 0;
    refreshChrome();
    res.querySelector(".result-title").focus({ preventScroll: true });
  }

  function buildResult() {
    const total = state.order.length;
    const wrong = [], skipped = [];
    let correct = 0;
    state.order.forEach((qi, pos) => {
      if (!answers.has(qi)) skipped.push(pos);
      else if (isRight(qi)) correct += 1;
      else wrong.push(pos);
    });
    const rate = total ? Math.round(correct / total * 100) : 0;

    const box = el("section", "result");
    box.setAttribute("aria-labelledby", "result-title");
    const hero = el("div", "result-hero");
    const title = el("h2", "result-title",
      correct === total ? "모두 맞혔어요"
        : skipped.length ? "아직 안 푼 문제가 " + skipped.length + "개 있어요"
        : "틀린 문제를 다시 짚어 볼까요");
    title.id = "result-title";
    title.tabIndex = -1;
    const big = el("p", "score-big od-nowrap");
    big.append(el("span", "score-num", String(correct)), el("span", "score-den", " / " + total));
    hero.append(el("p", "eyebrow", state.round ? "다시 풀기 " + state.round + "회차 결과" : "풀이 결과"), title, big, el("p", "score-rate", "정답률 " + rate + "%"));

    const stats = el("div", "stats od-grid");
    [["정답", correct, "ok"], ["오답", wrong.length, "no"], ["안 푼 문제", skipped.length, "skip"]].forEach(([name, num, kind]) => {
      const s = el("div", "stat od-stat " + kind);
      s.append(el("span", "stat-num", String(num)), el("span", "stat-label", name));
      stats.append(s);
    });
    hero.append(stats);
    if (state.round) {
      const overall = QUIZ.filter((_, qi) => isRight(qi)).length;
      hero.append(el("p", "overall", "전체 " + QUIZ.length + "문제 기준 정답 " + overall + "개"));
    }
    box.append(hero);

    const miss = wrong.concat(skipped).sort((a, b) => a - b);
    box.append(el("h3", "review-title", "다시 볼 문제"));
    if (!miss.length) {
      box.append(el("p", "review-empty", "틀리거나 건너뛴 문제가 없습니다."));
    } else {
      const list = el("ul", "review");
      miss.forEach(pos => {
        const qi = state.order[pos], item = QUIZ[qi], done = answers.has(qi);
        const li = el("li");
        const b = el("button", "review-item od-row-top " + (done ? "no" : "skip"));
        b.type = "button";
        const body = el("span", "od-field od-fill");
        body.append(
          el("span", "review-meta", (pos + 1) + "번째 · " + label(item) + " · " + (done ? "틀림" : "안 풂")),
          el("span", "review-q od-clamp-2", item.q)
        );
        b.append(icon(done ? "cross" : "skip", "review-icon od-fixed"), body, icon("go", "review-go od-fixed"));
        b.addEventListener("click", () => show(pos, -1));
        li.append(b);
        list.append(li);
      });
      box.append(list);
    }

    const actions = el("div", "result-actions od-stack");
    if (miss.length) {
      const retry = el("button", "btn btn-primary", "놓친 문제 다시 풀기 · " + miss.length);
      retry.type = "button";
      retry.addEventListener("click", () => startRound(miss.map(pos => state.order[pos])));
      actions.append(retry);
    }
    const again = el("button", "btn" + (miss.length ? "" : " btn-primary"), "처음부터 다시 풀기");
    again.type = "button";
    again.addEventListener("click", openConfirm);
    const back = el("button", "btn btn-ghost", "1번 문제부터 다시 보기");
    back.type = "button";
    back.addEventListener("click", () => show(0, -1));
    actions.append(again, back);
    box.append(actions);
    return box;
  }

  /* ── 판 다시 짜기 ── */
  function startRound(list) {
    state.round += 1;
    state.order = list;
    list.forEach(qi => answers.delete(qi));
    buildMap();
    show(0, 1);
  }

  function restartAll() {
    state.round = 0;
    state.streak = 0;
    state.order = QUIZ.map((_, i) => i);
    answers.clear();
    buildMap();
    show(0, -1);
  }

  function openConfirm() {
    if (typeof dlg.showModal === "function") dlg.showModal();
    else if (window.confirm("풀이 기록을 지우고 처음부터 다시 풀까요?")) restartAll();
  }

  // 작성 실수는 개발자 도구 콘솔에 경고로 알린다 (화면에는 드러내지 않는다)
  function lint() {
    const seen = new Set();
    QUIZ.forEach((item, i) => {
      const at = "QUIZ[" + i + "] ";
      const opts = Array.isArray(item.opts) ? item.opts : [];
      if (opts.length < 2) console.warn(at + "보기(opts)가 2개 미만입니다");
      if (opts.length > 8) console.warn(at + "보기가 8개를 넘으면 숫자 키로 고를 수 없습니다");
      if (!(Number.isInteger(item.answer) && item.answer >= 0 && item.answer < opts.length)) {
        console.warn(at + "answer 가 보기 범위를 벗어났습니다 (0부터 셉니다)");
      }
      if (!item.why) console.warn(at + "why(해설)가 비어 있습니다");
      if (!item.ref) console.warn(at + "ref(본문 절)가 비어 있습니다");
      if (item.trap && Object.prototype.hasOwnProperty.call(item.trap, item.answer)) {
        console.warn(at + "trap 이 정답 보기에 달려 있습니다");
      }
      const key = (item.src || "") + "#" + item.n;
      if (seen.has(key)) console.warn(at + "문항 번호가 중복됩니다 (" + key + ")");
      seen.add(key);
    });
  }

  /* ── 이벤트 ── */
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);
  resetBtn.addEventListener("click", openConfirm);
  $("confirm-cancel").addEventListener("click", () => dlg.close());
  $("confirm-ok").addEventListener("click", () => { dlg.close(); restartAll(); });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  document.addEventListener("keydown", e => {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || dlg.open || !state.order.length) return;
    const onControl = e.target.closest && e.target.closest("button, summary, a, input, textarea, select");
    if (state.view === "quiz") {
      const qi = state.order[state.pos];
      if (/^[1-8]$/.test(e.key)) {
        const i = Number(e.key) - 1;
        if (!answers.has(qi) && i < (QUIZ[qi].opts || []).length) { e.preventDefault(); choose(qi, i); }
        return;
      }
      if (e.key === "Enter" && !onControl && answers.has(qi)) { e.preventDefault(); next(); return; }
    }
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  });

  /* ── 시작 ── */
  renderMeta();
  lint();
  if (!QUIZ.length) {
    const empty = el("section", "empty");
    empty.append(
      el("h2", "empty-title", "아직 문항이 없습니다"),
      el("p", "empty-text", "파일 상단 데이터 블록의 QUIZ 배열에 문항을 넣으면 여기에 한 문제씩 나타납니다.")
    );
    quizEl.append(empty);
    $("map-wrap").hidden = true;
    refreshChrome();
  } else {
    state.order = QUIZ.map((_, i) => i);
    buildMap();
    mount(0, 0, false);
  }
})();
</script>
</body>
</html>
