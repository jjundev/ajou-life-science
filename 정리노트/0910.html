<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0910 생명과학 · 1장 예습</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#22201d; --muted:#6b6560; --line:#e2ddd6;
    --card:#fff; --ok:#1f7a4d; --okbg:#e8f5ee; --no:#b3261e; --nobg:#fdecea;
    --accent:#2f5d8a; --warn:#8a5a00; --warnbg:#fdf3e0;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17161a; --fg:#e8e5e0; --muted:#9d968e; --line:#332f36;
      --card:#201e24; --ok:#5ec98d; --okbg:#12301f; --no:#f2857c; --nobg:#331a18;
      --accent:#8ab4e8; --warn:#e8c07a; --warnbg:#2e2415;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px}
  header h1{font-size:20px;margin:0 0 4px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:20px 0 14px}
  .q h3{margin:0 0 10px;font-size:15px;font-weight:600;line-height:1.55}
  .q h3 span.num{color:var(--muted);font-weight:400;margin-right:6px}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--warnbg);color:var(--warn);margin-left:6px;vertical-align:2px;font-weight:500;white-space:nowrap}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;font-size:14px;line-height:1.5;font-family:inherit}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default;opacity:.7}
  .opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:1;font-weight:600}
  .opt.no{background:var(--nobg);border-color:var(--no);color:var(--no);opacity:1}
  .fb{margin-top:10px;padding:11px 13px;border-radius:8px;font-size:13.5px;line-height:1.65}
  .fb.ok{background:var(--okbg);border-left:3px solid var(--ok)}
  .fb.no{background:var(--nobg);border-left:3px solid var(--no)}
  .fb .ref{display:block;margin-top:7px;color:var(--muted);font-size:12.5px}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:20px 0 8px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .score{font-size:13px;color:var(--muted);margin-bottom:14px}
  .reset{margin-top:18px;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
  .note{font-size:13px;color:var(--muted);margin:20px 0 14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>0910 생명과학 · 1장 마지막 부분 예습</h1>
  <p>예습 범위 1.3.3 세포골격 후반 ~ 1.4.2 세포막의 수송 · 본문 설명은 <code>0910.md</code> 참조</p>
</header>

<p class="note"><b>예습 퀴즈</b> — 1강 합본에서 아직 1장 마지막 범위와 직접 연결되는 32·40번입니다. 먼저 답을 생각한 뒤 선택지를 눌러 보세요.</p>
<div class="bar"><i id="prog"></i></div>
<div class="score" id="score"></div>
<div id="quiz"></div>
<button class="reset" id="reset">처음부터 다시 풀기</button>
</div>

<script>
const META = { date:"0910", chapter:"1장 생물분자와 세포", range:"1.3.3 세포골격 후반 ~ 1.4.2 세포막의 수송" };
const QUIZ = [
  { n:32,
    q:"극성을 띠는 어떤 아미노산이 에너지를 사용하지 않고 농도기울기에 의해서만 막의 수송체 단백질을 통해 수송된다면 이것은?",
    opts:["능동수송","아미노산 펌프","촉진확산","단순확산","삼투"],
    answer:2,
    why:"극성 아미노산은 지질 2중층을 직접 통과하기 어렵기 때문에 수송체 단백질을 이용합니다. 하지만 에너지를 쓰지 않고 농도기울기를 따르므로 촉진확산입니다.",
    trap:{ 0:"능동수송은 농도기울기에 거슬러 이동하며 에너지가 필요합니다.", 3:"단순확산은 수송체 단백질을 사용하지 않고 지질층을 직접 통과합니다.", 4:"삼투는 물의 이동입니다. 아미노산 수송을 삼투라고 하지 않습니다." },
    ref:"§6-2 촉진확산" },
  { n:40,
    q:"세포막의 수송 과정에서 사용되는 수송 메커니즘에 대한 설명 중 옳은 것은?",
    opts:["촉진확산은 특정 분자를 가리지 않고 모든 분자에서 가능하다","촉진확산은 지질막을 통해 수송된다","삼투현상은 능동수송의 대표적인 예라고 할 수 있다","단순확산은 수송되는 분자가 고농도가 되면 포화되어 멈추게 된다","능동수송의 경우 수송되는 물질의 농도기울기와 반대 방향으로 작용한다"],
    answer:4,
    why:"능동수송은 에너지를 사용해 물질을 농도기울기에 거슬러 이동시킵니다. 촉진확산은 특정 수송 단백질을 사용하고, 삼투는 수동수송이며, 단순확산은 운반체 포화가 핵심 조건이 아닙니다.",
    trap:{ 0:"촉진확산은 특정 채널·운반체의 선택성을 받습니다.", 1:"촉진확산은 지질층을 직접 통과하는 것이 아니라 수송 단백질을 이용합니다.", 2:"삼투는 물의 수동수송입니다.", 3:"운반체 포화는 촉진확산·능동수송에서 문제되며 단순확산의 특징이 아닙니다." },
    ref:"§6–§7 수동수송·능동수송" }
];

const $ = s => document.querySelector(s);
const MARK = "①②③④⑤";
const state = { done:0, correct:0 };

function render(){
  $("#quiz").innerHTML = "";
  state.done = 0; state.correct = 0;
  QUIZ.forEach(item => $("#quiz").appendChild(card(item)));
  updateScore();
}

function card(item){
  const el = document.createElement("div"); el.className = "q";
  const h = document.createElement("h3");
  const num = document.createElement("span"); num.className = "num";
  num.textContent = item.n + "."; h.appendChild(num); h.appendChild(document.createTextNode(item.q));
  if (item.keyNote){ const t=document.createElement("span"); t.className="tag"; t.textContent="주의"; h.appendChild(t); }
  el.appendChild(h);
  const fb = document.createElement("div");
  const buttons = item.opts.map((text,i)=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=(MARK[i]||((i+1)+"."))+" "+text;
    b.addEventListener("click",()=>choose(item,i,buttons,fb)); el.appendChild(b); return b;
  });
  el.appendChild(fb); return el;
}

function choose(item,picked,buttons,fb){
  buttons.forEach(b=>b.disabled=true); buttons[item.answer].classList.add("ok");
  const right=picked===item.answer; if(!right) buttons[picked].classList.add("no");
  fb.className="fb "+(right?"ok":"no");
  const head=right?"<b>정답입니다.</b> ":"<b>오답입니다.</b> ";
  const diag=(!right&&item.trap&&item.trap[picked])?item.trap[picked]+"<br>":"";
  fb.innerHTML=head+diag+item.why+'<span class="ref">→ '+META.date+'.md '+item.ref+' 참조</span>';
  state.done++; if(right) state.correct++; updateScore();
}

function updateScore(){
  $("#score").textContent=state.done+" / "+QUIZ.length+" 풀이 · 정답 "+state.correct;
  $("#prog").style.width=(state.done/QUIZ.length*100)+"%";
}

$("#reset").addEventListener("click",render); render();
</script>
</body>
</html>
