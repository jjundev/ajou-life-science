{n:33,src:"2강",q:"미토콘드리아 내막에서 일어나는 작용은?",opts:["시트르산 회로","해당과정","산화적 인산화","발효","기질 수준 인산화"],answer:2,why:"전자전달계와 ATP 합성효소가 미토콘드리아 내막에 있어 산화적 인산화가 일어난다.",ref:"§2-6 전자전달계와 산화적 인산화 — H+ 기울기로 ATP 합성효소를 돌린다"},

{n:35,src:"2강",q:"ATP는 어떻게 세포에 에너지를 제공하는가?",opts:["미토콘드리아에서 양성자를 방출한다","전자를 방출한다","인산기를 얻는다","인산기를 잃고 에너지를 방출한다"],answer:3,why:"ATP 가수분해로 ATP가 ADP가 될 때 에너지가 방출된다.",ref:"§2-1 ATP — 전자의 위치에너지를 꺼내 쓰는 화폐"},
{n:37,src:"2강",q:"화학삼투적 인산화를 통한 ATP 합성에 필요한 것은?",opts:["전자전달계","손상되지 않은 미토콘드리아나 엽록체","모든 요소","H+ 농도기울기","ADP"],answer:2,why:"전자전달계, 막, H+ 기울기, ATP 합성효소와 ADP가 함께 있어야 한다.",ref:"§2-6 전자전달계와 산화적 인산화 — H+ 기울기로 ATP 합성효소를 돌린다"},
{n:38,src:"2강",q:"포도당 한 분자당 가장 많은 ATP를 생성하는 대사 과정은?",opts:["해당과정","시트르산 회로","전자전달계","피루브산 산화"],answer:2,why:"대부분의 ATP는 전자전달계가 만든 H+ 기울기를 이용하는 산화적 인산화에서 생성된다.",ref:"§2-6 전자전달계와 산화적 인산화 — H+ 기울기로 ATP 합성효소를 돌린다"},
{n:39,src:"2강",q:"효소에 대한 다음 진술 중 맞는 것은?",opts:["결합 특이성이 매우 낮다","여러 번 재사용된다","고열 영향을 받지 않는다","화학 반응에서 소모된다"],answer:1,why:"효소는 반응 후 변하지 않아 다시 기질과 결합할 수 있다.",ref:"§2-2 효소 — 반응의 종착점이 아니라 언덕을 낮춘다"},

{n:43,src:"2강",q:"전자전달계란 무엇인가?",opts:["미토콘드리아 기질에 있는 구조","막간공간의 효소 하나","내막의 뉴클레오타이드","단백질 사이로 전자를 전달하며 H+를 막간공간으로 옮기는 계"],answer:3,why:"전자전달계는 내막의 단백질 복합체들이 전자 에너지로 H+ 농도기울기를 만드는 장치다.",ref:"§2-6 전자전달계와 산화적 인산화 — H+ 기울기로 ATP 합성효소를 돌린다"},

/* ─── 아래 엔진은 회차마다 그대로 재사용 ────────────────────── */
const $=s=>document.querySelector(s); const MARK="①②③④⑤"; const state={done:0,correct:0};
function render(){$("#quiz").innerHTML="";state.done=0;state.correct=0;QUIZ.forEach(item=>$("#quiz").appendChild(card(item)));updateScore()}
function card(item){const el=document.createElement("div");el.className="q";const h=document.createElement("h3");const num=document.createElement("span");num.className="num";num.textContent=(item.src?item.src+" ":"")+item.n+".";h.appendChild(num);h.appendChild(document.createTextNode(item.q));if(item.keyNote){const t=document.createElement("span");t.className="tag";t.textContent="주의";h.appendChild(t)}el.appendChild(h);const fb=document.createElement("div");const buttons=item.opts.map((text,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=(MARK[i]||i+1+".")+" "+text;b.addEventListener("click",()=>choose(item,i,buttons,fb));el.appendChild(b);return b});el.appendChild(fb);return el}
function choose(item,picked,buttons,fb){buttons.forEach(b=>b.disabled=true);buttons[item.answer].classList.add("ok");const right=picked===item.answer;if(!right)buttons[picked].classList.add("no");fb.className="fb "+(right?"ok":"no");const head=right?"<b>정답입니다.</b> ":"<b>오답입니다.</b> ";const diag=(!right&&item.trap&&item.trap[picked])?item.trap[picked]+"<br>":"";const key=item.keyNote?'<span class="keynote">'+item.keyNote+"</span>":"";fb.innerHTML=head+diag+item.why+'<span class="ref">→ '+META.date+".md "+item.ref+" 참조</span>"+key;state.done++;if(right)state.correct++;updateScore()}
function updateScore(){$("#score").textContent=state.done+" / "+QUIZ.length+" 풀이 · 정답 "+state.correct;$("#prog").style.width=(state.done/QUIZ.length*100)+"%"}$("#reset").addEventListener("click",render);render();
</script></body></html>
