<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0901 생명과학 · 1장 연습</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#22201d; --muted:#6b6560; --line:#e2ddd6;
    --card:#fff; --ok:#1f7a4d; --okbg:#e8f5ee; --no:#b3261e; --nobg:#fdecea;
    --accent:#2f5d8a; --warn:#8a5a00; --warnbg:#fdf3e0;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17161a; --fg:#e8e5e0; --muted:#9d968e; --line:#332f36;
      --card:#201e24; --ok:#5ec98d; --okbg:#12301f; --no:#f2857c; --nobg:#331a18;
      --accent:#8ab4e8; --warn:#e8c07a; --warnbg:#2e2415;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px}
  header h1{font-size:20px;margin:0 0 4px}
  header p{margin:0;color:var(--muted);font-size:13px}
  nav{display:flex;gap:8px;margin:20px 0}
  nav button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);
             color:var(--fg);border-radius:8px;cursor:pointer;font-size:14px}
  nav button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .score{font-size:13px;color:var(--muted);margin-bottom:14px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;
     padding:16px;margin-bottom:14px}
  .q h3{margin:0 0 10px;font-size:15px;font-weight:600;line-height:1.55}
  .q h3 span.num{color:var(--muted);font-weight:400;margin-right:6px}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;
       background:var(--warnbg);color:var(--warn);margin-left:6px;vertical-align:2px;
       font-weight:500;white-space:nowrap}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
       border:1px solid var(--line);border-radius:8px;background:transparent;
       color:var(--fg);cursor:pointer;font-size:14px;line-height:1.5;font-family:inherit}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default;opacity:.7}
  .opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:1;font-weight:600}
  .opt.no{background:var(--nobg);border-color:var(--no);color:var(--no);opacity:1}
  .fb{margin-top:10px;padding:11px 13px;border-radius:8px;font-size:13.5px;line-height:1.65}
  .fb.ok{background:var(--okbg);border-left:3px solid var(--ok)}
  .fb.no{background:var(--nobg);border-left:3px solid var(--no)}
  .fb .ref{display:block;margin-top:7px;color:var(--muted);font-size:12.5px}
  .fb .keynote{display:block;margin-top:7px;padding:8px 10px;border-radius:6px;
               background:var(--warnbg);color:var(--warn);font-size:12.5px}
  .reset{margin-top:18px;padding:9px 16px;border:1px solid var(--line);
         background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer;
         font-size:14px;font-family:inherit}
  .note{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.6}
  section[hidden]{display:none}
  input[type=range]{width:100%;margin:12px 0;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>0901 생명과학 · 1장 생물분자와 세포 (1)</h1>
  <p>강의 범위 1.1.1 · 본문 설명은 <code>0901.md</code> 참조</p>
</header>

<section id="paneQuiz" style="margin-top:20px">
  <p class="note">
    <b>결석 회차입니다.</b> 강의 녹음이 없어 강의노트와 교재로 재구성했습니다 —
    교수님이 구두로 강조한 함정 경고가 빠져 있을 수 있습니다.<br>
    <code>1강 합본</code> 40문항 중 <b>이 회차 범위인 5문항</b>입니다.
  </p>
  <div class="bar"><i id="prog"></i></div>
  <div class="score" id="score"></div>
  <div id="quiz"></div>
  <button class="reset" id="reset">처음부터 다시 풀기</button>
</section>

</div>

<script>
/* ─── 회차마다 이 블록만 교체 ──────────────────────────────── */
const META = { date:"0901", chapter:"1장 생물분자와 세포", range:"1.1.1" };

const QUIZ = [
  { n:2,
    q:"진화론에 의하면, 지구상의 모든 생명체는 하나의 공통 조상으로부터 생겨났다고 한다. 이를 지지하는 근거가 될 수 있는 보기는 다음 중 무엇인가?",
    opts:["같은 방법으로 생식한다.","공통적인 유기 화학을 공유한다.","핵 속에 DNA를 갖고 있다","기본적으로 같은 세포벽을 보인다."],
    answer:1,
    why:"세균부터 사람까지 모두 DNA로 정보를 저장하고, 같은 20가지 아미노산으로 단백질을 만들고, 같은 유전암호를 씁니다. 겉모습이 아니라 이 공통된 화학이 하나의 조상에서 갈라져 나왔다는 증거입니다.",
    trap:{ 0:"생식 방법은 무성·유성으로 제각각이라 공통점이 아닙니다.",
           2:"원핵생물에는 핵이 없습니다. DNA는 모두 갖고 있지만 '핵 속에'가 틀렸습니다.",
           3:"동물세포에는 세포벽이 없습니다. 세포벽을 가진 생물도 성분이 제각각입니다(식물은 섬유소, 균류는 키틴)." },
    keyNote:"주의 — 인쇄된 답안지에는 '기본적으로 같은 세포벽을 보인다'로 표시되어 있으나 오류로 판단됩니다. 동물세포에는 세포벽이 아예 없습니다. 답안지를 그대로 외우지 마세요.",
    ref:"§1-1 무엇이 생물인가 — 여덟 가지 특징" },

  { n:16,
    q:"생명의 계층구조 중, 같은 지역을 점유하고 있는 같은 종류(종)들의 집단을 뜻하는 것은 무엇인가?",
    opts:["개체군","생태계","군집","생물권"],
    answer:0,
    why:"개체군은 같은 지역에 사는 같은 종의 개체 모임입니다. 종이 하나라는 점이 핵심입니다.",
    trap:{ 1:"생태계는 군집에 무생물 환경까지 더한 것입니다.",
           2:"군집은 여러 개체군의 모임이므로 여러 종이 섞여 있습니다.",
           3:"생물권은 지구상 생태계 전체입니다." },
    ref:"§2-1 계층구조" },

  { n:19,
    q:"다음 중 생물체의 특징이 아닌 것은?",
    opts:["물질대사","세포소기관의 존재","항상성","생식과 발생"],
    answer:1,
    why:"모든 생물이 세포로 이루어진 것은 맞지만, 막으로 둘러싸인 세포소기관은 진핵생물에만 있습니다. 원핵생물에는 없으므로 생물 전체의 특징이 될 수 없습니다.",
    trap:{ 0:"물질대사는 여덟 가지 특징에 들어갑니다.",
           2:"항상성도 여덟 가지 특징에 들어갑니다.",
           3:"생식과 발생도 여덟 가지 특징에 들어갑니다. 생식은 모든 생물, 발생은 다세포 생물입니다." },
    ref:"§1-1 무엇이 생물인가 — 여덟 가지 특징" },

  { n:21,
    q:"다음 중 물질대사에 대한 설명 중 틀린 것은?",
    opts:["고분자의 합성","노폐물의 분비","물 없이 작용하는 능력","세포호흡에서의 복잡한 분해과정","에너지를 갖고 있는 물질의 분해"],
    answer:2,
    why:"생체 반응은 전부 수용액에서 일어납니다. 반응에 참여하는 분자들이 물에 녹아야 서로 만날 수 있기 때문입니다. 물 없이 작용한다는 것은 물질대사의 성질이 아닙니다.",
    trap:{ 0:"합성은 물질대사의 한 방향입니다.",
           4:"분해도 물질대사의 한 방향입니다. 세포호흡이 대표적입니다." },
    ref:"§1-2 물질대사와 에너지 흐름" },

  { n:39,
    q:"환경변화를 탐지하여 조절 반응을 통해 내부 환경을 유지하는 생물의 능력을 무엇이라 하는가?",
    opts:["세포호흡","물질대사","항상성","세포외배출","광합성"],
    answer:2,
    why:"감지하고, 판단하고, 반응해서 체온·혈당·체액 농도 같은 내부 조건을 일정하게 유지하는 것이 항상성입니다.",
    trap:{ 1:"물질대사는 화학 활동 자체이지 조절 능력이 아닙니다.",
           0:"세포호흡은 물질대사의 한 과정입니다." },
    ref:"§1-3 항상성" }
];
/* ─── 아래 엔진은 회차마다 그대로 재사용 ────────────────────── */

const $ = s => document.querySelector(s);
const MARK = "①②③④⑤";
const state = { done:0, correct:0 };

function render(){
  $("#quiz").innerHTML = "";
  state.done = 0; state.correct = 0;
  QUIZ.forEach(item => $("#quiz").appendChild(card(item)));
  updateScore();
}

function card(item){
  const el = document.createElement("div");
  el.className = "q";

  const h = document.createElement("h3");
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = item.n + ".";
  h.appendChild(num);
  h.appendChild(document.createTextNode(item.q));
  if (item.keyNote){
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = "주의";
    h.appendChild(t);
  }
  el.appendChild(h);

  const fb = document.createElement("div");
  const buttons = item.opts.map((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = (MARK[i] || (i + 1) + ".") + " " + text;
    b.addEventListener("click", () => choose(item, i, buttons, fb));
    el.appendChild(b);
    return b;
  });
  el.appendChild(fb);
  return el;
}

function choose(item, picked, buttons, fb){
  buttons.forEach(b => b.disabled = true);
  buttons[item.answer].classList.add("ok");
  const right = picked === item.answer;
  if (!right) buttons[picked].classList.add("no");

  fb.className = "fb " + (right ? "ok" : "no");
  const head = right ? "<b>정답입니다.</b> " : "<b>오답입니다.</b> ";
  const diag = (!right && item.trap && item.trap[picked]) ? item.trap[picked] + "<br>" : "";
  const key = item.keyNote ? '<span class="keynote">' + item.keyNote + "</span>" : "";
  fb.innerHTML = head + diag + item.why +
                 '<span class="ref">→ ' + META.date + '.md ' + item.ref + " 참조</span>" + key;

  state.done++; if (right) state.correct++;
  updateScore();
}

function updateScore(){
  $("#score").textContent = state.done + " / " + QUIZ.length +
                            " 풀이 · 정답 " + state.correct;
  $("#prog").style.width = (state.done / QUIZ.length * 100) + "%";
}

$("#reset").addEventListener("click", render);

render();
</script>
</body>
</html>
