<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="위에서 본 뇌의 왼쪽 반쪽과 오른쪽 반쪽을 가운데 다리가 잇는다. 오른쪽 반쪽에서 몸 왼쪽으로, 왼쪽 반쪽에서 몸 오른쪽으로 선이 엇갈려 간다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
