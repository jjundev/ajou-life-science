<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="등 쪽에서 올라온 긴 줄 위에 테두리 칸 세 개가 기둥처럼 쌓여 있고, 맨 아래 칸은 숨과 심장 박자, 가운데 칸은 숨 고르기, 맨 위 칸은 눈 굴리기를 맡는다고 적힌 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
