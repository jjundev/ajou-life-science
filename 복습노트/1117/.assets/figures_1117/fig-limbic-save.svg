<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="왼쪽 잠깐 메모장 테두리 상자에서 가운데 저장 버튼 동그라미를 지나 오른쪽 오래 보관함 상자로 가는 길이 있고, 저장 버튼에 엑스 표시가 그어져 길이 끊겼으며, 보관함 안에는 옛날 기억을 뜻하는 색칠된 점들이 남아 있는 그림"><style>
