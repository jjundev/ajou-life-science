</style><rect x="0" y="34" width="500" height="140" rx="10" fill="#ffffff"/><title id="p32-fig-basilar-title">달팽이관을 곧게 편 기저막 모식도. 왼쪽 끝에 타원창이 있고 소리 진동이 그쪽에서 들어온다. 기저막은 타원창 쪽이 좁고 달팽이관 끝 쪽으로 갈수록 넓어진다. 타원창 쪽부터 위치 A, B, C, D, E가 차례로 표시되어 있다.</title>
