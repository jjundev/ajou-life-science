<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="몸 테두리 왼쪽 위에 숨 쉬는 주머니가 있고, 바깥 공기가 그 주머니로 들어온 뒤 색칠된 점들이 피가 도는 고리를 타고 몸 깊은 곳의 세포 테두리까지 가는 그림"><style>
