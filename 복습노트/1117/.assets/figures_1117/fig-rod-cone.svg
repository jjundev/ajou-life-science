<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽은 막대처럼 생긴 세포 한 가지, 오른쪽은 원뿔처럼 생긴 세포 세 가지(빨강, 초록, 파랑)다. 막대와 원뿔 안에는 얇은 판이 층층이 쌓여 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
