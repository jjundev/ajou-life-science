<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="왼쪽 상자는 도망칠 때 심장이 빨리 뛰고 배는 쉬는 모습, 오른쪽 상자는 쉴 때 심장이 천천히 뛰고 배가 일하는 모습을 나란히 보여 주는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
