<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="테두리 상자 여섯 개가 왼쪽부터 공기 떨림, 얇은 막, 작은 뼈 세 개, 물이 찬 달팽이 관, 털 달린 세포, 뇌 순서로 화살표로 이어진다. 아래에는 달팽이 관을 쭉 편 띠가 소리가 들어오는 왼쪽에서 좁고 오른쪽 끝으로 갈수록 넓게 그려져 있고, 왼쪽 색칠된 점에 높은 소리는 여기, 오른쪽 색칠된 점에 낮은 소리는 여기라고 적혀 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
