<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="신경계가 중추신경계와 말초신경계로, 말초신경계가 구심성 부위와 원심성 부위로, 원심성 부위가 체성신경계와 자율신경계로, 자율신경계가 교감신경계와 부교감신경계로 갈라지는 나무 모양 분류도"><style>
