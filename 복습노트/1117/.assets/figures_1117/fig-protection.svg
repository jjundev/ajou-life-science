<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="왼쪽: 바깥 테두리인 뼈 안에 물 층이 있고 그 안에 색칠된 뇌가 들어 있다. 오른쪽 위: 보통 핏줄 벽은 네모 테두리 벽돌 사이에 틈이 있어 색칠된 작은 알갱이가 빠져나간다. 오른쪽 아래: 뇌의 핏줄 벽은 벽돌이 바느질 선으로 꿰매져 틈이 없고 알갱이가 가위표에서 막힌다"><style>
