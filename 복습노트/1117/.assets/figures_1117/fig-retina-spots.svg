<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="눈 뒤쪽 막을 옆에서 자른 모습. 위에서 빛이 내려온다. 막 가운데에 오목한 곳이 있어 밝은 것이 가장 또렷하고, 가장자리는 희미한 것도 보이며, 막이 끊긴 구멍 자리에서는 아무것도 보이지 않는다."><style>
