<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="왼쪽 손에서 나온 선이 가운데 등 속 신경 길 테두리 원으로 들어가고, 원 안의 색칠된 점에서 두 선이 팔 근육으로 나간다. 위쪽 근육 테두리에는 더하기 표시와 당겨요, 아래쪽 근육 테두리에는 빼기 표시와 힘 빼요가 적혀 있다. 원에서 점선이 위쪽 머리로 올라가 나중에 뜨거워라고 적혀 있다"><style>
