</style><rect x="0" y="0" width="500" height="300" rx="10" fill="#ffffff"/><title id="p34-source-p34-fig-retina-title">사람 눈의 단면 모식도. 왼쪽에서 들어온 빛이 수정체를 지나 오른쪽 안쪽 벽의 망막에 닿는다. (가)는 망막 한가운데에서 망막이 바깥쪽으로 오목하게 들어간 곳이다. (나)는 망막이 끊기고 그 자리에서 신경 다발이 눈 밖으로 빠져나가는 곳이다. (다)는 망막 한가운데에서 위쪽으로 떨어진 주변이다.</title>
