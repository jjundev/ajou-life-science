</style><rect x="0" y="0" width="440" height="300" rx="10" fill="#ffffff"/><title id="p47-tree-title">아래에서 위로 시간이 흐르는 계통수. 뿌리에서 올라온 줄기가 갈라져 왼쪽 가지는 맨 위 현재 선까지 닿는다. 오른쪽 가지는 점 (다)에서 다시 둘로 갈라지며, 하나는 현재 선 아래 중간에서 끊긴 끝 (가), 다른 하나는 현재 선까지 닿은 끝 (나)이다.</title>
