<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="왼쪽에는 땅이 한 번에 크게 꺾이는 선이 꺾인 선으로, 오른쪽에는 얇은 층이 여러 장 차곡차곡 쌓인 선이 그려져 있어요."><style>
