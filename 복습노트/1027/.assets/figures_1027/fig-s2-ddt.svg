<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-label="세 테두리 상자에 모기 무리를 그렸어요. 처음에는 색칠된 점(약에 강한 모기)이 하나뿐이고, 약을 뿌린 뒤 테두리 동그라미(약한 모기)가 줄며, 나중에는 색칠된 점이 대부분이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
