<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img" aria-label="한 점에서 두 갈래로 갈라지는 선 두 쌍이에요. 왼쪽 쌍은 최근에 갈라져 각 가지에 색칠된 점이 하나씩, 오른쪽 쌍은 오래전에 갈라져 각 가지에 색칠된 점이 많아요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="180" rx="10" fill="#ffffff"/>
<line class="fig-ink" x1="150" y1="160" x2="150" y2="110"/>
<line class="fig-accent" x1="150" y1="110" x2="100" y2="30"/><line class="fig-accent" x1="150" y1="110" x2="200" y2="30"/>
<circle class="fig-dot" cx="118" cy="58" r="5"/><circle class="fig-dot" cx="182" cy="58" r="5"/>
<text class="fig-text" x="150" y="20" text-anchor="middle" font-size="13">최근에 갈라짐</text>
<text class="fig-muted" x="150" y="176" text-anchor="middle" font-size="13">다른 점이 적어요</text>
<line class="fig-ink" x1="450" y1="160" x2="450" y2="150"/>
<line class="fig-danger" x1="450" y1="150" x2="370" y2="30"/><line class="fig-danger" x1="450" y1="150" x2="530" y2="30"/>
<circle class="fig-dot" cx="430" cy="120" r="5"/><circle class="fig-dot" cx="410" cy="90" r="5"/><circle class="fig-dot" cx="397" cy="70" r="5"/><circle class="fig-dot" cx="383" cy="50" r="5"/>
<circle class="fig-dot" cx="470" cy="120" r="5"/><circle class="fig-dot" cx="490" cy="90" r="5"/><circle class="fig-dot" cx="503" cy="70" r="5"/><circle class="fig-dot" cx="517" cy="50" r="5"/>
<text class="fig-text" x="450" y="20" text-anchor="middle" font-size="13">오래전에 갈라짐</text>
<text class="fig-muted" x="450" y="176" text-anchor="middle" font-size="13">다른 점이 많아요</text>
</svg>
