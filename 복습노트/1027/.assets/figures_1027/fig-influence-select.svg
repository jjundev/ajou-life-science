<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="위 줄은 사람이 다리 짧은 개끼리만 짝짓기를 시켜 다리 짧은 품종이 생기는 과정, 아래 줄은 사는 곳에서 잘 살아남아 새끼를 많이 낳은 개체의 모습이 무리에 많아지는 과정이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
