<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="남아메리카 안의 뉴트리아와 산에 사는 설치류는 선으로 이어져 닮았고, 사는 모습이 비슷한 유럽의 비버와는 점선으로 덜 닮았다고 표시했어요. 아래에는 대륙에서 섬들로 건너간 새가 섬마다 다른 부리를 가진 모습을 그렸어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
