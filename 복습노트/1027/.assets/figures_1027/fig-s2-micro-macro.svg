<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-label="왼쪽 테두리 상자는 한 무리 안에서 부리 모양이 바뀌어도 종은 그대로인 작은 진화, 오른쪽 테두리 상자는 새 종이 생기거나 종이 사라지는 큰 진화예요. 가운데 세로선이 종이라는 기준선이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="170" rx="10" fill="#ffffff"/>
<rect class="fig-accent" x="20" y="20" width="250" height="130" rx="10"/>
<text class="fig-text" x="145" y="50" text-anchor="middle" font-size="14">작은 진화</text>
<text class="fig-muted" x="145" y="80" text-anchor="middle" font-size="13">한 무리 안에서</text>
<text class="fig-muted" x="145" y="100" text-anchor="middle" font-size="13">부리 모양이 조금 바뀜</text>
<text class="fig-text" x="145" y="130" text-anchor="middle" font-size="13">종은 그대로</text>
<line class="fig-ink" x1="300" y1="15" x2="300" y2="155" stroke-dasharray="6 5"/>
<text class="fig-text" x="300" y="166" text-anchor="middle" font-size="12">기준선: 종</text>
<rect class="fig-danger" x="330" y="20" width="250" height="130" rx="10"/>
<text class="fig-text" x="455" y="50" text-anchor="middle" font-size="14">큰 진화</text>
<text class="fig-muted" x="455" y="80" text-anchor="middle" font-size="13">새로운 종이 생김</text>
<text class="fig-muted" x="455" y="100" text-anchor="middle" font-size="13">공룡처럼 종이 사라짐</text>
<text class="fig-text" x="455" y="130" text-anchor="middle" font-size="13">종이 바뀜</text>
</svg>
