<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-label="계통수 그림이에요. 맨 아래 뿌리가 공통조상이고, 가지가 갈라지는 곳에 색칠된 점으로 갈림점을 표시했어요. 중간에서 끊겨 X 표시가 있는 끊긴 가지는 멸종한 종, 위쪽 점선(현재 선)까지 닿은 가지 끝은 지금 사는 종이에요. 왼쪽 세로 화살표는 아래가 과거, 위가 현재인 시간이에요."><style>
