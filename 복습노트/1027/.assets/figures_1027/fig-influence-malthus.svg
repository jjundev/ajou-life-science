<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="사람 수 막대는 2, 4, 8, 16으로 두 배씩 높아지고, 먹을 것을 나타낸 점선은 천천히 조금씩만 올라가요."><style>
