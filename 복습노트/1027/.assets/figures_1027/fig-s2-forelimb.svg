<line class="fig-ink" x1="72" y1="155" x2="55" y2="215"/><line class="fig-ink" x1="85" y1="155" x2="78" y2="220"/><line class="fig-ink" x1="100" y1="155" x2="100" y2="222"/><line class="fig-ink" x1="115" y1="155" x2="122" y2="220"/><line class="fig-ink" x1="128" y1="155" x2="145" y2="215"/>
<text class="fig-text" x="160" y="45" font-size="13">상완골: 1개</text>
<text class="fig-text" x="160" y="110" font-size="13">척골·요골: 2개로 갈라짐</text>
<text class="fig-text" x="160" y="150" font-size="13">수근골</text>
<text class="fig-text" x="160" y="200" font-size="13">손가락·발가락: 여러 갈래</text>
<text class="fig-muted" x="390" y="60" font-size="13">사람 팔</text>
<text class="fig-muted" x="390" y="85" font-size="13">돼지 앞다리</text>
<text class="fig-muted" x="390" y="110" font-size="13">돌고래 앞지느러미</text>
