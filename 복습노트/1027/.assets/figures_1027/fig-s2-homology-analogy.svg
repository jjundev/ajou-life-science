<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="왼쪽은 한 조상에서 사람 팔, 박쥐 날개, 돌고래 앞지느러미로 갈라지는 선이고, 오른쪽은 조상이 다른 펭귄, 상어, 돌고래가 물이라는 같은 환경 때문에 비슷한 몸매가 된 그림이에요. 모든 상자는 테두리만 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="190" rx="10" fill="#ffffff"/>
<rect class="fig-accent" x="105" y="15" width="90" height="30" rx="6"/>
<text class="fig-text" x="150" y="35" text-anchor="middle" font-size="13">한 조상</text>
<line class="fig-accent" x1="150" y1="45" x2="55" y2="110"/><line class="fig-accent" x1="150" y1="45" x2="150" y2="110"/><line class="fig-accent" x1="150" y1="45" x2="245" y2="110"/>
<text class="fig-text" x="55" y="128" text-anchor="middle" font-size="13">사람 팔</text>
<text class="fig-text" x="150" y="128" text-anchor="middle" font-size="13">박쥐 날개</text>
<text class="fig-text" x="245" y="128" text-anchor="middle" font-size="13">돌고래 지느러미</text>
<text class="fig-muted" x="150" y="165" text-anchor="middle" font-size="13">하는 일은 달라도 뼈 배치가 같아요</text>
<line class="fig-ink" x1="300" y1="10" x2="300" y2="180" stroke-dasharray="5 5"/>
<text class="fig-text" x="365" y="35" text-anchor="middle" font-size="13">새 조상</text>
<text class="fig-text" x="450" y="35" text-anchor="middle" font-size="13">물고기 조상</text>
<text class="fig-text" x="540" y="35" text-anchor="middle" font-size="13">젖먹이 조상</text>
<line class="fig-ink" x1="365" y1="45" x2="365" y2="95"/><line class="fig-ink" x1="450" y1="45" x2="450" y2="95"/><line class="fig-ink" x1="540" y1="45" x2="540" y2="95"/>
<text class="fig-text" x="365" y="115" text-anchor="middle" font-size="13">펭귄</text>
<text class="fig-text" x="450" y="115" text-anchor="middle" font-size="13">상어</text>
<text class="fig-text" x="540" y="115" text-anchor="middle" font-size="13">돌고래</text>
<rect class="fig-danger" x="335" y="132" width="235" height="30" rx="6"/>
<text class="fig-text" x="452" y="152" text-anchor="middle" font-size="13">물에 살아서 매끈한 몸매</text>
</svg>
