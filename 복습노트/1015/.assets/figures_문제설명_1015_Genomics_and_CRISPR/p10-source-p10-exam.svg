</style><rect x="0" y="0" width="600" height="210" rx="10" fill="#ffffff"/><rect x="20" y="15" width="560" height="180" rx="12" fill="#e6edf4"/><text x="45" y="45" fill="#172a40" font-size="18">전구 RNA: [A] ─ 인트론 ─ [B] ─ 인트론 ─ [C]</text><path d="M200 65 L130 100 M400 65 L460 100" stroke="#506b85" stroke-width="3"/><text x="60" y="132" fill="#172a40" font-size="21">(가) [A] [B]</text><text x="340" y="132" fill="#172a40" font-size="21">(나) [A] [C]</text><text x="45" y="173" fill="#172a40" font-size="16">A·B·C는 엑손이며, 두 결과의 차이를 읽으세요.</text></svg>
