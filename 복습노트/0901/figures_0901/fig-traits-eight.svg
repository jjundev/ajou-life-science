<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-label="가운데에 여덟 개의 작은 테두리 상자를 감싼 큰 테두리 상자가 있고, 큰 상자는 선으로 왼쪽 도마뱀 칸과 이어지지만 오른쪽 바위 칸과는 이어지지 않는 그림. 낳기 상자에는 모두, 자라기는 여러 칸으로 된 몸만이라고 적혀 있고, 마지막 상자는 생물을 무리로 묶어 본다는 뜻이다"><style>
