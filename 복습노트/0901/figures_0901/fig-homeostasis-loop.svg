<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="바깥이 바뀜, 알아차림, 맞춤, 몸속은 그대로라는 네 개의 테두리 상자가 화살표로 차례로 이어진 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
