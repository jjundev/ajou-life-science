<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="왼쪽부터 다섯 칸이 있어요. 첫 칸에는 색칠된 점 하나, 둘째 칸에는 색칠된 점 네 개, 셋째 칸에는 색칠된 점과 테두리만 있는 네모가 섞여 있고, 넷째 칸에는 거기에 물결선과 해 모양 선이 더해져 있고, 다섯째 칸은 큰 테두리 원 하나예요."><style>
