<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="테두리만 있는 큰 서랍 세 개가 나란히 있어요. 셋째 서랍 안에는 선으로 그린 작은 칸 네 개(원생생물, 식물, 버섯·곰팡이, 동물)가 있어요. 왼쪽 두 서랍 위에는 두 서랍을 함께 묶는 선과 별명 글자가 있어요."><style>
