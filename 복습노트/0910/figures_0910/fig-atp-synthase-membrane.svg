<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="미토콘드리아 내막 단면 그림. 가운데 두 줄 선이 미토콘드리아 내막, 위쪽 막 사이 공간에는 H⁺가 많고 아래쪽 기질에는 적음. 왼쪽 강조색 테두리 상자는 전자전달계(복합체 Ⅰ·Ⅲ·Ⅳ)이고 경고색 화살표가 H⁺를 기질에서 막 사이 공간으로 올려 보냄. 오른쪽 강조색 테두리의 막대와 원은 ATP 합성효소이고 경고색 화살표가 H⁺를 막 사이 공간에서 기질로 내려보냄. 기질 쪽에 ADP + Pᵢ에서 ATP로 가는 화살표."><style>
