<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="계단 그림. 왼쪽 위 옥상에서 오른쪽 아래 바닥까지 선으로 그린 계단이 옥상, 3층, 2층, 1.5층, 바닥 순서로 내려감. 색칠된 공이 옥상에 있고 강조색 점선이 계단을 한 칸씩 따라 내려가 바닥의 산소에 닿음."><style>
