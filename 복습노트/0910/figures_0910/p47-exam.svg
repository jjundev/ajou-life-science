  <desc id="p47-web-ch02-q15-exam-desc">왼쪽에 육각형과 오각형이 붙은 질소성 염기(아데닌, 오각형에 A 표시), 가운데에 O와 S가 표시된 짙은 오각형의 당(리보오스), 오른쪽에 P 세 개가 사슬로 이어진 3개의 음전하를 띤 인산이 있고 각 P 위에 음전하 기호가 있다. 가는 화살표 세 개가 각각 염기와 당 사이 결합, 당과 첫 번째 인산 사이 결합, 두 번째와 세 번째 인산 사이 결합을 가리킨다.</desc>
