        <line class="fig-ink" x1="76" y1="50" x2="224" y2="50"/>
        <text class="fig-text" x="240" y="54" text-anchor="middle">H</text>
        <circle class="fig-dot" cx="150" cy="50" r="7"/>
        <text class="fig-muted" x="150" y="32" text-anchor="middle">전자가 가운데</text>
        <text class="fig-text" x="290" y="54">C–H: 떨어질 전자 있음</text>
        <text class="fig-text" x="60" y="124" text-anchor="middle">C</text>
        <line class="fig-ink" x1="76" y1="120" x2="224" y2="120"/>
        <text class="fig-text" x="240" y="124" text-anchor="middle">O</text>
        <circle class="fig-dot" cx="212" cy="120" r="7"/>
        <text class="fig-muted" x="200" y="102" text-anchor="middle">전자가 O 쪽</text>
        <text class="fig-text" x="290" y="124">C–O: 이미 떨어짐</text>
