<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="세포 안 장소 그림. 바깥 큰 테두리가 세포, 그 안의 둥근 테두리가 미토콘드리아 외막, 그 안에 여러 번 접힌 강조색 선이 내막. 외막과 내막 사이는 막 사이 공간, 내막 안쪽은 기질. 오른쪽 글: 세포질은 해당과정의 기질 수준 인산화, 내막은 전자전달계와 ATP 합성효소의 산화적 인산화, 기질은 시트르산 회로의 기질 수준 인산화."><style>
