<svg xmlns="http://www.w3.org/2000/svg" width="560" height="355" viewBox="0 0 560 355" role="img" aria-label="젖당 분해 순환 그림. 왼쪽: 윗면에 홈 두 개가 파인 선으로 그린 효소와 그 위에 떠 있는 육각형 두 개가 이어진 이당류인 젖당. 왼쪽 육각형은 포도당, 오른쪽은 갈락토오스, 두 홈은 활성부위라고 적혀 있음. 휘어진 화살표가 젖당을 가운데 효소로 데려감. 가운데: 젖당의 두 육각형이 홈에 끼워진 효소-기질 복합체, 효소 안에 β-갈락토오스가수분해효소라고 적혀 있음. H2O가 적힌 화살표가 오른쪽으로 이어짐. 오른쪽: 따로 떨어진 포도당 육각형과 갈락토오스 육각형이 위로 날아가고 효소는 처음 모양 그대로. 맨 아래 긴 화살표가 오른쪽 효소에서 왼쪽 효소로 돌아가며 효소는 변하지 않고 다시 다른 젖당과 반응한다고 적혀 있음."><style>
