<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="언덕 그림. 왼쪽 평평한 선 위에 선으로 그린 동그란 바위가 있음. 바위 오른쪽에 높은 턱 선과 낮은 턱 선이 겹쳐 그려져 있고, 높은 턱은 도우미 없음, 낮은 턱은 도우미 있음이라고 적혀 있음. 턱 너머로 선이 아래로 내려가 낮은 땅에 닿고, 오른쪽 세로 양쪽 화살표가 굴러 내려가는 높이는 그대로라고 가리킴."><style>
