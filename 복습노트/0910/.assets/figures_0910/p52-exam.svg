<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img" aria-label="식물 세포 그림. 가장 바깥에 굵은 둥근 사각형 선이 있고 A라고 표시되어 있다. 그 바로 안쪽에 얇은 둥근 사각형 선이 있고 B라고 표시되어 있다. 가운데에는 그림에서 가장 큰 타원 C가 있다. 왼쪽 위에는 두 겹의 매끈한 타원 선 안에 짧은 선이 세 무더기로 쌓인 작은 구조 D가, 왼쪽 아래에는 바깥 타원 선 안에 위쪽이 여러 번 안으로 접혀 들어간 닫힌 안쪽 선이 있는 작은 구조 E가 있다."><style>
