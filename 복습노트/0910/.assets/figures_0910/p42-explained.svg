</style><rect x="0" y="0" width="520" height="664" rx="10" fill="#ffffff"/>
  <title id="p42-web-ch02-q04-explained-title">효소 유무에 따른 자유에너지 변화 그래프 해설</title>
  <desc id="p42-web-ch02-q04-explained-desc">세로축은 자유에너지, 가로축은 반응 진행이다. 반응물 a+b 수준에서 출발한 곡선 두 개가 각각 높은 봉우리와 낮은 봉우리를 지나 더 낮은 생성물 c 수준에 도달한다. 점선이 높은 봉우리 꼭대기, 낮은 봉우리 꼭대기, a+b 수준, c 수준에 그어져 있다. 양방향 화살표 I은 낮은 봉우리 꼭대기에서 c 수준까지, II는 낮은 봉우리 꼭대기에서 a+b 수준까지, III은 높은 봉우리 꼭대기에서 a+b 수준까지, IV는 a+b 수준에서 c 수준까지의 높이를 나타낸다. 해설: 높은 봉우리 곡선은 효소가 없을 때, 낮은 봉우리 곡선은 효소가 있을 때이다. III은 효소 없을 때의 활성화 에너지, II는 효소 있을 때의 활성화 에너지, IV는 반응열(ΔG)로 효소와 무관하다. I은 낮은 봉우리에서 c까지의 높이로 역반응 쪽 높이이며 정반응의 활성화 에너지가 아니다.</desc>
  <rect x="0" y="0" width="520" height="664" fill="white"/>
  <g fill="#172033" font-family="Arial, Apple SD Gothic Neo, sans-serif">
