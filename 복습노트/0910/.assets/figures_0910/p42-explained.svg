<svg xmlns="http://www.w3.org/2000/svg" width="520" height="664" viewBox="0 0 520 664" role="img" aria-labelledby="p42-web-ch02-q04-explained-title p42-web-ch02-q04-explained-desc" aria-label="같은 그래프에 III은 효소가 없을 때 활성화 에너지, II는 효소가 있을 때 활성화 에너지, IV는 효소와 무관한 반응 전후 자유에너지 차이라는 해설을 덧붙였다."><style>
