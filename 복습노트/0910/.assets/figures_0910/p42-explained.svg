    <line x1="115" y1="68" x2="415" y2="68" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="115" y1="114" x2="415" y2="114" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
