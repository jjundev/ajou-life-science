    <line x1="200" y1="352" x2="360" y2="352" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path d="M115,176 L158,176 C170,176 172,114 192,114 L250,114 C290,114 282,352 355,352 L470,352" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M158,176 C172,176 182,68 220,68 C248,68 256,90 262,124" fill="none" stroke="#111" stroke-width="3"/>
    <text x="140" y="152" font-size="20" text-anchor="middle">a+b</text>
    <text x="426" y="338" font-size="20" text-anchor="middle">c</text>
    <line x1="230" y1="120.4" x2="230" y2="345.6" stroke="#172033" stroke-width="1.5"/><polygon points="230,352 225.6,344 234.4,344" fill="#172033"/><polygon points="230,114 234.4,122 225.6,122" fill="#172033"/>
    <text x="245" y="252" font-size="24" text-anchor="middle">I</text>
    <line x1="315" y1="120.4" x2="315" y2="169.6" stroke="#172033" stroke-width="1.5"/><polygon points="315,176 310.6,168 319.4,168" fill="#172033"/><polygon points="315,114 319.4,122 310.6,122" fill="#172033"/>
    <text x="333" y="156" font-size="24" text-anchor="middle">II</text>
    <line x1="365" y1="74.4" x2="365" y2="169.6" stroke="#172033" stroke-width="1.5"/><polygon points="365,176 360.6,168 369.4,168" fill="#172033"/><polygon points="365,68 369.4,76 360.6,76" fill="#172033"/>
    <text x="387" y="146" font-size="24" text-anchor="middle">III</text>
    <line x1="365" y1="182.4" x2="365" y2="345.6" stroke="#172033" stroke-width="1.5"/><polygon points="365,352 360.6,344 369.4,344" fill="#172033"/><polygon points="365,176 369.4,184 360.6,184" fill="#172033"/>
    <text x="387" y="272" font-size="24" text-anchor="middle">IV</text>
    <text x="222" y="56" font-size="15" text-anchor="middle" fill="#b4321e" font-weight="bold">효소 없음</text>
    <text x="172" y="106" font-size="15" text-anchor="end" fill="#1f5fa8" font-weight="bold">효소 있음</text>
    <path d="M158,176 C172,176 182,68 220,68 C248,68 256,90 262,124" fill="none" stroke="#b4321e" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="20" y="460" width="480" height="192" rx="8" fill="#fff6f3" stroke="#b4321e" stroke-width="1.5"/>
    <text x="32" y="485" font-size="15" fill="#b4321e" font-weight="bold">해설</text>
    <text x="32" y="506.8" font-size="15" fill="#b4321e">III = 효소 없을 때의 활성화 에너지 (높은 봉우리 − a+b)</text>
    <text x="32" y="528.5" font-size="15" fill="#b4321e">II = 효소 있을 때의 활성화 에너지 (낮은 봉우리 − a+b)</text>
    <text x="32" y="550.2" font-size="15" fill="#b4321e">IV = 반응물과 생성물의 자유에너지 차이(ΔG, 반응열)</text>
    <text x="32" y="572" font-size="15" fill="#b4321e">     → 효소가 있어도 IV의 크기는 변하지 않는다</text>
    <text x="32" y="593.8" font-size="15" fill="#b4321e">I = 낮은 봉우리 − c : 역반응 쪽 높이이며</text>
    <text x="32" y="615.5" font-size="15" fill="#b4321e">     정반응의 활성화 에너지가 아니다</text>
    <text x="32" y="637.2" font-size="15" fill="#b4321e">효소는 활성화 에너지를 III → II로 낮춰 반응을 빠르게 한다</text>
  </g>
</svg>
