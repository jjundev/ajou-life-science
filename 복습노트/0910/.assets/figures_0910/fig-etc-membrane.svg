<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="미토콘드리아 내막 단면 그림. 가운데 두 줄 선이 미토콘드리아 내막, 위쪽은 막 사이 공간, 아래쪽은 기질. 내막에 강조색 테두리 상자 세 개(복합체 Ⅰ, Ⅲ, Ⅳ)가 박혀 있음. 선 화살표가 기질의 NADH에서 복합체 Ⅰ, Ⅲ, Ⅳ를 거쳐 기질의 O₂로 가고, O₂에서 물로 이어짐. 복합체마다 경고색 화살표가 기질에서 막 사이 공간으로 H⁺를 올려 보냄."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
