<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="두 칸 그림. 왼쪽 중성 근처: U자 선으로 그린 단백질 사슬의 왼쪽 끝에 COO-, 오른쪽 끝에 양전하 부분이 있고 둘 사이를 선이 이어 이온결합이라고 적혀 있음, 아래에 구조 유지. 오른쪽 pH가 낮아짐: 사슬이 벌어진 선으로 그려져 있고 왼쪽 끝은 COOH, 오른쪽 끝은 양전하 부분, 둘 사이에 엑스 표시와 이온결합이 끊김이라는 글, 아래에 구조가 풀림."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
