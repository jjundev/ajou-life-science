<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="봉우리 하나짜리 곡선. 왼쪽 차가움에서 낮게 시작해 따뜻함에서 가장 높아졌다가 오른쪽 뜨거움 쪽에서 급하게 떨어짐. 왼쪽 위에 따뜻할수록 부지런해져요, 오른쪽 위에 너무 뜨거우면 모양이 풀려요라는 글과 꼬불꼬불한 선이 있음."><style>
