<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="소낭 수송 그림. 아래에 두 줄 선으로 그린 긴 관이 가로로 놓여 있고 미세소관, 길이라고 적혀 있음. 그 위에 선으로 그린 두 다리의 운동단백질이 서 있고 키네신, 걸어가는 것, ATP 사용이라고 적혀 있음. 맨 위에 선으로 그린 동그란 주머니 안에 색칠된 점들이 있고 소낭, 실려 가는 것이라고 적혀 있음. 오른쪽을 향한 화살표 선이 이동 방향을 가리킴."><style>
