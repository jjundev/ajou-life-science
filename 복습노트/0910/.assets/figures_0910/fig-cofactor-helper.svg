<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="가운데에 윗면에 홈이 파인 선으로 그린 도우미가 있음. 그 위 왼쪽에 색칠된 작은 동그라미 금속 알갱이, 오른쪽에 테두리만 있는 육각형 비타민 조수가 있고 둘 다 선으로 홈을 가리킴. 왼쪽 끝에는 선으로 그린 밥그릇과 비타민은 밥이 아니에요라는 글, 오른쪽 끝에는 일을 거들어요라는 글이 있음."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
