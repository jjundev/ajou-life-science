<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="위에 색칠된 동그라미 여섯 개가 한 줄로 이어져 있고, 아래로 화살표가 내려가 색칠된 동그라미 세 개씩 이어진 두 줄로 나뉜다. 맨 아래 왼쪽에는 선만 있는 동그라미(동전) 두 개와 &#x27;2개 내고&#x27;, 오른쪽에는 선 동그라미 네 개와 &#x27;4개 받아요&#x27;."><style>
