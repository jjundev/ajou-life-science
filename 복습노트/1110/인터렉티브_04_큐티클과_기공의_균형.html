<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>큐티클과 기공의 균형</title>
<!-- 생성 파일: .assets/자료_인터렉티브_04_큐티클과_기공의_균형/Main.dc.html을 고친 뒤 bio-interactive/scripts/build.cjs로 다시 만드세요. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
body{margin:0}
.app{--radius:8px;--tap:48px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--dur:220ms;--dur-exit:150ms;--ease-out:cubic-bezier(.2,.8,.2,1);--scrim:rgba(0,0,0,.4);
  position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-sizing:border-box;
  background:var(--bg);color:var(--ink);font-family:'Pretendard',system-ui,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.app button{font-family:inherit;color:inherit}
.app :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.topbar{display:flex;align-items:center;gap:var(--s2);min-height:56px;padding:var(--s2) var(--s3);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:17px;font-weight:700;white-space:nowrap}
.text-btn{flex:none;min-height:44px;min-width:44px;padding:0 var(--s3);border:0;border-radius:var(--radius);background:transparent;color:var(--ink);font:600 14px/1 'Pretendard',system-ui,sans-serif;cursor:pointer}
.panel-toggle{display:inline-flex;align-items:center;gap:var(--s1);padding:0 var(--s2)}
.panel-toggle svg,.theme-toggle svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel-toggle .strip{fill:transparent;stroke:none;transition:fill 150ms ease-out}
.panel-toggle[aria-expanded="true"]{color:var(--accent-ink)}
.panel-toggle[aria-expanded="true"] .strip{fill:currentColor}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;padding:0}
.seg{flex:none;display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--radius)}
.seg button{min-height:40px;padding:0 var(--s3);border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--on-btn)}

.layout{display:grid;grid-template-columns:auto minmax(320px,1fr) auto;min-height:0}
.panel{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg);color:var(--ink)}
.panel-left{grid-column:1;width:clamp(260px,20vw,320px);border-right:1px solid var(--line)}
.panel-right{grid-column:3;width:clamp(320px,24vw,400px);border-left:1px solid var(--line)}
.panel-inner{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s4) var(--s4) var(--s6)}
.panel-inner::-webkit-scrollbar{width:8px}
.panel-inner::-webkit-scrollbar-track{background:transparent}
.panel-inner::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid var(--bg)}
.panel-inner::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
@supports (scrollbar-color:auto){.panel-inner{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}}
.panel-head{display:flex;align-items:center;gap:var(--s2);min-height:44px;margin-bottom:var(--s2)}
.panel-head h2{flex:1 1 0;min-width:0;margin:0;font-size:22px;line-height:1.4}
.stage{grid-column:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.scrim{display:none}
.panel-resize{display:none}

.sec{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line)}
.panel-head + .sec,.panel-head + div > .sec:first-child{margin-top:0;padding-top:0;border-top:0}
.sec-title{display:block;margin:0 0 var(--s3);font-size:19px;font-weight:700;line-height:1.4;letter-spacing:-0.01em}
.sub{margin:var(--s3) 0 0;font-size:14px;line-height:1.6;color:var(--ink-2)}

.opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.btn{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--tap);padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;line-height:1.3;text-align:left;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.btn .box{flex:none;width:12px;height:12px;border-radius:3px;border:1.5px solid currentColor}
.btn[aria-pressed="true"] .box{background:currentColor}
.steps{display:flex;flex-direction:column;gap:var(--s2)}
.steps .btn{padding:var(--s2) var(--s3);gap:var(--s3)}
.step-num{flex:none;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;font-size:12px;font-weight:700;color:var(--ink)}
.step-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.step-txt b{font-size:15px;font-weight:700}
.step-txt span{font-size:13px;font-weight:500;color:var(--ink-2)}
.detail{margin-top:var(--s3);padding:var(--s4);border-radius:var(--radius);background:var(--surface);font-size:15px;line-height:1.7}


.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:var(--s3);border-radius:var(--radius);background:var(--surface)}
.tile b{display:block;font-size:20px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:13px;line-height:1.4;color:var(--ink-2)}
.events{display:flex;flex-direction:column;gap:var(--s2)}
.event{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.6}
.dot{flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2) var(--s3);font-size:13px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:var(--s2)}
.sw{flex:none;width:16px;height:6px;border-radius:3px}
.sw.ball{width:12px;height:12px;border-radius:50%}
.sec.warn{border-top:0;padding:var(--s4);border-radius:var(--radius);background:var(--surface);font-size:15px;line-height:1.7}
.warn .sec-title{color:var(--warn);font-size:17px}
.mistake{margin-top:var(--s3)}
.mistake b{display:block;font-weight:700}
.mistake span{color:var(--ink-2)}

.canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.canvas.is-fixed{cursor:default}
.view-btns{position:absolute;top:var(--s3);right:var(--s3);display:flex;gap:6px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);cursor:pointer}
.icon-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.float{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.hover-card{position:absolute;left:var(--s3);bottom:var(--s3);display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s4);pointer-events:none}
.hover-card .k{font-size:13px;color:var(--ink-2)}
.hover-card .v{font-size:18px;font-weight:700}
.playbar{position:absolute;left:var(--s3);right:var(--s3);bottom:var(--s3);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3)}
.play{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius);background:var(--btn-bg);color:var(--on-btn) !important;cursor:pointer}
.play svg{width:18px;height:18px;fill:currentColor}
.scrub{flex:1 1 200px;min-width:160px;display:flex;flex-direction:column;gap:2px}
.scrub span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.scrub input{width:100%;height:24px;margin:0;accent-color:var(--accent)}
.speeds{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--radius)}
.speeds button{min-width:48px;height:40px;padding:0 var(--s2);border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.speeds button[aria-pressed="true"]{background:var(--btn-bg);color:var(--on-btn)}

@media (hover:hover){.btn:hover,.icon-btn:hover{background:var(--surface)}.text-btn:hover{background:var(--surface)}}
@media (min-width:1024px){
  .panel-head{display:none}
  .layout{--pl:var(--pl-user,clamp(260px,20vw,320px));--pr:var(--pr-user,clamp(320px,24vw,400px))}
  .panel{width:0;border-width:0;visibility:hidden;transition:width var(--dur-exit) ease-in,visibility 0s linear var(--dur-exit)}
  .panel-left.is-open{width:var(--pl)}
  .panel-right.is-open{width:var(--pr)}
  .panel.is-open{visibility:visible;border-width:1px;transition:width var(--dur) var(--ease-out)}
  .panel-left .panel-inner{width:var(--pl)}
  .panel-right .panel-inner{width:var(--pr);align-self:flex-end}
  .layout.is-resizing .panel{transition:none}
  .layout.is-resizing{cursor:col-resize;user-select:none}
  .panel-resize{display:block;position:absolute;top:0;bottom:0;z-index:2;width:12px;padding:0;border:0;background:transparent;cursor:col-resize;touch-action:none}
  .panel-left .panel-resize{right:0}
  .panel-right .panel-resize{left:0}
  .panel-resize::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity 150ms ease-out}
  .panel-left .panel-resize::after{right:0}
  .panel-right .panel-resize::after{left:0}
  .panel-resize:focus-visible{outline:none}
  .panel-resize:focus-visible::after,.is-resizing .panel-resize:active::after{opacity:1}
  @media (hover:hover){.panel-resize:hover::after{opacity:1}}
}
@media (max-width: 1023.98px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{grid-column:1}
  .panel{position:fixed;top:0;bottom:0;z-index:40;visibility:hidden;transition:transform var(--dur-exit) ease-in,visibility 0s linear var(--dur-exit)}
  .panel-left{left:0;width:min(304px,88vw);transform:translateX(-100%)}
  .panel-right{right:0;width:min(360px,88vw);transform:translateX(100%)}
  .panel.is-open{visibility:visible;transform:none;transition:transform var(--dur) var(--ease-out)}
  .panel-inner{padding-top:calc(var(--s3) + env(safe-area-inset-top));padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom))}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity var(--dur-exit) ease-in,visibility 0s linear var(--dur-exit)}
  .scrim.is-on{opacity:1;visibility:visible;transition:opacity var(--dur) var(--ease-out)}
}
@media (max-width:640px){.brand{display:none}.topbar{justify-content:space-between}}
@media (max-width:480px){.panel-toggle span{display:none}.seg button{padding:0 var(--s2)}}
@media (prefers-reduced-motion:reduce){.panel,.panel.is-open,.scrim,.scrim.is-on,.panel-toggle .strip,.panel-resize::after{transition:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="app" onKeyDown="{{onKey}}" style="--bg: {{th.bg}}; --surface: {{th.surface}}; --ink: {{th.ink}}; --ink-2: {{th.ink2}}; --line: {{th.line}}; --accent: {{th.accent}}; --accent-ink: {{th.accentInk}}; --btn-bg: {{th.btnBg}}; --on-btn: {{th.onBtn}}; --warn: {{th.warn}}; --prof: {{th.prof}}; --supp: {{th.supp}}; --danger: {{th.danger}}; --scroll: {{th.scroll}}; --scroll-hover: {{th.scrollHover}}">
<header class="topbar">
<button class="text-btn panel-toggle" type="button" aria-label="조작 패널" aria-expanded="{{leftExpanded}}" onClick="{{toggleLeft}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="strip" x="3" y="4" width="6" height="16" rx="1"></rect><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg><span>조작</span></button>
<strong class="brand">큐티클과 기공의 균형</strong>
<sc-if value="{{hasModes}}" hint-placeholder-val="{{ true }}">
<div class="seg" role="group" aria-label="보기 선택">
<sc-for list="{{modes}}" as="md" hint-placeholder-count="2">
<button type="button" aria-pressed="{{md.pressed}}" onClick="{{md.pick}}">{{md.label}}</button>
</sc-for>
</div>
</sc-if>
<button class="text-btn theme-toggle" type="button" aria-label="{{themeLabel}}" title="{{themeLabel}}" onClick="{{toggleTheme}}">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
</button>
<button class="text-btn panel-toggle" type="button" aria-label="설명 패널" aria-expanded="{{rightExpanded}}" onClick="{{toggleRight}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="strip" x="15" y="4" width="6" height="16" rx="1"></rect><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M15 4v16"></path></svg><span>설명</span></button>
</header>

<div class="layout {{layoutCls}}" style="{{layoutStyle}}">
<aside class="panel panel-left {{leftCls}}" aria-label="조작">
<div class="panel-resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="왼쪽 패널 너비 조절. 좌우 화살표로 조절, Home으로 기본 너비" aria-valuemin="220" aria-valuemax="480" aria-valuenow="{{leftWNow}}" ref="{{leftHandleRef}}"></div>
<div class="panel-inner">
<div class="panel-head"><h2>조작</h2><button class="text-btn" type="button" onClick="{{closePanels}}">닫기</button></div>

<sc-if value="{{hasToggles}}" hint-placeholder-val="{{ true }}">
<div class="sec">
<h3 class="sec-title">보기 옵션</h3>
<div class="opt">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
<button class="btn" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}"><span class="box" aria-hidden="true"></span>{{t.label}}</button>
</sc-for>
</div>
</div>
</sc-if>

<!-- SLOT:left -->
<div class="sec">
<h3 class="sec-title">덮개와 통로</h3>
<p class="sub">구조에서 큐티클과 기공의 위치를 비교해요. 개폐에서 같은 잎의 통로 너비를 바꿔 보세요.</p>
</div>
<sc-if value="{{is.exchange}}" hint-placeholder-val="{{ false }}">
<div class="sec">
<h3 class="sec-title">기공 상태 고르기</h3>
<div class="opt">
<button class="btn" type="button" aria-pressed="{{closedPressed}}" onClick="{{chooseClosed}}">닫힌 상태</button>
<button class="btn" type="button" aria-pressed="{{openPressed}}" onClick="{{chooseOpen}}">열린 상태</button>
</div>
<p class="sub">▶나 아래 막대로 열림과 닫힘을 살펴봐요. 자동 반응의 원인이나 실제 시간은 나타내지 않아요.</p>
</div>
</sc-if>
<!-- /SLOT:left -->

<sc-if value="{{hasSteps}}" hint-placeholder-val="{{ true }}">
<div class="sec">
<h3 class="sec-title">단계</h3>
<div class="steps">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="2">
<button class="btn" type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}"><span class="step-num num" style="border-color: {{s.c}}">{{s.num}}</span><span class="step-txt"><b>{{s.title}}</b><span>{{s.who}}</span></span></button>
</sc-for>
</div>
<sc-if value="{{hasStep}}" hint-placeholder-val="{{ false }}">
<div class="detail" aria-live="polite">{{stepDetail}}</div>
</sc-if>
</div>
</sc-if>
</div>
</aside>

<section class="stage" aria-label="모형 보기">
<canvas class="canvas {{canvasCls}}" ref="{{canvasRef}}" role="img" aria-label="{{canvasLabel}}"></canvas>
<div class="view-btns">
<button class="icon-btn" type="button" aria-label="확대" onClick="{{zoomIn}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button class="icon-btn" type="button" aria-label="축소" onClick="{{zoomOut}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button class="icon-btn" type="button" aria-label="시점 처음으로" onClick="{{resetView}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v5h5"></path></svg></button>
</div>

<sc-if value="{{hasPlayback}}" hint-placeholder-val="{{ false }}">
<div class="playbar float">
<button class="play" type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}">
<sc-if value="{{isPlaying}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></sc-if>
</button>
<label class="scrub">
<span>{{fLabel}}</span>
<input type="range" min="0" max="{{fMax10}}" step="1" value="{{fInt}}" onChange="{{onScrub}}">
</label>
<div class="speeds" role="group" aria-label="재생 속도">
<sc-for list="{{speeds}}" as="sp" hint-placeholder-count="3">
<button type="button" aria-pressed="{{sp.pressed}}" onClick="{{sp.pick}}">{{sp.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
</section>

<aside class="panel panel-right {{rightCls}}" aria-label="설명">
<div class="panel-resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="오른쪽 패널 너비 조절. 좌우 화살표로 조절, Home으로 기본 너비" aria-valuemin="280" aria-valuemax="720" aria-valuenow="{{rightWNow}}" ref="{{rightHandleRef}}"></div>
<div class="panel-inner">
<div class="panel-head"><h2>설명</h2><button class="text-btn" type="button" onClick="{{closePanels}}">닫기</button></div>

<!-- SLOT:right -->
<div class="sec" aria-live="polite">
<h3 class="sec-title">{{panelTitle}}</h3>
<div class="tiles">
<div class="tile"><b>{{opening}}</b><span>기공 상태</span></div>
<div class="tile"><b>{{cover}}</b><span>큐티클</span></div>
<div class="tile"><b>{{co2State}}</b><span>기공을 통한 CO₂ 유입</span></div>
<div class="tile"><b>{{waterState}}</b><span>기공을 통한 수분 손실</span></div>
</div>
</div>
<div class="sec" aria-live="polite">
<h3 class="sec-title">지금 일어나는 일</h3>
<div class="events"><sc-for list="{{events}}" as="e" hint-placeholder-count="2"><div class="event"><span class="dot" style="background: {{e.c}}"></span><span>{{e.text}}</span></div></sc-for></div>
<p class="sub">광합성 중인 잎과 수증기가 빠져나갈 수 있는 바깥 공기를 가정해요. 다른 조건은 같게 두고 통로만 비교해요.</p>
</div>
<div class="sec">
<h3 class="sec-title">범례</h3>
<div class="legend">
<div><span class="sw" style="background: {{legend.cuticle}}"></span>큐티클</div>
<div><span class="sw" style="background: {{legend.cell}}"></span>잎 표면의 세포</div>
<div><span class="sw ball" style="background: {{legend.co2}}"></span>이산화탄소 CO₂</div>
<div><span class="sw ball" style="background: {{legend.water}}"></span>수증기 H₂O</div>
</div>

<script>
// Minimal x-dc runtime for opening the canvas component as a plain HTML page.
// Supports what Main.dc.html uses: {{dotted.path}} holes in text and attributes,
// event attributes (onClick, onKeyDown, onMouseEnter, onMouseLeave, onChange),
// callback ref, <sc-if value> and <sc-for list as>.
const DC_EVENTS = { onclick: 'click', onkeydown: 'keydown', onmouseenter: 'mouseenter', onmouseleave: 'mouseleave', onchange: 'input' };
const DC_HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
let dcSchedule = () => {};

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(u) {
    this.state = Object.assign({}, this.state, typeof u === 'function' ? u(this.state) : u);
    dcSchedule();
  }
}

function dcGet(scope, path) {
  let o = scope;
  for (const k of path.split('.')) { if (o == null) return undefined; o = o[k]; }
  return o;
}
function dcInterp(str, scope) {
  return str.replace(DC_HOLE, (_, p) => { const v = dcGet(scope, p); return v == null ? '' : String(v); });
}
function dcSingle(str) {
  const m = str.match(/^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/);
  return m ? m[1] : null;
}

// Compiles one node in place; pushes updaters that take the current scope.
function dcCompile(node, ups) {
  if (node.nodeType === 3) {
    if (!node.data.includes('{{')) return;
    const src = node.data;
    let last;
    ups.push((s) => { const v = dcInterp(src, s); if (v !== last) { node.data = v; last = v; } });
    return;
  }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-if' || tag === 'sc-for') { dcBlock(node, tag, ups); return; }
  for (const a of [...node.attributes]) {
    const name = a.name, val = a.value;
    if (name.startsWith('hint-')) { node.removeAttribute(name); continue; }
    if (!val.includes('{{')) continue;
    node.removeAttribute(name);
    if (DC_EVENTS[name]) {
      const p = dcSingle(val);
      let cur;
      node.addEventListener(DC_EVENTS[name], (e) => { const f = dcGet(cur, p); if (typeof f === 'function') f(e); });
      ups.push((s) => { cur = s; });
    } else if (name === 'ref') {
      const p = dcSingle(val);
      let done = false;
      ups.push((s) => { if (!done) { done = true; const f = dcGet(s, p); if (typeof f === 'function') f(node); } });
    } else {
      let last;
      ups.push((s) => {
        const v = dcInterp(val, s);
        if (v === last) return;
        last = v;
        if (name === 'value' && 'value' in node) node.value = v; else node.setAttribute(name, v);
      });
    }
  }
  for (const c of [...node.childNodes]) dcCompile(c, ups);
}

function dcBlock(el, tag, ups) {
  const anchor = document.createComment(tag);
  el.parentNode.replaceChild(anchor, el);
  const tpl = document.createDocumentFragment();
  while (el.firstChild) tpl.appendChild(el.firstChild);
  const make = () => {
    const frag = tpl.cloneNode(true), u = [];
    for (const c of [...frag.childNodes]) dcCompile(c, u);
    return { frag: frag, nodes: [...frag.childNodes], u: u };
  };
  if (tag === 'sc-if') {
    const p = dcSingle(el.getAttribute('value') || '');
    let inst = null;
    ups.push((s) => {
      const on = !!dcGet(s, p);
      if (!on) { if (inst) { inst.nodes.forEach((n) => n.remove()); inst = null; } return; }
      if (!inst) { inst = make(); anchor.parentNode.insertBefore(inst.frag, anchor); }
      inst.u.forEach((f) => f(s));
    });
  } else {
    const p = dcSingle(el.getAttribute('list') || ''), as = el.getAttribute('as');
    const insts = [];
    ups.push((s) => {
      const list = dcGet(s, p) || [];
      while (insts.length > list.length) insts.pop().nodes.forEach((n) => n.remove());
      while (insts.length < list.length) { const i = make(); anchor.parentNode.insertBefore(i.frag, anchor); insts.push(i); }
      list.forEach((item, k) => { const sc = Object.create(s); sc[as] = item; insts[k].u.forEach((f) => f(sc)); });
    });
  }
}

function mountDC(Component) {
  const comp = new Component({});
  const frag = document.getElementById('dc-template').content.cloneNode(true), ups = [];
  for (const c of [...frag.childNodes]) dcCompile(c, ups);
  const root = document.getElementById('dc-root');
  let pending = false;
  const render = () => { pending = false; const v = comp.renderVals(); ups.forEach((f) => f(v)); };
  dcSchedule = () => { if (!pending) { pending = true; queueMicrotask(render); } };
  root.appendChild(frag);
  render();
  window.addEventListener('pagehide', () => { if (comp.componentWillUnmount) comp.componentWillUnmount(); });
}
class Component extends DCLogic {
  // ================= 주제 훅: 주제마다 바꾸는 곳은 이 네 메서드뿐이에요 =================
  // 계약은 bio-interactive/references/scene-api.md에 있어요.

  topic() {
    const phase = f => f < 2 ? '닫힌 기공' : f < 4 ? '열리는 기공' : f < 6 ? '열린 기공' : f < 8 ? '닫히는 기공' : '다시 닫힌 기공';
    return {
      MODES: [
        { key:'structure', label:'구조', cam:{yaw:0,pitch:0,zoom:1}, fit:[8.7,12.5], D:60, autoSpin:false, rotatable:false, playback:null,
          canvasLabel:()=> '잎 표면 확대 단면. 큐티클은 표면을 덮고 기공은 바깥 공기와 잎 안쪽을 연결해요. 열린 기공을 통해 CO₂는 안으로, 수증기는 밖으로 이동하는 상황이에요.' },
        { key:'exchange', label:'개폐', cam:{yaw:0,pitch:0,zoom:1}, fit:[8.7,12.5], D:60, autoSpin:false, rotatable:false,
          playback:{ fmax:10, rate:0.7, label:f=>phase(f)+' · '+f.toFixed(1)+' / 10' },
          canvasLabel:f=>phase(f)+'. 큐티클 덮개는 그대로이고, 기공이 열릴수록 이 조건에서 CO₂ 유입과 수분 손실이 함께 늘어나는 관계를 보여 줘요.' }
      ],
      STEPS:[
        {mode:'structure',c:'#B88420',title:'겉을 덮는 큐티클',who:'표면의 왁스성 층',text:'큐티클은 잎 표면을 덮어 수분 손실을 줄여요. 그림의 황금색 띠를 따라가며 덮개와 가운데 통로를 구별해 보세요.'},
        {mode:'structure',c:'#348A58',title:'안팎을 잇는 기공',who:'기공',text:'기공은 바깥 공기와 잎 안쪽을 잇는 통로예요. 광합성에 필요한 CO₂가 들어오지만 수증기도 이 통로로 나갈 수 있어요.'},
        {mode:'exchange',f:0.8,phase:'닫힌 기공',c:'#348A58',title:'닫히면 두 이동이 제한돼요',who:'닫힌 기공',text:'기공이 닫히면 이 통로를 통한 수분 손실이 줄어요. 동시에 광합성에 필요한 CO₂ 유입도 제한돼요. 잎 전체의 물 손실이 완전히 사라진다는 뜻은 아니에요.'},
        {mode:'exchange',f:3.5,phase:'열리는 기공',c:'#348A58',title:'통로가 열려요',who:'열리는 기공',text:'기공의 틈이 커지며 안팎을 잇는 길이 열려요. 다른 조건이 같으면 CO₂가 들어오기 쉬워지고 수증기도 빠져나가기 쉬워져요.'},
        {mode:'exchange',f:5.2,phase:'열린 기공',c:'#C56536',title:'CO₂ 유입과 물 손실',who:'열린 기공',text:'CO₂는 잎 안쪽으로, 수증기는 바깥 공기로 이동해요. 이 조건에서는 열린 기공이 CO₂ 유입을 허용하는 만큼 수분 손실도 커져요. 큐티클은 계속 표면을 덮고 있어요.'},
        {mode:'exchange',f:7.4,phase:'닫히는 기공',c:'#348A58',title:'틈이 좁아져요',who:'닫히는 기공',text:'기공이 닫히면서 수증기가 빠져나갈 통로가 좁아져요. CO₂가 들어올 통로도 함께 좁아져 두 이동이 모두 제한돼요.'},
        {mode:'exchange',f:9.2,phase:'다시 닫힌 기공',c:'#348A58',title:'물을 지키는 데도 대가가 있어요',who:'다시 닫힌 기공',text:'기공을 닫으면 이 통로를 통한 물 손실을 줄일 수 있어요. 그러나 CO₂ 유입도 제한되므로 물 보존과 기체 교환을 함께 생각해야 해요. 재생 순서는 비교용이며 실제 개폐 주기가 아니에요.'}
      ],
      MISTAKES:{
        structure:[
          {title:'큐티클 ≠ 기공',text:'황금색 띠는 수분 손실을 줄이는 덮개예요. 가운데 틈은 기체가 드나드는 통로예요.'},
          {title:'기공 ≠ 몸속 수송관',text:'기공은 잎 안팎을 이어 줘요. 물관·체관은 몸속 수송을 맡는 별도 조직이에요.'},
          {title:'흔한 경향 ≠ 예외 없는 규칙',text:'그림은 기공이 있는 잎의 예예요. 수업의 검정말처럼 기공이 없는 식물도 있어요.'}
        ],
        exchange:[
          {title:'CO₂ 유입 ≠ 수분 보존',text:'열린 기공에서 주황색은 안으로, 파란색은 밖으로 움직여요. CO₂를 받는 동안 물도 잃을 수 있어요.'},
          {title:'닫힌 기공 ≠ 완전 밀봉',text:'닫힘은 기공을 통한 이동을 제한해요. 큐티클도 잎 전체의 물 손실을 완전히 없애지는 않아요.'},
          {title:'정성 비교 ≠ 실제 속도',text:'같은 조건에서 틈의 차이만 비교해요. 입자 수나 재생 시간으로 실제 유입량·손실량을 계산하지 않아요.'}
        ]
      },
      TOGGLES:{structure:[['labels','이름표'],['paths','이동 경로']],exchange:[['labels','이름표'],['paths','이동 경로']]},
      PAL:{
        light:{bg:'#ffffff',labelBg:'#f7f8fa',ink:'#111111',ring:'#111111',cuticle:'#B88420',cell:'#62A57B',co2:'#C56536',water:'#267FAA',inside:'#CEE6D5',blobAlpha:0.3},
        dark:{bg:'#17171c',labelBg:'#212128',ink:'#f2f4f6',ring:'#f2f4f6',cuticle:'#EBC16B',cell:'#8BCDA4',co2:'#F5A372',water:'#7BC7EF',inside:'#254735',blobAlpha:0.42}
      }
    };
  }

  buildScene(mode, I, O) {
    const p=this.pal(), st=this.state, f=this.sim.f;
    const g=mode==='structure'?1:f<2?0:f<4?this.sm((f-2)/2):f<6?1:f<8?1-this.sm((f-6)/2):0;
    const gap=0.78*g;
    const line=(a,b,w,c,z=0,alpha=1)=>I.push({k:1,p:[a[0],a[1],z],q:[b[0],b[1],z],w,c,flat:true,a:alpha});
    // The lower, translucent field is leaf interior; the paired bands are a schematic surface section.
    line([-3,-1.65],[3,-1.65],2.65,p.inside,-0.5,0.48);
    line([-3,0],[ -gap,0],1.15,p.cell,0,0.85);
    line([gap,0],[3,0],1.15,p.cell,0,0.85);
    line([-3,0.66],[-0.85,0.66],0.19,p.cuticle,0.1);
    line([0.85,0.66],[3,0.66],0.19,p.cuticle,0.1);
    // Permanent cuticle does not grow over the stomatal opening when the pore closes.
    if (st.paths && g>0.08) {
      const lane=0.33*g;
      const routes=[{c:p.co2,pts:[[-1.45,2],[-lane,1.12],[-lane,-0.95],[-1.45,-2.03]]},
        {c:p.water,pts:[[1.45,-2.03],[lane,-0.95],[lane,1.12],[1.45,2]]}];
      routes.forEach((r,j)=>{
        for(let i=0;i<3;i++){
          const a=r.pts[i],b=r.pts[i+1];
          line(a,b,0.035,r.c,0.5,0.25+0.5*g);
          if(i===0 || i===2)I.push({k:4,p:[...a,0.51],q:[...b,0.51],c:r.c,a:0.5+0.5*g});
        }
        for(let n=0;n<3;n++){
          // Particle count is illustrative and fixed; aperture changes the qualitative path.
          const t=mode==='structure'?(n+0.5)/3:((f*0.38+n/3+j*0.12)%1);
          const v=t*3,ix=Math.min(2,Math.floor(v)),q=v-ix;
          const a=r.pts[ix],b=r.pts[ix+1];
          I.push({k:0,p:[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q,0.6],r:Math.min(0.095,g*0.16),c:r.c,flat:true,a:0.35+0.65*g});
        }
      });
    }
    if(st.labels){
      O.push({p:[0,3.1,0],text:'바깥 공기',c:p.ink});
      O.push({p:[-1.5,2.23,0],text:'CO₂ 유입',c:p.co2});
      O.push({p:[1.5,2.23,0],text:'수증기 유출',c:p.water});
      O.push({p:[-2,0.66,0.2],text:'큐티클',c:p.cuticle,dy:-24,lead:true});
      O.push({p:[0,0.15,0.2],text:'기공',c:p.cell,dy:65,lead:true});
      O.push({p:[0,-2.8,0],text:'잎 안쪽',c:p.ink});
    }
  }

  extraState() {
    return {labels:true,paths:true};
  }

  extraVals(st) {
    const p=this.pal(),f=st.f,structure=st.mode==='structure';
    const g=structure?1:f<2?0:f<4?this.sm((f-2)/2):f<6?1:f<8?1-this.sm((f-6)/2):0;
    const closed=g<0.01,open=g>0.99;
    const changing=f<4?'열리는 중':'닫히는 중';
    return {
      legend:{cuticle:p.cuticle,cell:p.cell,co2:p.co2,water:p.water},
      panelTitle:structure?'구조와 역할':'같은 조건에서 비교',
      opening:closed?'닫힘':open?'열림':changing,
      cover:'덮개 유지',
      co2State:closed?'유입 제한':open?'유입 허용':f<4?'유입 증가':'유입 감소',
      waterState:closed?'손실 감소':open?'손실 증가':f<4?'손실 증가':'손실 감소',
      closedPressed:closed,openPressed:open,
      chooseClosed:()=>this.pickStep(2),chooseOpen:()=>this.pickStep(4),
      events:structure?[
        {c:p.cuticle,text:'큐티클은 표면의 왁스성 층으로 수분 손실을 줄여요.'},
        {c:p.cell,text:'기공은 바깥과 잎 안쪽을 잇는 조절 가능한 통로예요.'}
      ]:closed?[
        {c:p.water,text:'닫힌 기공은 이 통로를 통한 수분 손실을 줄여요.'},
        {c:p.co2,text:'같은 통로를 이용하는 CO₂ 유입도 제한돼요.'}
      ]:[
        {c:p.co2,text:open?'열린 기공으로 CO₂가 잎 안쪽에 들어와요.':f<4?'통로가 넓어지며 CO₂가 들어오기 쉬워져요.':'통로가 좁아지며 CO₂ 유입이 제한돼요.'},
        {c:p.water,text:open?'수증기도 같은 기공을 통해 바깥으로 나가요.':f<4?'수증기도 빠져나가기 쉬워져요.':'수증기가 빠져나갈 길도 함께 좁아져요.'}
      ]
    };
  }

  // ================= 공통 셸: 아래는 주제와 무관해요. 고치지 않아요 =================
  constructor(...args) {
    super(...args);
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    let narrow = false;
    try { narrow = window.matchMedia('(max-width: 1023.98px)').matches; } catch (e) {}
    let saved = null;
    try { saved = window.localStorage.getItem('od-theme'); } catch (e) {}
    const PANEL_W = { left: { min: 220, max: 480 }, right: { min: 280, max: 720 } };
    let widths = {};
    try { widths = JSON.parse(window.localStorage.getItem('interactive-panel-w')) || {}; } catch (e) {}
    const okW = (side) => { const v = widths[side]; return typeof v === 'number' && v >= PANEL_W[side].min && v <= PANEL_W[side].max ? v : null; };
    this.T = this.topic();
    this.state = Object.assign({
      mode: this.T.MODES[0].key, f: 0, playing: false, speed: 1, step: -1, spin: !reduce,
      theme: (saved === 'light' || saved === 'dark') ? saved : (this.systemDark() ? 'dark' : 'light'),
      // leftOpen/rightOpen: docked panels on wide screens; drawer: the one open drawer on narrow screens
      leftOpen: true, rightOpen: true, drawer: null, narrow: narrow,
      // leftW/rightW: user-set docked widths in px (null = default); resizing: a handle is being dragged
      leftW: okW('left'), rightW: okW('right'), resizing: false
    }, this.extraState());
    this.reduceMotion = reduce;
    this.K = {
      PANEL_W: PANEL_W, PANEL_W_KEY: 'interactive-panel-w', PANEL_DEFAULT: { left: 320, right: 400 },
      THEMES: {
        light: { bg: '#ffffff', surface: '#f7f8fa', ink: '#111111', ink2: '#6b7280', line: '#d9dee7', accent: '#1677ff', accentInk: '#1b64da', btnBg: '#1b64da', onBtn: '#ffffff', warn: '#b54708', prof: '#6941c6', supp: '#067647', danger: '#d92d20', scroll: '#c9d0db', scrollHover: '#9aa3b2' },
        dark: { bg: '#17171c', surface: '#212128', ink: '#f2f4f6', ink2: '#a3abb8', line: '#34353d', accent: '#3182f6', accentInk: '#6ea4ff', btnBg: '#1b64da', onBtn: '#ffffff', warn: '#f5a15c', prof: '#b69cff', supp: '#5fd39a', danger: '#ff6b61', scroll: '#3f414b', scrollHover: '#5b5e6a' }
      }
    };
    this.cam = Object.assign({}, this.modeDef().cam);
    this.sim = { f: 0, cx: 0 };
    this.pointer = { x: -1, y: -1, inside: false, drag: false, lx: 0, ly: 0 };
    this.colorCache = {};
    this._tick = (t) => this.tick(t);
    this._canvasRef = (el) => this.attachCanvas(el);
    this.handles = {};
    this._handleRefL = (el) => this.attachHandle('left', el);
    this._handleRefR = (el) => this.attachHandle('right', el);
  }

  componentWillUnmount() {
    this.attachCanvas(null);
    this.attachHandle('left', null);
    this.attachHandle('right', null);
  }

  modeDef(key) {
    const k = key || this.state.mode;
    return this.T.MODES.find((m) => m.key === k) || this.T.MODES[0];
  }
  systemDark() {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
  }
  isNarrow() {
    try { return window.matchMedia('(max-width: 1023.98px)').matches; } catch (e) { return false; }
  }
  syncBreakpoint() { this.setState({ narrow: this.isNarrow(), drawer: null }); }
  // In drawer mode only one panel is open at a time.
  togglePanel(side) {
    const st = this.state;
    if (st.narrow) this.setState({ drawer: st.drawer === side ? null : side });
    else if (side === 'left') this.setState({ leftOpen: !st.leftOpen });
    else this.setState({ rightOpen: !st.rightOpen });
  }
  // Docked panel width: the canvas column always keeps at least 400px.
  panelMax(side) {
    const lim = this.K.PANEL_W[side], other = side === 'left' ? 'right' : 'left', st = this.state;
    const h = this.handles[other];
    const otherOpen = other === 'left' ? st.leftOpen : st.rightOpen;
    const otherW = !otherOpen ? 0 : h ? h.el.parentElement.getBoundingClientRect().width
      : (st[other + 'W'] || this.K.PANEL_DEFAULT[other]);
    return Math.max(lim.min, Math.min(lim.max, (window.innerWidth || 1440) - otherW - 400));
  }
  setPanelWidth(side, px, save) {
    const v = Math.round(Math.min(Math.max(px, this.K.PANEL_W[side].min), this.panelMax(side)));
    this.setState({ [side + 'W']: v });
    if (save) this.savePanelWidths(side, v);
  }
  resetPanelWidth(side) {
    this.setState({ [side + 'W']: null });
    this.savePanelWidths(side, null);
  }
  savePanelWidths(side, v) {
    try {
      const key = this.K.PANEL_W_KEY;
      let w = {};
      try { w = JSON.parse(window.localStorage.getItem(key)) || {}; } catch (e) {}
      if (v == null) delete w[side]; else w[side] = v;
      window.localStorage.setItem(key, JSON.stringify(w));
    } catch (e) { /* 저장 불가: 이번 방문에만 유지 */ }
  }
  // Re-fit user widths when the window shrinks (not saved).
  refitPanels() {
    ['left', 'right'].forEach((side) => {
      const w = this.state[side + 'W'];
      if (w != null && w > this.panelMax(side)) this.setPanelWidth(side, w, false);
    });
  }
  attachHandle(side, el) {
    const old = this.handles[side];
    if (old && old.el === el) return;
    if (old) {
      Object.keys(old.on).forEach((ev) => old.el.removeEventListener(ev, old.on[ev]));
      delete this.handles[side];
      if (!Object.keys(this.handles).length) window.removeEventListener('resize', this._refit);
    }
    if (!el) return;
    const dir = side === 'left' ? 1 : -1;
    const width = () => el.parentElement.getBoundingClientRect().width;
    let drag = null;
    const on = {
      pointerdown: (e) => {
        if (this.state.narrow || e.button !== 0) return;
        e.preventDefault();
        drag = { x: e.clientX, w: width() };
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        this.setState({ resizing: true });
      },
      pointermove: (e) => { if (drag) this.setPanelWidth(side, drag.w + dir * (e.clientX - drag.x), false); },
      pointerup: () => {
        if (!drag) return;
        drag = null;
        this.setState({ resizing: false });
        this.setPanelWidth(side, width(), true);
      },
      dblclick: () => this.resetPanelWidth(side),
      keydown: (e) => {
        const step = e.shiftKey ? 64 : 16;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault(); e.stopPropagation();
          this.setPanelWidth(side, width() + (e.key === 'ArrowRight' ? step : -step) * dir, true);
        } else if (e.key === 'Home') { e.preventDefault(); e.stopPropagation(); this.resetPanelWidth(side); }
      }
    };
    on.pointercancel = on.pointerup;
    Object.keys(on).forEach((ev) => el.addEventListener(ev, on[ev]));
    if (!Object.keys(this.handles).length) {
      this._refit = this._refit || (() => this.refitPanels());
      window.addEventListener('resize', this._refit);
    }
    this.handles[side] = { el: el, on: on };
  }
  textTone(hex) { return this.state.theme === 'light' ? this.mix(hex, '#000000', 0.4) : hex; }
  pal() { return this.T.PAL[this.state.theme] || this.T.PAL.dark; }
  setTheme(t) {
    this.setState({ theme: t });
    try {
      if ((t === 'dark') === this.systemDark()) window.localStorage.removeItem('od-theme');
      else window.localStorage.setItem('od-theme', t);
    } catch (e) {}
  }

  attachCanvas(el) {
    if (this.canvas === el) return;
    if (this.canvas) {
      const c = this.canvas;
      c.removeEventListener('pointerdown', this._pd);
      c.removeEventListener('pointermove', this._pm);
      c.removeEventListener('pointerup', this._pu);
      c.removeEventListener('pointercancel', this._pu);
      c.removeEventListener('pointerleave', this._pl);
      cancelAnimationFrame(this.raf);
      try { this._mq.removeEventListener('change', this._mqH); } catch (err) {}
    }
    this.canvas = el || null;
    if (!el) return;
    this.ctx = el.getContext('2d');
    const p = this.pointer;
    this._pd = (e) => {
      if (!this.modeDef().rotatable) return;
      p.drag = true; p.lx = e.clientX; p.ly = e.clientY;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.style.cursor = 'grabbing';
    };
    this._pm = (e) => {
      const r = el.getBoundingClientRect();
      p.x = e.clientX - r.left; p.y = e.clientY - r.top; p.inside = true;
      if (p.drag && this.modeDef().rotatable) {
        this.cam.yaw += (e.clientX - p.lx) * 0.008;
        this.cam.pitch = Math.max(-1.45, Math.min(1.45, this.cam.pitch + (e.clientY - p.ly) * 0.008));
        p.lx = e.clientX; p.ly = e.clientY;
      }
    };
    this._pu = () => { p.drag = false; el.style.cursor = ''; };
    this._pl = () => { p.inside = false; };
    el.addEventListener('pointerdown', this._pd);
    el.addEventListener('pointermove', this._pm);
    el.addEventListener('pointerup', this._pu);
    el.addEventListener('pointercancel', this._pu);
    el.addEventListener('pointerleave', this._pl);
    try {
      this._mq = window.matchMedia('(max-width: 1023.98px)');
      this._mqH = () => this.syncBreakpoint();
      this._mq.addEventListener('change', this._mqH);
    } catch (err) {}
    this.last = 0;
    this.raf = requestAnimationFrame(this._tick);
  }

  tick(t) {
    if (!this.canvas) return;
    const dt = this.last ? Math.min(0.05, (t - this.last) / 1000) : 0;
    this.last = t;
    const st = this.state, m = this.modeDef(), pb = m.playback;
    if (m.autoSpin && st.spin && !this.pointer.drag) this.cam.yaw += dt * 0.3;
    if (pb && st.playing) {
      this.sim.f = Math.min(pb.fmax, this.sim.f + dt * pb.rate * st.speed);
      if (this.sim.f >= pb.fmax) this.setState({ playing: false, f: this.sim.f });
      else if (t - (this.lastPush || 0) > 120) { this.lastPush = t; this.setState({ f: this.sim.f }); }
    }
    // a broken scene keeps the page alive but is reported once for the browser check
    try { this.draw(dt, t); } catch (err) { if (!this.drawErr) { this.drawErr = true; console.error(err); } }
    this.raf = requestAnimationFrame(this._tick);
  }

  // ---------- math helpers (장면에서 써도 돼요) ----------
  lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  sm(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  mix(hex, to, amt) {
    const a = this.rgb(hex), b = this.rgb(to);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * amt) + ',' + Math.round(a[1] + (b[1] - a[1]) * amt) + ',' + Math.round(a[2] + (b[2] - a[2]) * amt) + ')';
  }
  rgba(hex, al) { const a = this.rgb(hex); return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + al + ')'; }
  shades(hex) {
    let s = this.colorCache[hex];
    if (!s) { s = { hi: this.mix(hex, '#FFFFFF', 0.55), mid: hex, lo: this.mix(hex, '#000000', 0.55) }; this.colorCache[hex] = s; }
    return s;
  }
  proj(p, V) {
    const x = p[0] - V.cx, y = p[1], z = p[2];
    const x1 = x * V.cy + z * V.sy, z1 = -x * V.sy + z * V.cy;
    const y2 = y * V.cp - z1 * V.sp, z2 = y * V.sp + z1 * V.cp;
    const s = V.F / Math.max(2, V.D - z2);
    return [V.ox + x1 * s, V.oy - y2 * s, z2, s];
  }

  // ---------- drawing ----------
  draw(dt, now) {
    const el = this.canvas, ctx = this.ctx, st = this.state, m = this.modeDef();
    const dpr = window.devicePixelRatio || 1;
    const W = el.clientWidth, H = el.clientHeight;
    if (!W || !H) return;
    if (el.width !== Math.round(W * dpr) || el.height !== Math.round(H * dpr)) { el.width = Math.round(W * dpr); el.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pal = this.pal();
    ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);

    const I = [], O = [];
    this.buildScene(st.mode, I, O);
    const scale = Math.min(W / m.fit[0], H / m.fit[1]), D = m.D, z = this.cam.zoom;
    const V = {
      cx: this.sim.cx, cy: Math.cos(this.cam.yaw), sy: Math.sin(this.cam.yaw), cp: Math.cos(this.cam.pitch), sp: Math.sin(this.cam.pitch),
      F: scale * z * D, D: D, ox: W / 2, oy: H / 2 - (m.playback ? 20 : 0)
    };
    let zmin = Infinity, zmax = -Infinity;
    for (const it of I) {
      it.A = this.proj(it.p, V);
      if (it.q) { it.B = this.proj(it.q, V); it.z = (it.A[2] + it.B[2]) / 2; } else it.z = it.A[2];
      if (it.z < zmin) zmin = it.z;
      if (it.z > zmax) zmax = it.z;
    }
    I.sort((a, b) => a.z - b.z);
    // depth fog; a flat scene (all items at one depth) is drawn without it
    const span = zmax - zmin;
    for (const it of I) {
      const fog = span < 0.01 ? 1 : 0.42 + 0.58 * ((it.z - zmin) / span);
      ctx.globalAlpha = Math.max(0, (it.a == null ? 1 : it.a) * fog);
      if (ctx.globalAlpha < 0.01) continue;
      const x = it.A[0], y = it.A[1], s = it.A[3];
      if (it.k === 0) {
        const R = it.r * s;
        if (R < 0.4) continue;
        if (it.flat) { ctx.fillStyle = it.c; ctx.beginPath(); ctx.arc(x, y, Math.max(1.3, R), 0, 6.2832); ctx.fill(); }
        else {
          const sh = this.shades(it.c);
          const g = ctx.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.1, x, y, R);
          g.addColorStop(0, sh.hi); g.addColorStop(0.5, sh.mid); g.addColorStop(1, sh.lo);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
        }
      } else if (it.k === 1) {
        const lw = Math.max(1, it.w * (s + it.B[3]) / 2);
        ctx.lineCap = it.flat ? 'butt' : 'round';
        if (it.rod) {
          ctx.strokeStyle = this.shades(it.c).lo; ctx.lineWidth = lw + 2;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(it.B[0], it.B[1]); ctx.stroke();
        }
        ctx.strokeStyle = it.c; ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(it.B[0], it.B[1]); ctx.stroke();
      } else if (it.k === 3) {
        const fs = Math.max(8, Math.min(14, it.size * s / (scale * z) * 1.05));
        ctx.font = '700 ' + fs + 'px "Pretendard", system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = it.c; ctx.fillText(it.text, x, y + 0.5);
      } else if (it.k === 4) {
        const ang = Math.atan2(it.B[1] - y, it.B[0] - x), mx = (x + it.B[0]) / 2, my = (y + it.B[1]) / 2, r = 6;
        ctx.fillStyle = it.c; ctx.beginPath();
        ctx.moveTo(mx + Math.cos(ang) * r, my + Math.sin(ang) * r);
        ctx.lineTo(mx + Math.cos(ang + 2.5) * r, my + Math.sin(ang + 2.5) * r);
        ctx.lineTo(mx + Math.cos(ang - 2.5) * r, my + Math.sin(ang - 2.5) * r);
        ctx.closePath(); ctx.fill();
      } else if (it.k === 5) {
        // lit translucent sphere, highlight up-left like the solid spheres
        const R = it.r * s, ba = pal.blobAlpha == null ? 0.3 : pal.blobAlpha;
        const g = ctx.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.1, x, y, R);
        g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(0.3, this.rgba(it.c, Math.min(1, ba + 0.15))); g.addColorStop(1, this.rgba(it.c, 0.18));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = it.c; ctx.lineWidth = it.focus ? 3 : 1.5; ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    for (const o of O) this.drawOverlay(o, V, now);
  }

  drawOverlay(o, V, now) {
    const ctx = this.ctx, A = this.proj(o.p, V), pal = this.pal();
    if (o.t === 'ring') {
      const r = Math.max(6, 0.32 * A[3]) * (1 + (this.reduceMotion ? 0 : 0.15 * Math.sin((now || 0) / 160)));
      ctx.globalAlpha = 1; ctx.strokeStyle = pal.ring; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(A[0], A[1], r, 0, 6.2832); ctx.stroke();
      ctx.font = '600 11px "Pretendard", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = pal.ring; ctx.fillText(o.text, A[0], A[1] + r + 10);
      return;
    }
    const size = o.size || 12, x = A[0] + (o.dx || 0), y = A[1] + (o.dy || 0);
    ctx.font = '600 ' + size + 'px "Pretendard", system-ui, sans-serif';
    const tw = ctx.measureText(o.text).width, w = tw + 14, h = size + 10;
    ctx.globalAlpha = o.a == null ? 1 : o.a;
    if (o.lead) {
      ctx.strokeStyle = this.rgba(o.c, 0.6); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.fillStyle = pal.labelBg;
    ctx.strokeStyle = this.rgba(o.c, 0.55); ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h / 2, w, h, 6); else ctx.rect(x - w / 2, y - h / 2, w, h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = pal.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.text, x, y + 0.5);
    ctx.globalAlpha = 1;
  }

  setMode(mode) {
    this.cam = Object.assign({}, this.modeDef(mode).cam);
    this.sim.f = 0;
    this.pointer.drag = false;
    this.setState({ mode: mode, f: 0, playing: false, step: -1 });
  }

  pickStep(i) {
    const s = (this.T.STEPS || [])[i];
    if (!s) return;
    if (s.mode !== this.state.mode) this.setMode(s.mode);
    if (s.f != null) this.sim.f = s.f;
    this.setState({ f: this.sim.f, playing: false, step: i });
    this.revealStepDetail();
  }

  // Scroll the left panel so the step text under the list shows, keeping the pressed button in view.
  revealStepDetail() {
    if (typeof document === 'undefined') return;
    requestAnimationFrame(() => {
      const box = document.querySelector('.panel-left .panel-inner'), d = box && box.querySelector('.detail');
      if (!d) return;
      const pad = 16, b = box.getBoundingClientRect();
      let dy = d.getBoundingClientRect().bottom + pad - b.bottom;
      const btn = d.parentElement.querySelector('.steps [aria-pressed="true"]');
      if (btn) dy = Math.min(dy, btn.getBoundingClientRect().top - pad - b.top);
      if (dy <= 0) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      box.scrollTo({ top: box.scrollTop + dy, behavior: reduce ? 'auto' : 'smooth' });
    });
  }

  renderVals() {
    const st = this.state, T = this.T, m = this.modeDef(), pb = m.playback;
    const tg = T.TOGGLES ? (Array.isArray(T.TOGGLES) ? T.TOGGLES : (T.TOGGLES[st.mode] || [])) : [];
    const togDefs = tg.concat(m.autoSpin ? [['spin', '자동 회전']] : []);
    const toggles = togDefs.map((d) => ({
      label: d[1], pressed: st[d[0]] ? 'true' : 'false',
      toggle: () => { const o = {}; o[d[0]] = !st[d[0]]; this.setState(o); }
    }));
    const STEPS = T.STEPS || [];
    const steps = STEPS.map((s, i) => ({ s: s, i: i })).filter((x) => x.s.mode === st.mode).map((x, k) => ({
      num: k + 1, title: x.s.title, who: x.s.who, c: x.s.c, pressed: st.step === x.i ? 'true' : 'false',
      pick: () => this.pickStep(x.i)
    }));
    const speeds = [0.5, 1, 2].map((v) => ({
      label: v + '×', pressed: st.speed === v ? 'true' : 'false',
      pick: () => this.setState({ speed: v })
    }));
    const is = {};
    T.MODES.forEach((d) => { is[d.key] = d.key === st.mode; });
    const f = st.f;
    const isDark = st.theme === 'dark';
    const leftOn = st.narrow ? st.drawer === 'left' : st.leftOpen, rightOn = st.narrow ? st.drawer === 'right' : st.rightOpen;
    return Object.assign({
      th: this.K.THEMES[st.theme], isDark: isDark, isLight: !isDark,
      themeLabel: isDark ? '라이트 모드로 전환' : '다크 모드로 전환',
      toggleTheme: () => this.setTheme(isDark ? 'light' : 'dark'),
      canvasRef: this._canvasRef, canvasCls: m.rotatable ? '' : 'is-fixed',
      hasModes: T.MODES.length > 1, is: is,
      modes: T.MODES.map((d) => ({ label: d.label, pressed: d.key === st.mode ? 'true' : 'false', pick: () => { if (d.key !== this.state.mode) this.setMode(d.key); } })),
      leftCls: leftOn ? 'is-open' : '', rightCls: rightOn ? 'is-open' : '',
      leftExpanded: leftOn ? 'true' : 'false', rightExpanded: rightOn ? 'true' : 'false',
      scrimCls: (st.narrow && st.drawer) ? 'is-on' : '',
      toggleLeft: () => this.togglePanel('left'),
      toggleRight: () => this.togglePanel('right'),
      closePanels: () => this.setState({ drawer: null }),
      layoutStyle: ((st.leftW ? '--pl-user: ' + st.leftW + 'px; ' : '') + (st.rightW ? '--pr-user: ' + st.rightW + 'px;' : '')).trim(),
      layoutCls: st.resizing ? 'is-resizing' : '',
      leftWNow: st.leftW ? String(st.leftW) : '', rightWNow: st.rightW ? String(st.rightW) : '',
      leftHandleRef: this._handleRefL, rightHandleRef: this._handleRefR,
      onKey: (e) => { if (e.key === 'Escape' && this.state.narrow && this.state.drawer) this.setState({ drawer: null }); },
      hasToggles: toggles.length > 0, toggles: toggles,
      hasSteps: steps.length > 0, steps: steps,
      hasStep: st.step >= 0 && st.step < STEPS.length, stepDetail: st.step >= 0 && STEPS[st.step] ? STEPS[st.step].text : '',
      mistakes: (T.MISTAKES && T.MISTAKES[st.mode]) || [],
      canvasLabel: m.canvasLabel(f),
      zoomIn: () => { this.cam.zoom = Math.min(3, this.cam.zoom * 1.2); },
      zoomOut: () => { this.cam.zoom = Math.max(0.5, this.cam.zoom / 1.2); },
      resetView: () => { this.cam = Object.assign({}, m.cam); },
      hasPlayback: !!pb, isPlaying: st.playing, notPlaying: !st.playing, playLabel: st.playing ? '일시정지' : '재생',
      togglePlay: () => {
        if (!pb) return;
        if (!st.playing && this.sim.f >= pb.fmax) this.sim.f = 0;
        this.setState({ playing: !st.playing, step: -1, f: this.sim.f });
      },
      fInt: Math.round(f * 10), fLabel: pb ? pb.label(f) : '', fMax10: pb ? Math.round(pb.fmax * 10) : 0,
      onScrub: (e) => { const v = Number(e.target.value) / 10; this.sim.f = v; this.setState({ f: v, playing: false, step: -1 }); },
      speeds: speeds
    }, this.extraVals(st));
  }
}
mountDC(Component);
</script>
</body>
</html>
