</style><rect x="0" y="0" width="460" height="340" rx="10" fill="#ffffff"/><title id="p47-source-p47-stages-title">가상의 동물 집단에 일어난 일을 네 칸으로 그린 그림. (가) 둥근 점으로 그린 개체들이 한 무리로 모여 산다. (나) 가운데에 굽은 강이 생겨 둥근 점들이 왼쪽과 오른쪽 두 무리로 나뉜다. (다) 오랜 세월 뒤 강 왼쪽 무리는 둥근 점 그대로이고 오른쪽 무리는 테두리만 있는 세모로 바뀌었다. (라) 강이 말라 점선 자국만 남고, 둥근 점 무리와 세모 무리가 다시 가까이 만났지만 그 사이에 엑스 표시가 있고 다시 만났지만 교배하지 않음이라고 적혀 있다.</title><rect class="fig-ink" x="10" y="10" width="215" height="150" rx="8"/><rect class="fig-ink" x="235" y="10" width="215" height="150" rx="8"/><rect class="fig-ink" x="10" y="180" width="215" height="150" rx="8"/><rect class="fig-ink" x="235" y="180" width="215" height="150" rx="8"/><text class="fig-text" x="20" y="32">(가)</text><circle class="fig-dot" cx="60" cy="70" r="5"/><circle class="fig-dot" cx="85" cy="95" r="5"/><circle class="fig-dot" cx="110" cy="65" r="5"/><circle class="fig-dot" cx="135" cy="100" r="5"/><circle class="fig-dot" cx="160" cy="75" r="5"/><circle class="fig-dot" cx="70" cy="120" r="5"/><circle class="fig-dot" cx="100" cy="130" r="5"/><circle class="fig-dot" cx="150" cy="130" r="5"/><circle class="fig-dot" cx="175" cy="110" r="5"/><circle class="fig-dot" cx="120" cy="95" r="5"/><text class="fig-text" x="245" y="32">(나) 강이 생김</text><path class="fig-accent" d="M342 40 C332 62, 352 82, 342 102 S352 142, 342 154"/><text class="fig-muted" x="352" y="56">강</text><circle class="fig-dot" cx="260" cy="70" r="5"/><circle class="fig-dot" cx="290" cy="95" r="5"/><circle class="fig-dot" cx="315" cy="65" r="5"/><circle class="fig-dot" cx="270" cy="125" r="5"/><circle class="fig-dot" cx="305" cy="135" r="5"/><circle class="fig-dot" cx="370" cy="80" r="5"/><circle class="fig-dot" cx="400" cy="100" r="5"/><circle class="fig-dot" cx="430" cy="70" r="5"/><circle class="fig-dot" cx="380" cy="135" r="5"/><circle class="fig-dot" cx="425" cy="130" r="5"/><text class="fig-text" x="20" y="202">(다) 오랜 세월 뒤</text><path class="fig-accent" d="M117 210 C107 232, 127 252, 117 272 S127 312, 117 324"/><circle class="fig-dot" cx="35" cy="245" r="5"/><circle class="fig-dot" cx="65" cy="270" r="5"/><circle class="fig-dot" cx="90" cy="240" r="5"/><circle class="fig-dot" cx="45" cy="300" r="5"/><circle class="fig-dot" cx="85" cy="305" r="5"/><path class="fig-ink" d="M145 244 L151 255 L139 255 Z"/><path class="fig-ink" d="M175 269 L181 280 L169 280 Z"/><path class="fig-ink" d="M205 239 L211 250 L199 250 Z"/><path class="fig-ink" d="M155 299 L161 310 L149 310 Z"/><path class="fig-ink" d="M200 294 L206 305 L194 305 Z"/><text class="fig-text" x="245" y="202">(라) 강이 마른 뒤</text><line class="fig-ink" x1="342" y1="210" x2="342" y2="262" stroke-dasharray="4 5"/><text class="fig-muted" x="348" y="226">마른 강</text><circle class="fig-dot" cx="260" cy="250" r="5"/><circle class="fig-dot" cx="290" cy="270" r="5"/><circle class="fig-dot" cx="315" cy="245" r="5"/><circle class="fig-dot" cx="270" cy="295" r="5"/><circle class="fig-dot" cx="305" cy="295" r="5"/><path class="fig-ink" d="M375 244 L381 255 L369 255 Z"/><path class="fig-ink" d="M405 264 L411 275 L399 275 Z"/><path class="fig-ink" d="M435 239 L441 250 L429 250 Z"/><path class="fig-ink" d="M380 289 L386 300 L374 300 Z"/><path class="fig-ink" d="M425 289 L431 300 L419 300 Z"/><line class="fig-danger" x1="334" y1="272" x2="350" y2="288"/><line class="fig-danger" x1="350" y1="272" x2="334" y2="288"/><text class="fig-muted" x="342" y="320" text-anchor="middle">다시 만났지만 교배하지 않음</text></svg>
