</style><rect x="0" y="0" width="440" height="250" rx="10" fill="#ffffff"/><title id="p39-source-p39-fig-title">가로축은 부리 길이, 세로축은 개체 수인 그래프. 선 (가)는 낮고 넓게 퍼진 종 모양이고, 선 (나)는 (가)와 같은 가운데 위치(점선으로 표시한 평균)에 봉우리가 하나 있으며 더 높고 폭이 좁은 종 모양이다. (나)에서는 부리가 아주 짧거나 아주 긴 쪽의 개체가 거의 없다.</title>
