<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="아기씨 생김, 아기로 자람, 어른이 되어 아기를 낳음, 손주도 이어짐의 네 테두리 상자가 화살표로 이어져 있어요. 각 화살표 아래에 일찍 죽음, 자라도 아기를 못 낳음, 손주 대에서 약해져 끊김이라는 막힘이 적혀 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="210" rx="10" fill="#ffffff"/>
<rect class="fig-accent" x="10" y="25" width="120" height="50" rx="8"/><text class="fig-text" x="70" y="55" text-anchor="middle" font-size="13">아기씨 생김</text>
<rect class="fig-ink" x="165" y="25" width="120" height="50" rx="8"/><text class="fig-text" x="225" y="55" text-anchor="middle" font-size="13">아기로 자람</text>
<rect class="fig-ink" x="320" y="25" width="120" height="50" rx="8"/><text class="fig-text" x="380" y="47" text-anchor="middle" font-size="13">어른이 되어</text><text class="fig-text" x="380" y="65" text-anchor="middle" font-size="13">아기를 낳음</text>
<rect class="fig-ink" x="475" y="25" width="115" height="50" rx="8"/><text class="fig-text" x="532" y="55" text-anchor="middle" font-size="13">손주도 이어짐</text>
<line class="fig-ink" x1="130" y1="50" x2="163" y2="50"/><polyline class="fig-ink" points="156,45 163,50 156,55"/>
<line class="fig-ink" x1="285" y1="50" x2="318" y2="50"/><polyline class="fig-ink" points="311,45 318,50 311,55"/>
<line class="fig-ink" x1="440" y1="50" x2="473" y2="50"/><polyline class="fig-ink" points="466,45 473,50 466,55"/>
<line class="fig-danger" x1="147" y1="80" x2="147" y2="110"/><text class="fig-text" x="147" y="130" text-anchor="middle" font-size="13">일찍 죽음</text>
<line class="fig-danger" x1="302" y1="80" x2="302" y2="110"/><text class="fig-text" x="302" y="130" text-anchor="middle" font-size="13">자라도</text><text class="fig-text" x="302" y="148" text-anchor="middle" font-size="13">아기를 못 낳음</text>
<line class="fig-danger" x1="457" y1="80" x2="457" y2="110"/><text class="fig-text" x="457" y="130" text-anchor="middle" font-size="13">손주 대에서</text><text class="fig-text" x="457" y="148" text-anchor="middle" font-size="13">약해져 끊김</text>
<text class="fig-muted" x="300" y="190" text-anchor="middle" font-size="13">어디에서 멈추는지로 셋을 나눠요</text>
</svg>
