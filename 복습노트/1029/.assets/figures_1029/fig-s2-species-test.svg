<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="세 단계 판별 흐름도예요. 자연 상태에서 짝짓기하는지, 자손이 생기는지, 그 자손도 생식력이 있는지를 차례로 묻고, 셋 다 예이면 같은 종, 하나라도 아니오이면 다른 종이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="250" rx="10" fill="#ffffff"/>
<rect class="fig-ink" x="10" y="20" width="170" height="56" rx="8"/>
<text class="fig-text" x="95" y="44" text-anchor="middle" font-size="13">자연 상태에서</text>
<text class="fig-text" x="95" y="62" text-anchor="middle" font-size="13">짝짓기하나?</text>
<rect class="fig-ink" x="215" y="20" width="170" height="56" rx="8"/>
<text class="fig-text" x="300" y="53" text-anchor="middle" font-size="13">자손이 생기나?</text>
<rect class="fig-ink" x="420" y="20" width="170" height="56" rx="8"/>
<text class="fig-text" x="505" y="44" text-anchor="middle" font-size="13">그 자손도</text>
<text class="fig-text" x="505" y="62" text-anchor="middle" font-size="13">생식력이 있나?</text>
<line class="fig-ink" x1="180" y1="48" x2="213" y2="48"/><polyline class="fig-ink" points="206,43 213,48 206,53"/>
<text class="fig-muted" x="197" y="40" text-anchor="middle" font-size="12">예</text>
<line class="fig-ink" x1="385" y1="48" x2="418" y2="48"/><polyline class="fig-ink" points="411,43 418,48 411,53"/>
<text class="fig-muted" x="402" y="40" text-anchor="middle" font-size="12">예</text>
<line class="fig-ink" x1="95" y1="76" x2="95" y2="120"/><line class="fig-ink" x1="300" y1="76" x2="300" y2="120"/><line class="fig-ink" x1="505" y1="76" x2="505" y2="120"/>
<text class="fig-muted" x="108" y="102" font-size="12">아니오</text><text class="fig-muted" x="313" y="102" font-size="12">아니오</text><text class="fig-muted" x="518" y="102" font-size="12">아니오</text>
<rect class="fig-danger" x="10" y="122" width="580" height="44" rx="8"/>
<text class="fig-text" x="300" y="149" text-anchor="middle" font-size="14">다른 종(생식적으로 격리됨)</text>
<text class="fig-muted" x="95" y="186" text-anchor="middle" font-size="12">동물원 사자·호랑이 잡종은</text>
<text class="fig-muted" x="95" y="202" text-anchor="middle" font-size="12">자연 상태가 아님</text>
<text class="fig-muted" x="505" y="186" text-anchor="middle" font-size="12">노새: 살아 있지만 불임</text>
<rect class="fig-accent" x="420" y="210" width="170" height="34" rx="8"/>
<text class="fig-text" x="505" y="232" text-anchor="middle" font-size="13">셋 다 예: 같은 종</text>
</svg>
