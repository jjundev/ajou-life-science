      <text class="fig-text" x="100" y="48" text-anchor="middle">정상 + 정상</text>
      <text class="fig-text" x="280" y="48" text-anchor="middle">정상 + 바뀐 것</text>
      <text class="fig-text" x="460" y="48" text-anchor="middle">바뀐 것 + 바뀐 것</text>
      <text class="fig-muted" x="100" y="90" text-anchor="middle">빈혈: 없음</text>
      <text class="fig-muted" x="280" y="90" text-anchor="middle">빈혈: 약함</text>
      <text class="fig-muted" x="460" y="90" text-anchor="middle">빈혈: 심함</text>
      <text class="fig-muted" x="100" y="130" text-anchor="middle">모기 병: 약함</text>
