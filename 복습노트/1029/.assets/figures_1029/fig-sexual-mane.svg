<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="왼쪽 처음 칸에는 수사자 네 마리 중 두 마리만 색칠된 동그라미 둘레에 갈기를 뜻하는 바깥 테두리 고리가 있고, 고르는 쪽인 테두리 동그라미에서 갈기 있는 두 마리로 화살표가 가요. 오른쪽 여러 세대 뒤 칸에는 네 마리 모두 바깥 고리가 있어요."><style>
