<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img" aria-label="첫 상자는 강조 테두리로 표시된 손으로 정한 짝이고, 화살표를 따라 제비뽑기를 한 두 번째 상자와 세 번째 상자는 같은 비율이에요"><style>
