<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="만나기, 짝짓기, 아기씨 생김의 세 테두리 상자가 화살표로 이어져 있어요. 만나기 앞에는 사는 곳이 다름과 때가 다름, 짝짓기 앞에는 신호를 못 알아봄과 몸 모양이 안 맞음, 아기씨 앞에는 아빠 세포와 엄마 세포가 서로 못 알아봄이라는 막힘 선이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="230" rx="10" fill="#ffffff"/>
<rect class="fig-ink" x="30" y="25" width="140" height="50" rx="8"/><text class="fig-text" x="100" y="55" text-anchor="middle" font-size="14">만나기</text>
<rect class="fig-ink" x="230" y="25" width="140" height="50" rx="8"/><text class="fig-text" x="300" y="55" text-anchor="middle" font-size="14">짝짓기</text>
<rect class="fig-accent" x="430" y="25" width="140" height="50" rx="8"/><text class="fig-text" x="500" y="55" text-anchor="middle" font-size="14">아기씨 생김</text>
<line class="fig-ink" x1="170" y1="50" x2="228" y2="50"/><polyline class="fig-ink" points="221,45 228,50 221,55"/>
<line class="fig-ink" x1="370" y1="50" x2="428" y2="50"/><polyline class="fig-ink" points="421,45 428,50 421,55"/>
<line class="fig-danger" x1="20" y1="90" x2="180" y2="90"/>
<text class="fig-text" x="100" y="115" text-anchor="middle" font-size="13">사는 곳이 다름</text>
<text class="fig-text" x="100" y="138" text-anchor="middle" font-size="13">때가 다름</text>
<line class="fig-danger" x1="220" y1="90" x2="380" y2="90"/>
<text class="fig-text" x="300" y="115" text-anchor="middle" font-size="13">신호를 못 알아봄</text>
<text class="fig-text" x="300" y="138" text-anchor="middle" font-size="13">몸 모양이 안 맞음</text>
<line class="fig-danger" x1="420" y1="90" x2="580" y2="90"/>
<text class="fig-text" x="500" y="115" text-anchor="middle" font-size="13">아빠 세포와 엄마 세포가</text>
<text class="fig-text" x="500" y="138" text-anchor="middle" font-size="13">서로 못 알아봄</text>
<text class="fig-muted" x="300" y="185" text-anchor="middle" font-size="13">어느 하나만 막혀도 아기씨가 생기지 않아요</text>
</svg>
