<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="물고기 무리를 세 칸으로 그렸어요. 첫 칸은 하나로 이어진 바다에 테두리만 있는 동그라미 여덟 개가 섞여 있어요. 둘째 칸은 가운데에 솟은 땅이 생겨 동그라미가 왼쪽 태평양 쪽과 오른쪽 대서양 쪽으로 나뉘어요. 셋째 칸은 오랜 세월 뒤로, 왼쪽 동그라미는 색칠된 동그라미로 바뀌었고 오른쪽은 테두리 동그라미 그대로예요."><style>
