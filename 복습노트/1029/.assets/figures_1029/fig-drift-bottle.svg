<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽 병목 그림은 색칠된 구슬, 테두리 구슬, 네모 구슬이 섞인 병에서 입구의 색칠된 구슬 다섯 개와 테두리 구슬 한 개만 남아 다시 커진 무리에 네모가 없어요. 오른쪽 창시자 그림은 큰 무리에서 테두리 구슬 두 개만 멀리 떠나 새 무리가 모두 테두리 구슬이에요"><style>
