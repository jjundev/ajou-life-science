<ellipse class="fig-ink" cx="212" cy="80" rx="18" ry="6"/><ellipse class="fig-ink" cx="248" cy="80" rx="18" ry="6"/>
<ellipse class="fig-ink" cx="214" cy="94" rx="15" ry="5"/><ellipse class="fig-ink" cx="246" cy="94" rx="15" ry="5"/>
<text class="fig-muted" x="152" y="145" text-anchor="middle" font-size="13">생김새: 거의 같음</text>
<text class="fig-text" x="152" y="168" text-anchor="middle" font-size="13">짝이 안 돼요</text>
<text class="fig-text" x="152" y="192" text-anchor="middle" font-size="14">다른 무리</text>
