<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="말에게서 온 염색체 32개와 당나귀에게서 온 31개가 합쳐져 노새는 63개예요. 짝지은 선 쌍이 31개이고, 강조한 선 하나는 짝이 없어 감수분열이 멈추고 정자와 난자가 생기지 않아요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="220" rx="10" fill="#ffffff"/>
<text class="fig-text" x="20" y="30" font-size="13">말 2n=64, 정자·난자에 32개</text>
<text class="fig-text" x="20" y="52" font-size="13">당나귀 2n=62, 정자·난자에 31개</text>
<text class="fig-text" x="20" y="80" font-size="14">노새: 32 + 31 = 63개</text>
<line class="fig-ink" x1="40" y1="110" x2="40" y2="150"/><line class="fig-ink" x1="48" y1="110" x2="48" y2="150"/>
<line class="fig-ink" x1="80" y1="110" x2="80" y2="150"/><line class="fig-ink" x1="88" y1="110" x2="88" y2="150"/>
<line class="fig-ink" x1="120" y1="110" x2="120" y2="150"/><line class="fig-ink" x1="128" y1="110" x2="128" y2="150"/>
<line class="fig-ink" x1="160" y1="110" x2="160" y2="150"/><line class="fig-ink" x1="168" y1="110" x2="168" y2="150"/>
<text class="fig-text" x="215" y="135" font-size="14">…</text>
<line class="fig-ink" x1="250" y1="110" x2="250" y2="150"/><line class="fig-ink" x1="258" y1="110" x2="258" y2="150"/>
<text class="fig-muted" x="150" y="175" text-anchor="middle" font-size="13">짝지은 쌍 31개(4분염색체 31개)</text>
<line class="fig-danger" x1="330" y1="110" x2="330" y2="150"/>
<text class="fig-text" x="330" y="175" text-anchor="middle" font-size="13">짝 없음 1개</text>
<line class="fig-ink" x1="360" y1="130" x2="398" y2="130"/><polyline class="fig-ink" points="391,125 398,130 391,135"/>
<rect class="fig-danger" x="405" y="100" width="185" height="62" rx="8"/>
<text class="fig-text" x="497" y="124" text-anchor="middle" font-size="13">감수분열 멈춤</text>
<text class="fig-text" x="497" y="146" text-anchor="middle" font-size="13">정자·난자 없음, 불임</text>
<text class="fig-muted" x="300" y="205" text-anchor="middle" font-size="12">원인은 염색체가 많아서가 아니라 짝이 맞지 않아서예요</text>
</svg>
