<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="가운데 큰 테두리 원이 회전목마. 원 위 왼쪽에서 공기 조각이 하나 들어오는 화살표, 원 둘레에 세 칸 이름 붙이기, 짐 싣기, 다시 준비하기. 원 오른쪽으로 색칠된 점 여섯 개가 모여 설탕 한 알이 되는 모습."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
