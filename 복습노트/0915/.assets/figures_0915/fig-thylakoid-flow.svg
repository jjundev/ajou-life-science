<svg xmlns="http://www.w3.org/2000/svg" width="560" height="290" viewBox="0 0 560 290" role="img" aria-label="가운데 가로 두 줄 선이 틸라코이드 막. 위쪽은 틸라코이드 안쪽, 아래쪽은 스트로마. 막 위에 왼쪽부터 광계 2, 플라스토퀴논, 전자전달계, 광계 1, NADP+ 환원 순서로 테두리 상자. 틸라코이드 안쪽의 물이 분해되어(산소와 H+는 안쪽에 남음) 광계 2로 전자가 들어가 오른쪽으로 화살표가 이어져 NADP+가 NADPH가 됨. 전자전달계에서 H+가 위쪽 안쪽으로 올라가 쌓이고, 오른쪽 끝 ATP 합성효소 통로로 H+가 아래 스트로마로 내려오며 ATP가 생김."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
