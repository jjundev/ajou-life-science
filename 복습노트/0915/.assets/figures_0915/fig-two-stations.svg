        <rect class="fig-accent" x="305" y="65" width="110" height="50" rx="8"/><text class="fig-text" x="360" y="95" text-anchor="middle">1번 정거장</text>
        <path class="fig-danger" d="M415 90 L455 90 M447 83 L457 90 L447 97"/>
