<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="왼쪽에서 빨강, 초록, 파랑이라고 적힌 세 줄기 선이 가운데 테두리 잎으로 들어감. 빨강과 파랑 선은 잎 안에서 끝나고 먹었다는 글씨, 초록 선만 잎에서 튕겨 나와 눈 쪽으로 감."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
