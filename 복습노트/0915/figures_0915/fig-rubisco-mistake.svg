<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="왼쪽 닫힌 입 모양 테두리 곡선 두 개 위에 해. 가운데 테두리 상자 일꾼 옆에 조각 두 종류: 테두리 원 조각은 적고, 색칠된 점 조각은 많음. 일꾼이 색칠된 점을 집는 빨간 화살표와 헛수고라는 글씨."><style>
