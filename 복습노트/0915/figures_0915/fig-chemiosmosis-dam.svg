<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="가로로 놓인 두 줄 선이 막. 막 위쪽 바깥에 작은 색칠된 점이 많이 모여 있고, 막 아래쪽 안에는 점이 적음. 막에 박힌 테두리 원통을 지나 점 하나가 아래로 내려오는 화살표와 에너지 돈이라는 글씨. 왼쪽에는 전자가 계단을 따라 떨어져 맨 아래에 닿는 선."><style>
