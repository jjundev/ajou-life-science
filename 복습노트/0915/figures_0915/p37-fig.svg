<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-label="가운데 큰 원을 따라 시계 방향 화살표로 도는 회로. 맨 위 상자 (가)에 위에서 CO2가 들어옴. (가)에서 오른쪽 아래 상자 (나)로 가는 길에 A(탄소 3개, 2분자), (나)에서 왼쪽 아래 상자 (다)로 가는 길에 B(탄소 3개)가 있고 B의 일부는 원 아래로 나가 포도당이 됨. (다)에서 다시 (가)로 가는 길에 C(탄소 5개)."><style>
