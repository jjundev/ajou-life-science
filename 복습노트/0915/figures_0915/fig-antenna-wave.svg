<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽 위에서 빛 선이 들어와 테두리 원 여러 개가 줄지어 선 곳에 닿고, 곡선 화살표가 원에서 원으로 이어져 가운데 굵은 테두리 원에 모임. 가운데 원에서 오른쪽으로 짐이 나가는 화살표, 아래 물에서 가운데 원으로 짐이 올라오는 화살표와 공기 방울이 나가는 표시."><style>
