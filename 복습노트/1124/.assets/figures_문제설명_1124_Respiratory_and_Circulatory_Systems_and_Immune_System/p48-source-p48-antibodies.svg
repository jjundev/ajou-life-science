<svg xmlns="http://www.w3.org/2000/svg" width="540" height="262" viewBox="0 0 540 262" role="img" aria-label="Y자 모양의 두 항체 X와 Y. X의 두 팔 끝 (가)와 (나)에는 똑같은 삼각형 홈이 있고 X의 아래 줄기는 (다)이다. Y의 아래 줄기는 (라)이고 X의 줄기와 모양이 같다. Y의 두 팔 끝에는 똑같은 둥근 홈이 있고 그중 오른쪽이 (마)이다. 두 항체 모두 줄기까지 이어진 긴 사슬 2개와 팔에만 있는 짧은 사슬 2개로 되어 있다."><style>
