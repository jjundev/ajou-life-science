<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img" aria-label="왼쪽 세포가 오른쪽 변한 세포의 껍질에 구멍을 내어 작은 점들을 넣고, 변한 세포가 작은 조각으로 나뉘는 그림"><style>
