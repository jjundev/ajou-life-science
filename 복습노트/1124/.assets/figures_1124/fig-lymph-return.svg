<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="위쪽 가는 핏줄에서 아래로 물이 새어 나오고, 아래쪽 관이 물을 모아 중간의 점 두 개로 표시한 검문소를 지나 오른쪽 위의 핏줄로 돌려보냄"><style>
