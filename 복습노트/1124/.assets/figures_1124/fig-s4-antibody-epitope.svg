<svg xmlns="http://www.w3.org/2000/svg" width="460" height="312" viewBox="0 0 460 312" role="img" aria-label="항체의 양팔 끝 쪽에 가변 영역 V, 나머지에 불변 영역 C가 있고 사슬 사이를 이황화결합이 이어요. 왼쪽 팔 끝의 항원 결합 부위는 항원의 튀어나온 일부인 에피톱과 만나고, 줄기 아래쪽 끝은 그 반대쪽 끝이에요."><style>
