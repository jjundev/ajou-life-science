<svg xmlns="http://www.w3.org/2000/svg" width="460" height="312" viewBox="0 0 460 312" role="img" aria-label="Y자 모양 항체의 구조. 길고 꺾인 무거운 사슬 두 개가 가운데에, 짧은 가벼운 사슬 두 개가 양쪽 바깥에 있어요. 두 팔 끝을 둘러싼 테두리가 항원 결합 부위이고 점선 아래가 불변 영역이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="460" height="312" rx="10" fill="#ffffff"/><g transform="translate(30,24)"><polygon class="fig-ink" points="75,45 167,137 167,250 153,250 153,143 65,55"/><polygon class="fig-accent" points="50,70 130,150 120,160 40,80"/><line class="fig-danger" x1="126" y1="84" x2="78" y2="132" stroke-dasharray="4 4"/><ellipse class="fig-danger" cx="57" cy="62" rx="32" ry="17" transform="rotate(-45 57 62)"/><polygon class="fig-ink" points="325,45 233,137 233,250 247,250 247,143 335,55"/><polygon class="fig-accent" points="350,70 270,150 280,160 360,80"/><line class="fig-danger" x1="274" y1="84" x2="322" y2="132" stroke-dasharray="4 4"/><ellipse class="fig-danger" cx="343" cy="62" rx="32" ry="17" transform="rotate(45 343 62)"/><text class="fig-text" x="57" y="10" text-anchor="middle" style="font-size:13px">항원 결합 부위</text><text class="fig-text" x="343" y="10" text-anchor="middle" style="font-size:13px">항원 결합 부위</text><text class="fig-text" x="200" y="44" text-anchor="middle" style="font-size:13px">두 곳은 같은 모양</text><line class="fig-ink" x1="65" y1="178" x2="106" y2="148" stroke-width="1"/><text class="fig-text" x="48" y="193" text-anchor="middle" style="font-size:13px">가벼운 사슬 2개</text><line class="fig-ink" x1="96" y1="228" x2="151" y2="222" stroke-width="1"/><text class="fig-text" x="44" y="233" text-anchor="middle" style="font-size:13px">무거운 사슬 2개</text><text class="fig-text" x="262" y="205" text-anchor="start" style="font-size:13px">점선 아래</text><text class="fig-text" x="262" y="224" text-anchor="start" style="font-size:13px">불변 영역</text><text class="fig-text" x="200" y="272" text-anchor="middle" style="font-size:13px">같은 클래스면 점선 아래 아미노산 서열이 같음</text></g></svg>
