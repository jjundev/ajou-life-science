<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="왼쪽은 먼저 온 수비대로, 원 하나에서 세모, 네모, 동그라미 모양의 균 셋 모두에게 선이 이어진다. 오른쪽은 나중에 온 수비대로, 원 하나에서 세모 모양의 균 하나에만 선이 이어지고 네모와 동그라미에는 이어지지 않는다."><style>
