<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img" aria-label="큰 핏줄의 감지기에서 뇌로 소식 화살표, 뇌에서 심장으로 명령 화살표가 이어지고, 심장에서 큰 핏줄로 피를 미는 힘의 화살표가 돌아옴"><style>
