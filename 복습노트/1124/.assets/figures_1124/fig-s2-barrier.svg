<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-label="몸의 바깥 경계를 큰 테두리로 그린 그림. 위에는 침과 눈물, 왼쪽에는 피부, 오른쪽에는 숨길의 끈끈한 물과 털, 아래에는 위의 신 물이 적혀 있고, 균을 나타내는 작은 테두리 막대가 경계 바깥에 머물러 있다."><style>
