<svg xmlns="http://www.w3.org/2000/svg" width="360" height="395" viewBox="0 0 360 395" role="img" aria-labelledby="trna-lifecycle-title trna-lifecycle-desc"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="360" height="395" rx="10" fill="#ffffff"/>
<title id="trna-lifecycle-title">tRNA의 생성과 재사용</title><desc id="trna-lifecycle-desc">tRNA 유전자에서 전사와 가공을 거쳐 tRNA가 만들어져요. 아미노산을 붙이고 번역에서 전달한 뒤, 빈 tRNA에 다시 아미노산을 붙여 재사용해요.</desc>
<rect x="30" y="14" width="270" height="59" rx="8" class="fig-ink"/><text x="165" y="38" text-anchor="middle" class="fig-text">① tRNA 생성</text><text x="165" y="58" text-anchor="middle" class="fig-text">tRNA 유전자 → 전사·가공</text>
<path d="M165 75 V96 M158 87 L165 96 L172 87" class="fig-ink"/>
<rect x="30" y="100" width="270" height="59" rx="8" class="fig-accent"/><text x="165" y="124" text-anchor="middle" class="fig-text">② 알맞은 아미노산 부착</text><text x="165" y="145" text-anchor="middle" class="fig-text">합성효소가 tRNA의 3′ 말단에 붙여요</text>
<path d="M165 161 V182 M158 173 L165 182 L172 173" class="fig-ink"/>
<rect x="30" y="186" width="270" height="59" rx="8" class="fig-ink"/><text x="165" y="210" text-anchor="middle" class="fig-text">③ 리보솜에서 아미노산 전달</text><text x="165" y="230" text-anchor="middle" class="fig-text">안티코돈 ↔ mRNA 코돈</text>
<path d="M165 247 V268 M158 259 L165 268 L172 259" class="fig-ink"/>
<rect x="30" y="272" width="270" height="59" rx="8" class="fig-ink"/><text x="165" y="296" text-anchor="middle" class="fig-text">④ 빈 tRNA가 리보솜에서 나옴</text><text x="165" y="316" text-anchor="middle" class="fig-text">다시 아미노산을 받을 수 있어요</text>
<path d="M300 302 H326 V129 H303 M312 122 L303 129 L312 136" class="fig-accent"/>
<text x="165" y="362" text-anchor="middle" class="fig-text">재사용은 ④ → ② → ③ → ④의 반복</text>
<text x="165" y="382" text-anchor="middle" class="fig-text">tRNA 자체는 단백질 사슬에 들어가지 않아요</text>
</svg>
