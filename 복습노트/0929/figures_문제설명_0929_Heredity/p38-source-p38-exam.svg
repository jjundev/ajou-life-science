<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="염색체 막대 다섯 개. 맨 위 정상 염색체는 A B C D E F G 일곱 칸이다. (가)는 A B C E F G, (나)는 A B C D D E F G, (다)는 A E D C B F G, (라)는 A B C D 뒤에 다른 염색체에서 온 조각 M N O가 붙어 있다. M N O 칸은 다른 선으로 그렸고 범례에 다른 염색체에서 온 조각이라고 적혀 있다."><style>
