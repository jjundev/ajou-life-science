</style><rect x="0" y="0" width="560" height="190" rx="10" fill="#ffffff"/><g class="fig-text" font-size="14"><text x="24" y="27">첫 번째 세포 무리</text><text x="290" y="27">두 번째 세포 무리</text><text x="42" y="150">주황 털</text><text x="314" y="150">검정 털</text></g><g class="fig-accent"><rect x="28" y="43" width="205" height="82" rx="12"/><rect x="292" y="43" width="205" height="82" rx="12"/></g><g class="fig-text" font-size="14"><text x="53" y="80">주황 X 사용</text><text x="53" y="104">검정 X 꺼짐</text><text x="316" y="80">검정 X 사용</text><text x="316" y="104">주황 X 꺼짐</text></g></svg>
