<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" role="img" aria-label="두 세대 가계도. 1세대는 테두리만 있는 네모 (가)와 테두리만 있는 원 (나)가 가로선으로 이어진 부부이고, 그 아래 세로선으로 이어진 자녀 셋은 칠한 원 (다), 테두리만 있는 네모 (라), 테두리만 있는 원 (마)이다. 범례: 네모는 남성, 원은 여성, 칠한 도형은 형질을 가진 사람, 테두리만 있는 도형은 형질이 없는 사람."><style>
