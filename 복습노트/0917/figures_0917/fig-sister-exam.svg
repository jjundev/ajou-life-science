<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="테두리만 그린 길이와 모양이 같은 막대 두 개가 떨어져 서 있음. 두 막대 모두 위쪽 3분의 1쯤에 잘록한 부위가 있음. 왼쪽 막대에는 위에서부터 A, B, 잘록한 부위를 가리키는 X, 아래쪽 C 표지가 있고, 오른쪽 막대의 같은 높이에는 a, b, c 표지가 있음."><style>
