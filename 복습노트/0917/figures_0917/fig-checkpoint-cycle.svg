<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="테두리 원이 네 칸으로 나뉘어 시계 방향으로 돈다. 위는 M기, 오른쪽은 G1기, 아래는 S기, 왼쪽은 G2기. 원을 가로지르는 짧은 선 세 개가 확인점이다. G1기와 S기 경계에는 지금 분열할 때인가, S기와 G2기 경계에는 DNA 복제 잘 끝났나, M기 가운데에는 방추사가 염색체에 붙었나라고 적혀 있다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
