        <path class="fig-accent" d="M240 40 Q300 110 240 180"/>
        <path class="fig-accent" d="M320 40 Q260 110 320 180"/>
        <circle class="fig-dot" cx="280" cy="110" r="6"/>
        <line class="fig-accent" x1="254" y1="75" x2="268" y2="75"/>
        <line class="fig-accent" x1="292" y1="75" x2="306" y2="75"/>
        <text class="fig-text" x="248" y="79" text-anchor="end">c</text>
        <text class="fig-text" x="312" y="79" text-anchor="start">c</text>
        <line class="fig-ink" x1="90" y1="110" x2="154" y2="110"/>
        <line class="fig-ink" x1="206" y1="110" x2="270" y2="110"/>
