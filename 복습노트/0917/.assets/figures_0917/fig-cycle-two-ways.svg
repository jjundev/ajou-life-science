<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="왼쪽에는 자라고 나누고를 되풀이하는 화살표 고리가 있다. 오른쪽 위에는 막대 선 네 개가 든 테두리 원 세포가 화살표를 지나 막대 선 네 개씩 든 똑같은 세포 두 개가 된다. 오른쪽 아래에는 막대 선 네 개가 든 세포가 화살표를 지나 막대 선이 두 개뿐인 세포가 된다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
