<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="같은 동물의 두 세포 그림. 왼쪽 큰 원 (가) 안에는 긴 막대 두 개와 짧은 막대 두 개가 있다. 긴 막대 두 개는 길이와 모양이 같고, 짧은 막대 두 개도 길이와 모양이 같다. 오른쪽 작은 원 (나) 안에는 긴 막대 하나와 짧은 막대 하나만 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
