<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="세 칸 비교 그림. 왼쪽 칸은 바닥선 위에 테두리 원 세포들이 한 줄로 빈틈없이 늘어서 있다. 가운데 칸은 빨간 테두리 원 세포들이 한곳에 여러 층으로 쌓여 있고 점선 테두리가 그 둘레를 감싼다. 오른쪽 칸은 빨간 테두리 세포 무더기에서 세포 몇 개가 두 줄 선으로 그린 길을 따라 떨어져 나가 멀리 작은 무더기를 새로 만든다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
