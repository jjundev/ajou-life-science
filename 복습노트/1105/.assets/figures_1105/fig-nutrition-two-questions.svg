<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="에너지를 얻는 질문과 몸을 만들 탄소를 얻는 질문을 나란히 둔 그림"><style>
