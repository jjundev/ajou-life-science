<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-label="캡슐 모양 미토콘드리아 단면도. 바깥의 매끈한 테두리 선이 외막이고, 그 안쪽 선이 손가락처럼 여러 번 접힌 내막이다. 내막이 접혀 들어간 부분이 크리스테, 내막 안쪽 공간이 기질이다. 기질 오른쪽에 동그란 테두리 선으로 원형 DNA가, 왼쪽에 색칠된 작은 점으로 리보솜이 그려져 있다"><style>
