<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="5탄당 오각형의 탄소에 1′부터 5′까지 번호를 붙인 그림. 1′ 탄소에 염기, 5′ 탄소에 인산기, 2′ 탄소에 OH 또는 H가 붙는다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
