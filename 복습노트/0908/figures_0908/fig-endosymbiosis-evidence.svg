<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="세 칸 비교 그림. 첫째 칸 사람 핵 DNA는 양 끝이 있는 직선 하나이고 리보솜은 큰 색칠된 원이다. 둘째 칸 세균과 셋째 칸 미토콘드리아는 점선 테두리로 함께 묶여 있고, DNA는 둘 다 끝이 없는 동그라미 선, 리보솜은 둘 다 작은 색칠된 원이다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
