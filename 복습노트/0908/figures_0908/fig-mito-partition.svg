<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽은 네모 테두리 방의 벽에만 색칠된 점이 몇 개 붙어 있고, 오른쪽은 같은 크기의 방 안에 지그재그 선으로 된 칸막이가 서 있어 그 칸막이를 따라 색칠된 점이 훨씬 많이 붙어 있는 그림"><style>
