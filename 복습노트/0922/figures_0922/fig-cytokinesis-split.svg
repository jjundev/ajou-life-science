<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-label="왼쪽은 가운데가 잘록한 둥근 세포와 그 허리를 두른 고리 테두리이고, 오른쪽은 네모난 세포 가운데에 선으로 된 새 벽이 위아래로 자라는 모습이다"><style>
