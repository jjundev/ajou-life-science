<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="맨 위 원 하나에는 두 가닥짜리 빨간 선 막대와 파란 선 막대가 있다. 첫 번째 나누기 뒤 가운데 줄 원 두 개에는 각각 두 가닥짜리 빨간 선 막대 하나, 파란 선 막대 하나가 있다. 두 번째 나누기 뒤 맨 아래 원 네 개에는 한 가닥짜리 막대가 하나씩 있다"><style>
