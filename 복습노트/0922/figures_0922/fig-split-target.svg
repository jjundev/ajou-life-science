<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="두 칸 그림. 왼쪽 몸이 자랄 때: 선으로 그린 X 모양 두 개(엄마 것, 아빠 것)의 가운데를 점선이 세로로 지나 X마다 복사본 두 가닥이 갈라짐. 오른쪽 아기 씨앗을 만들 때: 같은 두 X 사이를 점선이 지나 엄마 것과 아빠 것이 갈라짐. X 가운데에는 색칠된 점이 있음."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
