<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽 다른 꽃의 꽃가루를 붓으로 옮겨 오른쪽 받는 꽃에 묻히는 그림. 받는 꽃 안의 두 선 중 꽃가루가 나오는 오른쪽 선 위에 잘라 냈다는 X 표시가 있다."><style>
