      <text class="fig-text" x="94" y="104" text-anchor="middle">A</text>
      <text class="fig-text" x="166" y="104" text-anchor="middle">A</text>
      <text class="fig-text" x="194" y="104" text-anchor="middle">a</text>
      <text class="fig-text" x="266" y="104" text-anchor="middle">a</text>
      <text class="fig-text" x="94" y="170" text-anchor="middle">B</text>
      <text class="fig-text" x="166" y="170" text-anchor="middle">b</text>
