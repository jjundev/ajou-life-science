<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-label="세로 가닥 네 개 I, II, III, IV가 왼쪽부터 나란히 있다. I과 II는 위쪽 색칠된 점에서 붙어 있고, III과 IV도 위쪽 색칠된 점에서 붙어 있다. I은 위아래 모두 실선이고 A, B가 적혀 있다. II는 위쪽이 실선으로 A, 아래쪽이 점선으로 b가 적혀 있다. III은 위쪽이 점선으로 a, 아래쪽이 실선으로 B가 적혀 있다. IV는 위아래 모두 점선이고 a, b가 적혀 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="360" height="240" rx="10" fill="#ffffff"/>
      <text class="fig-text" x="110" y="26" text-anchor="middle">I</text>
      <text class="fig-text" x="150" y="26" text-anchor="middle">II</text>
      <text class="fig-text" x="210" y="26" text-anchor="middle">III</text>
      <text class="fig-text" x="250" y="26" text-anchor="middle">IV</text>
      <line class="fig-danger" x1="110" y1="40" x2="110" y2="200"/>
      <line class="fig-danger" x1="150" y1="40" x2="150" y2="120"/>
      <line class="fig-accent" x1="150" y1="120" x2="150" y2="200" stroke-dasharray="6 4"/>
      <line class="fig-accent" x1="210" y1="40" x2="210" y2="120" stroke-dasharray="6 4"/>
      <line class="fig-danger" x1="210" y1="120" x2="210" y2="200"/>
      <line class="fig-accent" x1="250" y1="40" x2="250" y2="200" stroke-dasharray="6 4"/>
      <line class="fig-ink" x1="110" y1="75" x2="150" y2="75"/>
      <circle class="fig-dot" cx="130" cy="75" r="5"/>
      <line class="fig-ink" x1="210" y1="75" x2="250" y2="75"/>
