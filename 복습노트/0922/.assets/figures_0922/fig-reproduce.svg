<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="왼쪽은 혼자 만든 똑같은 감자 네 개가 병이 오자 모두 X 표시로 쓰러진 그림, 오른쪽은 둘이 만나 만든 서로 다른 네 개 중 세 개만 X 표시이고 하나는 살아남은 그림"><style>
