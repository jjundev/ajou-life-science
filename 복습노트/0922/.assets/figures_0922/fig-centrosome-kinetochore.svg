<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="양쪽 끝에 직각으로 놓인 중심립 두 개로 된 중심체가 있고, 각 중심체에서 뻗은 미세소관 선이 가운데 염색체의 동원체에 닿는다. 염색체는 자매염색분체 두 가닥이 가운데 색칠된 점인 동원체에서 붙어 있다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
