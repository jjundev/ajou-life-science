<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="원 세 개 (가), (나), (다). (가)에는 두 가닥짜리 막대 네 개가 가운데 세로 점선 위에 위아래로 한 줄로 서 있다. 긴 실선, 긴 점선, 짧은 실선, 짧은 점선 순서다. (나)에는 위쪽에 긴 실선 두 가닥과 긴 점선 두 가닥이 가운데 점선 양옆에 옆으로 나란히 붙어 있고, 아래쪽에 짧은 실선 두 가닥과 짧은 점선 두 가닥이 같은 식으로 나란히 붙어 있다. (다)에는 두 가닥짜리 긴 실선 막대 하나와 짧은 점선 막대 하나가 가운데 점선 위에 위아래로 한 줄로 서 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
