<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="왼쪽의 받는 가지에서 몸통을 지나 긴 꼬리를 따라 오른쪽 끝으로 소식이 한 방향으로 가는 그림"><style>
