<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-label="왼쪽: 움직여 전달자에서 나온 색칠된 동그라미 쪽지가 근육의 받는 자리로 가지만 세모 테두리 독이 자리를 차지해 근육이 축 늘어진 물결선으로 그려져 있다. 오른쪽: 멈춰 전달자에서 움직여 전달자로 가는 선에 X 표시가 있고, 움직여 전달자에서 근육으로 색칠된 동그라미 쪽지가 줄지어 내려가 근육이 뾰족한 지그재그로 너무 세게 움츠러들어 있다."><style>
