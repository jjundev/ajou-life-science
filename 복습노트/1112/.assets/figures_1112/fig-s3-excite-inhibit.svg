<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="받는 세포의 벽에 테두리로 그린 문 세 개. 왼쪽 문으로는 플러스 알갱이가 들어오고, 가운데 문으로는 플러스 알갱이가 나가고, 오른쪽 문으로는 마이너스 알갱이가 들어온다. 왼쪽은 신호가 커지고 가운데와 오른쪽은 잠잠해진다"><style>
