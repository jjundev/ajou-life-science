<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="받는 세포의 세 채널에서 가능한 이동의 예. 왼쪽은 Na⁺가 들어와 흥분하는 경우, 가운데는 K⁺가 나가 억제되는 경우, 오른쪽은 Cl⁻가 들어와 억제되는 경우다. Cl⁻의 순이동은 막전위에 따라 달라진다"><style>
