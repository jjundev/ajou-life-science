<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="휴지 상태의 세포 안쪽 전위는 바깥쪽보다 낮다. 오른쪽의 화살표는 누설 채널을 통한 K⁺ 유출과 Na⁺ 유입 방향을 표시한다."><style>
