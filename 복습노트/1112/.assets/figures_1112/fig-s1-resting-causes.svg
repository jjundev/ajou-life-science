      <text x="110" y="45" text-anchor="middle" class="fig-text" font-size="13">(1) Na⁺/K⁺ 펌프</text><text x="110" y="68" text-anchor="middle" class="fig-text" font-size="13">Na⁺ 3개 밖으로</text><text x="110" y="88" text-anchor="middle" class="fig-text" font-size="13">K⁺ 2개 안으로</text>
      <text x="320" y="45" text-anchor="middle" class="fig-text" font-size="13">(2) 높은 K⁺ 투과성</text><text x="320" y="68" text-anchor="middle" class="fig-text" font-size="13">K⁺는 밖으로</text><text x="320" y="88" text-anchor="middle" class="fig-text" font-size="13">Na⁺는 안으로</text>
      <text x="530" y="45" text-anchor="middle" class="fig-text" font-size="13">(3) 세포 안 음이온</text><text x="530" y="68" text-anchor="middle" class="fig-text" font-size="13">DNA(인산)·단백질</text><text x="530" y="88" text-anchor="middle" class="fig-text" font-size="13">막을 쉽게 못 건넘</text>
