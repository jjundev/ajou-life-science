<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="세 개의 테두리 상자, 곧 펌프의 Na⁺ 3개 밖·K⁺ 2개 안, K⁺ 누설 채널이 더 많아 K⁺가 더 새 나감, 세포 안 음이온 DNA와 단백질에서 화살표가 모여 아래 테두리 상자 안쪽 마이너스 바깥 플러스 휴지전위로 이어진다"><style>
