<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="막을 가로지르는 테두리 타원의 Na⁺/K⁺ 펌프가 ATP 에너지를 써서 Na⁺ 3개를 세포 밖으로 올려 보내고 K⁺ 2개를 세포 안으로 내려 보낸다. 그 결과 바깥에는 Na⁺, 안쪽에는 K⁺가 많아진다"><style>
