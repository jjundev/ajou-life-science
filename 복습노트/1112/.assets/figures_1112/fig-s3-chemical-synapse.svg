<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="교재 그림 12.7과 같은 이름으로 그린 화학 시냅스 구조. 위쪽 시냅스 전 뉴런의 축삭말단 옆벽에 전압개폐성 Ca²⁺ 채널이 있고 테두리 고리로 그린 Ca²⁺가 안으로 들어온다. 말단 안에는 테두리 원인 시냅스 소포가 있고 그 안의 색칠된 점이 신경전달물질이다. 소포 하나는 시냅스 전 막과 이어져 열려 있고, 신경전달물질이 시냅스 틈을 건너 아래 시냅스 후 막의 리간드 개폐성 이온 채널에 붙는다. 이 예시에서는 열린 채널을 지나 이온이 아래로 들어간다"><style>
