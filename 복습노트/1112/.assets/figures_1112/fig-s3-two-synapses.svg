<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-label="왼쪽은 두 세포 사이 틈을 색칠된 작은 알갱이가 건너가는 모습, 오른쪽은 두 세포가 테두리로 그린 터널로 이어져 알갱이가 그 속을 지나가는 모습"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
