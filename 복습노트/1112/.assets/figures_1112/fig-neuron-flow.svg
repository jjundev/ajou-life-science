<svg xmlns="http://www.w3.org/2000/svg" width="660" height="120" viewBox="0 0 660 120" role="img" aria-label="감각에서 구심성 뉴런, 연합뉴런, 원심성 뉴런을 거쳐 근육으로 신호가 가는 세 칸 흐름도"><style>
