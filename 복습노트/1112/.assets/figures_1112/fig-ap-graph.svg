<svg xmlns="http://www.w3.org/2000/svg" width="560" height="310" viewBox="0 0 560 310" role="img" aria-label="예시 막전위 그래프. 휴지전위 −70 mV에서 역치 −55 mV를 지나 최고치 +30 mV에 이른다. 최고치 부근에서 Na⁺ 채널이 불활성화되고 지연성 K⁺ 채널의 작용이 커져 재분극, 과분극, 휴지전위 회복으로 이어진다."><style>
