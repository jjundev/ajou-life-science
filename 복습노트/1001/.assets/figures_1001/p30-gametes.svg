<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262" role="img" aria-label="맨 위 원 모양 세포 하나에 빨간 실선 막대 하나와 파란 점선 막대 하나가 들어 있다. 이 세포에서 선이 아래 배우자 원 네 개로 이어진다. (가)에는 빨간 실선 막대 1개, (나)에는 빨간 실선 막대 1개, (다)에는 파란 점선 막대 2개가 들어 있고 (라)에는 막대가 없다. 범례: 빨간 실선 막대와 파란 점선 막대는 상동염색체 한 쌍의 두 염색체이다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
