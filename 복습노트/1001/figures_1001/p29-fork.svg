<svg xmlns="http://www.w3.org/2000/svg" width="360" height="224" viewBox="0 0 360 224" role="img" aria-label="오른쪽에 아직 풀리지 않은 두 가닥이 있고 왼쪽으로 Y자로 벌어진 복제분기점. 오른쪽 위에 굵은 화살표가 오른쪽을 가리켜 분기점이 오른쪽으로 움직임을 나타낸다. 위쪽 부모 가닥 아래의 새 가닥 (가)는 왼쪽 끝의 작은 프라이머 칸 하나에서 시작해 분기점 쪽인 오른쪽으로 길게 이어진 화살표 하나이다. 아래쪽 부모 가닥 위의 새 가닥 (나)는 왼쪽을 가리키는 짧은 화살표 세 개로 나뉘어 있고, 조각마다 오른쪽 시작 끝에 작은 프라이머 칸이 있으며 조각 사이에는 틈이 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
