<svg xmlns="http://www.w3.org/2000/svg" width="520" height="180" viewBox="0 0 520 180" role="img" aria-label="피부 선 위에 테두리 물방울이 있고, 위로 향하는 화살표 두 개가 열을 가지고 날아가는 모습을 나타낸 그림"><style>
