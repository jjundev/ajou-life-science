<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-label="왼쪽은 Na 테두리 원에서 Cl 테두리 원으로 전자 하나가 화살표로 옮겨 가는 그림, 오른쪽은 두 H 테두리 원이 겹친 자리에 전자 두 개가 함께 있는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
