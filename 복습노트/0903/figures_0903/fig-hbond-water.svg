<svg xmlns="http://www.w3.org/2000/svg" width="540" height="230" viewBox="0 0 540 230" role="img" aria-label="왼쪽 물 분자는 O에 δ−, 두 H에 δ+가 적혀 있고 O–H 사이에 공유 전자 e가 O 쪽으로 끌리는 화살표가 있다. 오른쪽 물 분자의 O와 왼쪽 분자의 H 사이가 점선으로 이어져 수소결합이라고 적힌 그림"><style>
