<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" aria-label="두 아미노산의 공통 골격과 서로 다른 R기. 아미노산이 펩타이드 결합으로 연결되어 단백질을 이룬다는 해설." role="img" aria-labelledby="p4-web-ch01-q09-explained-title p4-web-ch01-q09-explained-desc"><style>
