</style><rect x="0" y="0" width="680" height="650" rx="10" fill="#ffffff"/>
  <title id="p4-web-ch01-q09-explained-title">두 분자의 구조식과 공통 골격 해설</title>
  <desc id="p4-web-ch01-q09-explained-desc">왼쪽 중심 C의 위에는 음영 처리된 CH3, 왼쪽 아래에는 H3N+, 오른쪽 아래에는 COO−, 아래에는 H가 결합한다. 오른쪽 중심 C의 위에는 음영 처리된 CH2–CH2–S–CH3가 아래에서 위 순서로 연결된다. 오른쪽 중심 C에도 왼쪽 아래 H3N+, 오른쪽 아래 COO−, 아래 H가 결합한다.</desc>
  <rect x="0" y="0" width="680" height="650" fill="white"/>
  <g fill="#172033" font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <rect x="152" y="115" width="78" height="50" rx="8" fill="#d4d4d4"/>
    <rect x="482" y="20" width="78" height="263" rx="8" fill="#d4d4d4"/>
    <text x="170" y="225" font-size="30">C</text>
    <text x="62" y="274" font-size="30">H<tspan baseline-shift="sub" font-size="20">3</tspan><tspan baseline-shift="baseline" font-size="30">N</tspan><tspan baseline-shift="super" font-size="20">+</tspan></text>
    <text x="232" y="274" font-size="30">COO<tspan baseline-shift="super" font-size="20">−</tspan></text>
    <text x="169" y="330" font-size="30">H</text>
    <line x1="167" y1="227" x2="137" y2="247" stroke="#303540" stroke-width="2.5"/>
    <line x1="194" y1="227" x2="229" y2="249" stroke="#303540" stroke-width="2.5"/>
    <line x1="180" y1="233" x2="180" y2="302" stroke="#303540" stroke-width="2.5"/>
    <text x="500" y="335" font-size="30">C</text>
    <text x="392" y="384" font-size="30">H<tspan baseline-shift="sub" font-size="20">3</tspan><tspan baseline-shift="baseline" font-size="30">N</tspan><tspan baseline-shift="super" font-size="20">+</tspan></text>
    <text x="562" y="384" font-size="30">COO<tspan baseline-shift="super" font-size="20">−</tspan></text>
    <text x="499" y="440" font-size="30">H</text>
    <line x1="497" y1="337" x2="467" y2="357" stroke="#303540" stroke-width="2.5"/>
    <line x1="524" y1="337" x2="559" y2="359" stroke="#303540" stroke-width="2.5"/>
    <line x1="510" y1="343" x2="510" y2="412" stroke="#303540" stroke-width="2.5"/>
    <text x="166" y="151" font-size="30">CH<tspan baseline-shift="sub" font-size="20">3</tspan></text>
    <line x1="180" y1="166" x2="180" y2="195" stroke="#303540" stroke-width="2.5"/>
    <text x="496" y="61" font-size="30">CH<tspan baseline-shift="sub" font-size="20">3</tspan></text>
    <text x="500" y="126" font-size="30">S</text>
    <text x="496" y="196" font-size="30">CH<tspan baseline-shift="sub" font-size="20">2</tspan></text>
    <text x="496" y="268" font-size="30">CH<tspan baseline-shift="sub" font-size="20">2</tspan></text>
    <line x1="510" y1="72" x2="510" y2="99" stroke="#303540" stroke-width="2.5"/>
    <line x1="510" y1="135" x2="510" y2="167" stroke="#303540" stroke-width="2.5"/>
    <line x1="510" y1="206" x2="510" y2="239" stroke="#303540" stroke-width="2.5"/>
    <line x1="510" y1="278" x2="510" y2="307" stroke="#303540" stroke-width="2.5"/>
    <text x="24" y="32" font-size="25" font-weight="bold">공통 골격: 중심 C에 네 가지가 결합</text>
    <rect x="15" y="470" width="650" height="165" rx="12" fill="#eef5fb"/>
    <text x="32" y="505" font-size="25">H3N+ : 아미노기     COO− : 카복실기</text>
    <text x="32" y="544" font-size="25">회색 부분 = 서로 다른 R기(곁사슬)</text>
    <text x="32" y="583" font-size="25">공통 골격을 가진 이 분자들은 아미노산</text>
    <text x="32" y="618" font-size="25" font-weight="bold">아미노산 → 펩타이드 결합 → 단백질</text>
  </g>
</svg>
