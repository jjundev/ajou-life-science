<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-label="육각형 테두리 하나(단당류), 육각형 두 개가 선으로 이어진 것(이당류), 육각형 여러 개가 길게 이어진 것(다당류)을 나란히 그린 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
