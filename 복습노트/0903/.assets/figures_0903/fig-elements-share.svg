<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-label="큰 테두리 상자 안에 C, H, O, N 네 칸이 96퍼센트를 차지하고, 옆의 작은 칸이 나머지 4퍼센트, 아주 작은 점이 미량원소를 나타내는 그림"><style>
