<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="위쪽은 C와 H 사이 가운데에 전자 점 두 개가 있고, 아래쪽은 O와 H 사이 전자 점 두 개가 O 쪽으로 치우쳐 O 옆에 δ−, H 옆에 δ+가 적힌 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="520" height="190" rx="10" fill="#ffffff"/>
      <circle cx="80" cy="50" r="24" class="fig-ink"/><text x="72" y="55" class="fig-text">C</text>
      <circle cx="240" cy="50" r="24" class="fig-ink"/><text x="233" y="55" class="fig-text">H</text>
      <circle cx="160" cy="44" r="5" class="fig-dot"/><circle cx="160" cy="58" r="5" class="fig-dot"/>
      <text x="300" y="55" class="fig-text">가운데 → 비극성</text>
      <circle cx="80" cy="140" r="24" class="fig-accent"/><text x="72" y="145" class="fig-text">O</text>
      <circle cx="240" cy="140" r="24" class="fig-ink"/><text x="233" y="145" class="fig-text">H</text>
      <circle cx="118" cy="134" r="5" class="fig-dot"/><circle cx="118" cy="148" r="5" class="fig-dot"/>
      <text x="60" y="185" class="fig-text">δ−</text><text x="228" y="185" class="fig-text">δ+</text>
      <text x="300" y="145" class="fig-text">O 쪽으로 쏠림 → 극성</text>
    </svg>
