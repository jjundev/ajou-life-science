<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="왼쪽: 색칠된 구슬이 한 줄로 이어진 1차 구조. 가운데: 용수철처럼 꼬인 선(알파 나선)과 지그재그 선(베타 병풍)인 2차 구조. 오른쪽: 선이 뭉쳐 접힌 덩어리인 3차 구조"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
