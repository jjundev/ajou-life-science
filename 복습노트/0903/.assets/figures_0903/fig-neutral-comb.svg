<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="위쪽 가로 테두리 막대(글리세롤)에 아래로 긴 지그재그 선 세 개(지방산)가 매달린 중성지방 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
