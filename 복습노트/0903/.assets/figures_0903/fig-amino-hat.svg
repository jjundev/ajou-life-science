<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="몸통 테두리 네모 두 개가 똑같고, 위에 올린 모자 모양만 하나는 작은 세모, 하나는 긴 막대로 다른 그림"><style>
