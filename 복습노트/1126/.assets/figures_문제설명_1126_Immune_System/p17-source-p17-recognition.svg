    <title id="p17-source-p17-title">두 수용체가 물질에 붙은 모습</title>
    <desc id="p17-source-p17-description">가에서는 아래쪽 선에 꽂힌 Y자 모양 끝이 위쪽의 큰 덩어리 표면에 닿아요. 나에서는 위쪽 선에 꽂힌 U자 모양 안에 얇은 조각이 있고, 아래쪽 선에 꽂힌 수용체의 끝이 그 조각에 닿아요.</desc>
