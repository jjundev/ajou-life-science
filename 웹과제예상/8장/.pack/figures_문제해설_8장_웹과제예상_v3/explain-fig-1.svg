<svg xmlns="http://www.w3.org/2000/svg" width="340" height="160" viewBox="0 0 340 160" role="img" aria-label="지구 탄생부터 현재까지의 지질시대 시간축 도식. 명왕이언 다음 순서대로 이언 (가)와 (나)가 이어지고, 현생이언은 (다), (라), 신생대의 세 시기로 구분되어 있다."><style>
