<svg xmlns="http://www.w3.org/2000/svg" width="340" height="175" viewBox="0 0 340 175" role="img" aria-label="배 발생에서 유전자 (가)가 산물 (나)를 거쳐 유전자 (다)의 프로모터에 작용하여 (라) 몸 부위 구조를 형성하는 경로와, (가)의 발현 부위가 가슴에서 머리로 바뀔 때 다리 구조 형성 위치가 달라지는 비교 모식도."><style>
