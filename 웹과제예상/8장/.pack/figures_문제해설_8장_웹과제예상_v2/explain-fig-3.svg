<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" role="img" aria-label="계통수 I과 II의 가지와 끝 이름을 보여 준다. I은 왼쪽부터 A, B, C, D이고 II는 왼쪽부터 D, C, B, A이다. 각 그림의 뿌리와 갈림점의 연결을 따라 관계를 읽을 수 있다."><style>
