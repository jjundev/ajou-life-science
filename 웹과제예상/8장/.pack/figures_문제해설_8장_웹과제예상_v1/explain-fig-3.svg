<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" role="img" aria-label="아래 뿌리 갈림점에서 왼쪽 가지와 오른쪽 가지가 나뉘어요. 오른쪽 가지는 뿌리 갈림점보다 약간 위에서 (다)와 나머지 가지로 갈라져요. 왼쪽 가지는 그보다 조금 더 위, 그림 높이의 약 3분의 1 지점에서 (가)와 (나)로 갈라져요. 오른쪽 나머지 가지는 그림 높이의 약 4분의 3 지점에서 (라)와 (마)로 갈라져요. 다섯 끝은 모두 같은 현재 높이에 닿고, 왼쪽 화살표는 아래가 과거, 위가 현재임을 나타내요."><style>
