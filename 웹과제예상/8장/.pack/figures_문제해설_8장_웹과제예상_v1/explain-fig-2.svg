<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-label="두 그래프 모두 가로축은 지질 시간, 세로축은 화석의 몸 크기예요. (가)는 오랫동안 평평하다가 짧은 구간에서 가파르게 오르는 일을 두 번 되풀이한 계단 모양이에요. (나)는 처음부터 끝까지 완만하게 꾸준히 올라가요."><style>
