<svg xmlns="http://www.w3.org/2000/svg" width="350" height="225" viewBox="0 0 350 225" role="img" aria-label="복제 전 DNA는 옛 가닥 두 개이며 첫 복제 뒤 각 분자에 옛 가닥 하나와 새 가닥 하나가 있다. 첫 복제의 두 분자가 각각 다시 복제하여 최종 네 분자가 되며 최종 가닥 표시는 비어 있다."><style>
