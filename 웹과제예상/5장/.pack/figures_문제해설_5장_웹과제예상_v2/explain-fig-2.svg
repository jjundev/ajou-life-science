<svg xmlns="http://www.w3.org/2000/svg" width="340" height="285" viewBox="0 0 340 285" role="img" aria-label="핵 안에 DNA에서 전구체 mRNA로 향하는 화살표와 가공 과정 X가 있고, 성숙 mRNA가 핵 경계를 지나 세포질의 리보솜 과정 Y로 이동하여 단백질이 된다."><style>
