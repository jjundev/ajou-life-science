<svg xmlns="http://www.w3.org/2000/svg" width="350" height="185" viewBox="0 0 350 185" role="img" aria-label="주형가닥은 연속 실선이고 새 가닥은 X에서 골격이 끊겨 있다. 끊긴 골격 양쪽을 포함하여 모든 위치에 염기가 있고 각각 주형과 짝을 이룬다."><style>
