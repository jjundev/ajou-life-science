<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-label="위 부모 가닥은 왼쪽 3프라임에서 오른쪽 5프라임, 아래 부모 가닥은 왼쪽 5프라임에서 오른쪽 3프라임이고 복제분기점은 오른쪽으로 이동한다. 위 부모 가닥 안쪽은 X, 아래쪽 안쪽은 Y이다."><style>
