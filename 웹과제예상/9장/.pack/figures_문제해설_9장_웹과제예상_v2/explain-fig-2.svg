<svg xmlns="http://www.w3.org/2000/svg" width="340" height="225" viewBox="0 0 340 225" role="img" aria-label="위는 시냅스 전 뉴런, 아래는 시냅스 후 뉴런이다. (가)는 위에서 축삭말단 쪽으로 향하는 화살표, (나)는 축삭말단 옆 막을 가로질러 안으로 향하는 화살표다. (라)는 축삭말단 아래쪽 막의 주머니 모양을, (다)는 틈 건너편 막의 홈을 가리킨다. (마)는 아래쪽 뉴런 내부의 화살표를 가리킨다."><style>
