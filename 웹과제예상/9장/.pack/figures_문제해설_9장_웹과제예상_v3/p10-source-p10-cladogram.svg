<svg xmlns="http://www.w3.org/2000/svg" width="340" height="215" viewBox="0 0 340 215" role="img" aria-label="왼쪽 아래 뿌리에서 오른쪽 위로 뻗어 나가는 분기도. 뿌리 뒤 첫 갈림 전의 지점 1을 지나 가지 M이 갈라지고, 지점 2를 지나 가지 N과 그 다음 가지 P가 차례로 갈라지며, 지점 3을 지나 가지 Q가 갈라지고, 지점 4를 지나 가지 R과 S가 갈라진다. N과 P는 점선 테두리 묶음 (가)로, R과 S는 점선 테두리 묶음 (나)로 묶여 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
