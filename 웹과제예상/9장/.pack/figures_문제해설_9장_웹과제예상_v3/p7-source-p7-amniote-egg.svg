<svg xmlns="http://www.w3.org/2000/svg" width="340" height="210" viewBox="0 0 340 210" role="img" aria-label="육상 척추동물 알의 겉껍데기 안쪽 구조를 나타낸 단면 모식도. 배를 직접 감싸는 가장 안쪽 막과 액체 공간이 (가), 배와 연결되어 오른쪽 위로 뻗은 주머니가 (나), 배와 연결되어 아래쪽에 놓인 주머니가 (다), 껍데기 바로 안쪽에서 전체를 둘러싼 가장 바깥 막이 (라)이다."><style>
