<svg xmlns="http://www.w3.org/2000/svg" width="340" height="156" viewBox="0 0 340 156" role="img" aria-label="물길은 왼쪽부터 X, Y 순서이고 물은 왼쪽에서 오른쪽으로 흐른다. X 전후에는 물속에 먹이 입자가 여러 개 보인다. Y의 물길 벽에는 먹이 입자가 붙어 있고, Y를 지난 물에는 먹이 입자가 하나 보인다."><style>
