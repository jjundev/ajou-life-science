<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-label="숙주세포와 이웃 세포를 나타낸 도식. (가)에서는 바이러스 입자가 세포 표면의 수용체에 붙어 세포 안으로 들어가고, (나)에서는 세포 안에서 바이러스 유전체가 여러 개로 늘어나며, (다)에서는 세포 안에서 만들어진 새 입자가 세포 표면을 지나 밖으로 나와 이웃 세포 쪽으로 향한다."><style>
