<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" role="img" aria-label="위에서 본 두 눈과 좌반구·우반구 모식도예요. 정면 가운데 점선을 기준으로 왼쪽 시야에 열쇠가 놓여 있고, 두 눈에서 열쇠를 향한 점선이 이어져 있어요. 아래쪽 좌반구와 우반구를 잇는 뇌량 자리에는 절단을 뜻하는 × 표시가 있어요."><style>
