<svg xmlns="http://www.w3.org/2000/svg" width="340" height="256" viewBox="0 0 340 256" role="img" aria-label="위쪽 세포의 돌기를 따라 활동전위가 아래로 도착하는 모식도예요. 기호 (가)는 위쪽 세포의 옆막에 있고 이온이 안으로 지나가는 자리, (나)는 위쪽 세포의 아래 막이 안쪽으로 둥글게 이어져 열린 자리, (다)는 두 세포 사이의 공간, (라)는 아래쪽 세포의 막에 있고 알갱이가 붙어 있으며 이온이 지나가는 자리예요."><style>
