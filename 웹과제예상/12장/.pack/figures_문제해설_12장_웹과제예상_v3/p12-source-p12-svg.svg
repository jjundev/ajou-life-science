<svg xmlns="http://www.w3.org/2000/svg" width="340" height="222" viewBox="0 0 340 222" role="img" aria-label="대뇌를 옆에서 본 윤곽을 점선으로 네 구역으로 나눈 그림이에요. (가)는 오른쪽 위, (나)는 아래, (다)는 왼쪽 위, (라)는 왼쪽 끝에 있어요. 그림 아래의 ‘뇌의 앞쪽’ 화살표는 오른쪽을 가리켜요."><style>
