<svg xmlns="http://www.w3.org/2000/svg" width="340" height="176" viewBox="0 0 340 176" role="img" aria-label="곧게 편 기저막을 위에서 본 띠 그림이에요. 오른쪽 끝에 타원창이 있고, 띠의 폭은 오른쪽 끝이 좁고 왼쪽으로 갈수록 넓어져요. 띠를 따라 모세포가 점으로 늘어서 있으며, 타원창 가까운 구간의 모세포는 × 모양으로 표시되어 있어요."><style>
