<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" role="img" aria-label="가로축은 부리 깊이(mm)이고 세로축은 개체 수예요. 가뭄 전 집단 실선 곡선은 높고 넓으며 평균 점선이 왼쪽에 있고, 가뭄 후 생존자 강조선 곡선은 낮으며 평균 점선이 오른쪽 깊은 부리 쪽에 있어요."><style>
