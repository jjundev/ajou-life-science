<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" role="img" aria-label="가로축은 짧음, 중간, 김 순의 꼬리 길이이고 세로축은 생존율이에요. 짧음과 김은 80%, 중간은 20%예요."><style>
