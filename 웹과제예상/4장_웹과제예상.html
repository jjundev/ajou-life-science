<!DOCTYPE html>
<!--
  4장(유전) 웹과제 예상 — 2026-10-08 응시용.
  근거: webquiz-style.md(1~3장 46문항 집계), 0929·1001 정리노트, 장마감_1001_4장.md.
  예상일 뿐 실제 문제가 아니다. 정답은 <details class="sol">에 접어 둔다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4장 웹과제 예상</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #ffffff; --surface: #f7f8fa; --ink: #111111; --ink-2: #6b7280; --line: #d9dee7;
      --accent: #1677ff; --accent-ink: #1b64da; --warn: #b54708; --prof: #6941c6; --supp: #067647;
      --font: 'Pretendard', system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171c; --surface: #212128; --ink: #f2f4f6; --ink-2: #a3abb8; --line: #34353d;
        --accent: #3182f6; --accent-ink: #6ea4ff; --warn: #f5a15c; --prof: #b69cff; --supp: #5fd39a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
      font-size: 16px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    h2 { font-size: 20px; margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
    .sub { color: var(--ink-2); margin: 0 0 16px; }
    .toc { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
    .toc a { color: var(--accent-ink); text-decoration: none; background: var(--surface);
      padding: 4px 10px; border-radius: 8px; }
    .table-wrap { overflow-x: auto; margin: 12px 0; }
    table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14.5px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
    th { color: var(--ink-2); font-weight: 600; }
    .stars { color: var(--warn); white-space: nowrap; }
    .trap { color: var(--warn); }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px;
      background: var(--surface); color: var(--ink-2); margin-right: 4px; }
    .q { background: var(--surface); border-radius: var(--radius); padding: 16px; margin: 16px 0; }
    .q h3 { font-size: 16px; margin: 0 0 8px; }
    .opts { padding-left: 0; list-style: none; margin: 8px 0; }
    .opts li { padding: 4px 0; }
    .opts li::before { content: attr(data-opt) ". "; font-weight: 600; color: var(--ink-2); }
    .stmts { padding-left: 0; list-style: none; }
    details.sol { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
    details.sol summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; }
    .ans { font-weight: 700; color: var(--supp); }
    figure { margin: 8px 0; }
    figure svg { width: 100%; max-width: 360px; height: auto; display: block; }
    .fig-ink { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
    .fig-accent { fill: none; stroke: var(--accent); stroke-width: 3; }
    .fig-dot { fill: var(--accent); }
    .fig-text { fill: var(--ink); font-size: 13px; font-family: var(--font); }
    .fig-muted { fill: var(--ink-2); font-size: 11px; font-family: var(--font); }
    .check li { margin: 4px 0; }
  </style>
</head>
<body>
<main>
  <h1>4장 유전 웹과제 예상</h1>
  <p class="sub">2026-10-08(목) 응시 · 지난 웹과제 46문항 패턴과 4장 기출·정리노트로 추론한 예상이에요. 실제 문제가 아니에요.</p>
  <ul class="toc">
    <li><a href="#format">① 형식 예상</a></li>
    <li><a href="#topics">② 주제별 예상</a></li>
    <li><a href="#mock">③ 예상 모의문제 15</a></li>
    <li><a href="#last">④ 막판 체크</a></li>
  </ul>

  <section class="sec" id="format">
    <h2>① 형식 예상</h2>
  </section>

  <section class="sec" id="topics">
    <h2>② 주제별 예상</h2>
  </section>

  <section class="sec" id="mock">
    <h2>③ 예상 모의문제 15</h2>
  </section>

  <section class="sec" id="last">
    <h2>④ 막판 체크</h2>
  </section>
</main>
</body>
</html>
