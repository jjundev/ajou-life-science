<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[노트 제목] · 그림 설명서</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#172033;--muted:#5d687d;--line:#dfe5ef;--blue:#356ae6;--teal:#07877f;--rose:#b83d59;--dark:#182238}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1060px;margin:auto;padding:28px 18px 80px}header,.card,footer{border-radius:18px;padding:20px}header{background:linear-gradient(135deg,#1d2c53,#356ae6);color:#fff}h1{line-height:1.15}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);margin-top:14px}.flow{display:flex;gap:10px;overflow:auto}.step{min-width:150px;flex:1;text-align:center;background:#f0f4fb;border:1px solid var(--line);border-radius:14px;padding:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.right{background:#e8faf7;border:1px solid #b9e8df;border-radius:14px;padding:14px}.wrong{background:#fff0f3;border:1px solid #f3c4ce;border-radius:14px;padding:14px}.answer{color:var(--teal);font-weight:800}.rule{background:var(--dark);color:#fff;border-radius:14px;padding:16px;margin-top:14px}@media(max-width:760px){.grid,.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><small>ELI5 · [날짜/범위]</small><h1>[한 문장 비유 제목]</h1><p>[초보자용 한 문장 요약]</p></header>
<section class="card"><h2>30초 전체 지도</h2><p>[핵심 개념 3~5개]</p></section>
<section class="card"><h2>1. [개념]</h2><p>[비유 → 정확한 설명 → 시험 함정]</p></section>
<section class="card"><h2>2. [개념 흐름]</h2><div class="flow"><div class="step">① [시작]</div><div class="step">② [변화]</div><div class="step">③ [결과]</div></div></section>
<section class="card"><h2>비교하기</h2><div class="compare"><div class="right"><b>맞는 설명</b><p>[핵심]</p></div><div class="wrong"><b>헷갈리는 설명</b><p>[함정]</p></div></div></section>
<section class="card"><h2>문항별 정답 근거</h2><div class="answer">[문항 번호] 정답: [답]</div><p>[근거와 오답 함정]</p></section>
<section class="card"><h2>이번 범위 밖</h2><p>[다음 시간에 배울 내용과 보류 문항]</p></section>
<footer><b>한 줄 암기:</b> [가장 중요한 문장]</footer>
</main>
</body>
</html>
