<div id="exam-results" role="region" aria-labelledby="results-title" hidden>
  <h1 id="results-title" tabindex="-1">전체 풀이 결과</h1>
  <p id="results-summary"></p>
  <p class="results-note">단답형은 정답·허용답과 일치하는 경우만 자동으로 확인합니다. 자기채점 대기는 해설과 비교해 주세요. 새로고침하면 답안이 초기화되므로 필요한 기록은 JSON으로 내보내세요.</p>
  <div class="results-actions">
    <button class="btn btn-primary" id="export-exam" type="button">JSON 내보내기</button>
  </div>
  <p id="export-status" role="status" aria-live="polite"></p>
  <div class="results-filter">
    <label for="results-filter">결과 보기</label>
    <select id="results-filter">
      <option value="all">전체</option><option value="incorrect">오답</option>
      <option value="pending">자기채점 대기</option><option value="unanswered">미응답</option>
      <option value="correct">정답</option><option value="matched">자동 일치</option>
    </select>
    <span id="results-count" role="status"></span>
  </div>
  <p id="results-empty" hidden>이 분류에 해당하는 문항이 없습니다.</p>
  <ol id="results-list" aria-label="문항별 풀이 결과"></ol>
</div>
