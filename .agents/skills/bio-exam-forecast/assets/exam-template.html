<!-- Exam extensions to the shared review-template.html shell. -->
<style>
.exam-input fieldset { border:0; padding:0; margin:var(--s5) 0; min-width:0; }
.exam-input legend { font-size:var(--fs-small); color:var(--ink-2); margin-bottom:var(--s3); }
.exam-input label:has(input[type=radio]) {
  display:flex; align-items:baseline; gap:var(--s2); min-height:44px; margin-bottom:var(--s3);
  padding:12px 16px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink); cursor:pointer;
}
.exam-input label:has(input:checked) { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:-2px; }
.exam-input label:hover { border-color:var(--accent); }
.exam-input input[type=radio] { flex:none; accent-color:var(--accent); }
.exam-input input[type=text] { width:100%; margin:var(--s2) 0; padding:12px 16px; font:inherit;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink); caret-color:var(--accent); }
.problem .choices { display:none; }
img, svg { max-width:100%; height:auto; }
.exam-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:var(--s2); padding:var(--s2) var(--s4) 0; }
.exam-actions .btn { min-width:0; min-height:44px; }
#summary { flex-basis:100%; margin:0; text-align:center; font-size:var(--fs-small); color:var(--ink-2); }
#summary:empty { display:none; }
.result { font-weight:650; }
.result:empty { display:none; }
.provenance { font-size:var(--fs-small); overflow-wrap:anywhere; }
.js article.card > .solution, .js article.card > .provenance { display:none !important; }
.solution[hidden], .provenance[hidden] { display:none !important; }
html:not(.js) body { height:auto; display:block; overflow:visible; }
html:not(.js) .layout { display:block; }
html:not(.js) .panel-left { display:none; }
@media print { .exam-actions { display:none; } .solution[hidden], .provenance[hidden] { display:none !important; } }
</style>
