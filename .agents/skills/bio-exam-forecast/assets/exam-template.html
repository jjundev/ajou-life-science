<!-- Exam extensions to the shared review-template.html shell. -->
<style>
.exam-input fieldset { border:0; padding:0; margin:var(--s5) 0; min-width:0; }
.exam-input legend { font-size:var(--fs-small); color:var(--ink-2); margin-bottom:var(--s3); }
.exam-input label:has(input[type=radio]) {
  display:flex; align-items:baseline; gap:var(--s2); min-height:44px; margin-bottom:var(--s3);
  padding:12px 16px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink); cursor:pointer;
}
.exam-input label:has(input:checked) { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:-2px; }
.exam-input label:hover { border-color:var(--accent); }
.exam-input input[type=radio] { flex:none; accent-color:var(--accent); }
.exam-input input[type=text] { width:100%; margin:var(--s2) 0; padding:12px 16px; font:inherit;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink); caret-color:var(--accent); }
.problem .choices { display:none; }
img, svg { max-width:100%; height:auto; }
.exam-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:var(--s2); padding:var(--s2) var(--s4) 0; }
.exam-actions .btn { min-width:0; min-height:44px; }
#summary { flex-basis:100%; margin:0; text-align:center; font-size:var(--fs-small); color:var(--ink-2); }
#summary:empty { display:none; }
.result { font-weight:650; }
.result:empty { display:none; }
.provenance { font-size:var(--fs-small); overflow-wrap:anywhere; }
.js article.card > .solution, .js article.card > .provenance { display:none !important; }
.solution[hidden], .provenance[hidden] { display:none !important; }
html:not(.js) body { height:auto; display:block; overflow:visible; }
html:not(.js) .layout { display:block; }
html:not(.js) .panel-left { display:none; }
@media print { .exam-actions { display:none; } .solution[hidden], .provenance[hidden] { display:none !important; } }
</style>
<style>
#exam-results[hidden], .exam-result-row[hidden], #results-empty[hidden] { display:none !important; }
body.exam-results main > section, body.exam-results main > .hero, body.exam-results .pager { display:none !important; }
#exam-results { padding:var(--s6) 0; }
#results-title { font-size:clamp(28px, 6vw, 36px); line-height:1.3; margin:0 0 var(--s4); }
#results-title:focus { outline:none; }
#results-summary { font-weight:650; line-height:1.8; font-variant-numeric:tabular-nums; }
.results-note, #prompt-status, #results-count { color:var(--ink-2); font-size:var(--fs-small); }
.results-actions, .results-filter { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3); margin:var(--s4) 0; }
.results-actions .btn { min-height:44px; min-width:0; }
.results-filter select { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; min-height:44px; max-width:100%; }
#results-list { list-style:none; padding:0; margin:var(--s5) 0; }
.exam-result-row { border-top:1px solid var(--line); padding:var(--s4) 0; overflow-wrap:anywhere; }
.exam-result-row h3 { margin:0; font-size:var(--fs-body); }
.exam-result-status { margin:var(--s2) 0; font-weight:650; }
.exam-result-row dl { display:grid; grid-template-columns:4em minmax(0,1fr); gap:var(--s2) var(--s3); margin:var(--s3) 0; }
.exam-result-row dt { color:var(--ink-2); }
.exam-result-row dd { margin:0; white-space:pre-wrap; }
.exam-result-row a { display:inline-block; padding:8px 0; min-height:44px; }
#prompt-status:empty { display:none; }
@media print { .results-actions, .results-filter, .exam-result-row a { display:none !important; } }
</style>

<style>
#submit-exam[hidden], body.exam-last-unsubmitted #pager-next { display:none !important; }
#exam-scorecard { width:100%; table-layout:fixed; border-collapse:collapse; font-variant-numeric:tabular-nums; }
#exam-scorecard caption { text-align:left; font-weight:650; padding:var(--s3) 0; }
#exam-scorecard td { padding:0; border:1px solid var(--line); text-align:center; }
#exam-scorecard a { display:flex; align-items:center; justify-content:center; min-height:44px; color:var(--ink); font-size:var(--fs-small); text-decoration:none; }
#exam-scorecard a:hover { background:var(--surface); text-decoration:underline; }
#exam-scorecard a:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; }
#exam-scorecard a[data-result=incorrect] { font-weight:750; }
.scorecard-legend { color:var(--ink-2); font-size:var(--fs-small); line-height:1.8; }
</style>

<style>
.exam-actions:has(#submit-exam[hidden]):has(#summary:empty) { display:none; }
@media (max-width:600px) {
  .topbar-inner { gap:4px; }
  .topbar-inner .text-btn:not(.theme-toggle) { padding:0 6px; }
  .topbar-inner .brand { overflow:hidden; text-overflow:ellipsis; }
  #reset-exam { white-space:nowrap; }
}
html:not(.js) #reset-exam { display:none; }
</style>
