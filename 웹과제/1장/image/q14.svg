<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 910" role="img" aria-label="친수성 머리와 소수성 꼬리가 표시된 분자 구조" aria-labelledby="web-ch01-q14-exam-title web-ch01-q14-exam-desc">
  <title id="web-ch01-q14-exam-title">친수성 머리와 소수성 꼬리가 표시된 분자 구조</title>
  <desc id="web-ch01-q14-exam-desc">위쪽 콜린은 CH2–CH2–N+(CH3)3 구조로, 산소를 통해 인산염에 연결된다. 인산염 P에는 이중결합 O, 단일결합 O− 및 두 연결 산소가 있다. 아래의 산소는 글리세롤의 오른쪽 CH2에 연결된다. 글리세롤의 나머지 CH와 CH2는 각각 O–C(=O)를 통해 두 지방산 꼬리에 연결된다. 왼쪽 꼬리는 곧게 이어지고 오른쪽 꼬리는 이중결합에서 꺾인다. 원본의 콜린, 인산염, 글리세롤, 지방산, 친수성 머리, 소수성 꼬리 표지를 보존했다.</desc>
