<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 660.1" role="img" aria-label="두 염색체의 모식도 해설" aria-labelledby="web-ch03-q06-explained-title web-ch03-q06-explained-desc">
  <title id="web-ch03-q06-explained-title">두 염색체의 모식도 해설</title>
  <desc id="web-ch03-q06-explained-desc">회색 막대 모양 염색체 두 개가 나란히 있고, 각각 위쪽 3분의 1 지점에 잘록한 부분이 있다. 왼쪽 염색체에는 위에서부터 띠 A, 잘록한 부분 바로 위의 띠 B, 잘록한 부분 X, 아래쪽 띠 C가 표시되어 있다. 오른쪽 염색체에는 같은 높이의 띠에 a, b, c가 표시되어 있다. 해설: 두 염색체는 상동염색체이며 A와 a, B와 b, C와 c는 같은 유전자 자리에 있는 대립유전자이다. X는 방추사가 부착되는 동원체이다. 자매염색분체라면 복제로 생겨 같은 대립유전자를 가지므로 이 두 염색체는 자매염색분체가 아니다.</desc>
  <rect x="0" y="0" width="380" height="660.1" fill="white" />
  <g fill="#172033" font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <path d="M75,57.5 A37.5,30 0 0 1 150,57.5 L150,172 Q150,180 135.8,185 Q150,190 150,200 L150,430.5 A37.5,30 0 0 1 75,430.5 L75,200 Q75,190 89.2,185 Q75,180 75,172 Z" fill="#a9a9a9" stroke="#8c8c8c" stroke-width="2" />
    <rect x="103.1" y="45" width="20.6" height="118" rx="8" fill="#c2c2c2" />
    <rect x="103.1" y="210" width="20.6" height="235" rx="10" fill="#c2c2c2" />
    <path d="M75,70 Q112.5,75 150,70" fill="none" stroke="#4a4a4a" stroke-width="3" />
    <path d="M75,147 Q112.5,152 150,147" fill="none" stroke="#4a4a4a" stroke-width="3" />
    <path d="M75,405 Q112.5,410 150,405" fill="none" stroke="#4a4a4a" stroke-width="3" />
    <path d="M220,56 A36,28.8 0 0 1 292,56 L292,172 Q292,180 278.3,185 Q292,190 292,200 L292,432 A36,28.8 0 0 1 220,432 L220,200 Q220,190 233.7,185 Q220,180 220,172 Z" fill="#a9a9a9" stroke="#8c8c8c" stroke-width="2" />
    <rect x="247" y="45" width="19.8" height="118" rx="8" fill="#c2c2c2" />
    <rect x="247" y="210" width="19.8" height="235" rx="10" fill="#c2c2c2" />
    <path d="M220,70 Q256,75 292,70" fill="none" stroke="#4a4a4a" stroke-width="3" />
    <path d="M220,147 Q256,152 292,147" fill="none" stroke="#4a4a4a" stroke-width="3" />
    <path d="M220,405 Q256,410 292,405" fill="none" stroke="#4a4a4a" stroke-width="3" />
    <line x1="60" y1="70" x2="82" y2="70" stroke="#b0b0b0" stroke-width="2" />
    <text x="43" y="77" font-size="21" text-anchor="middle" font-weight="bold">A</text>
    <line x1="60" y1="147" x2="82" y2="147" stroke="#b0b0b0" stroke-width="2" />
    <text x="43" y="154" font-size="21" text-anchor="middle" font-weight="bold">B</text>
    <line x1="60" y1="405" x2="82" y2="405" stroke="#b0b0b0" stroke-width="2" />
    <text x="43" y="412" font-size="21" text-anchor="middle" font-weight="bold">C</text>
    <line x1="62" y1="185" x2="90" y2="185" stroke="#b0b0b0" stroke-width="2" />
    <text x="42" y="192" font-size="21" text-anchor="middle" fill="#888">X</text>
    <line x1="287" y1="70" x2="312" y2="70" stroke="#b0b0b0" stroke-width="2" />
    <text x="327" y="77" font-size="21" text-anchor="middle" font-weight="bold">a</text>
    <line x1="287" y1="147" x2="312" y2="147" stroke="#b0b0b0" stroke-width="2" />
    <text x="327" y="154" font-size="21" text-anchor="middle" font-weight="bold">b</text>
    <line x1="287" y1="405" x2="312" y2="405" stroke="#b0b0b0" stroke-width="2" />
    <text x="327" y="412" font-size="21" text-anchor="middle" font-weight="bold">c</text>
    <text x="184" y="63" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold">A–a</text>
    <line x1="155" y1="70" x2="215" y2="70" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="155" y1="147" x2="215" y2="147" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="155" y1="405" x2="215" y2="405" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="184" y="140" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold">B–b</text>
    <text x="184" y="398" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold">C–c</text>
    <text x="184" y="300" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold">같은 위치</text>
    <text x="184" y="318" font-size="12" text-anchor="middle" fill="#1f5fa8" font-weight="bold">(유전자 자리)</text>
    <text x="42" y="218" font-size="14" text-anchor="middle" fill="#b4321e" font-weight="bold">동원체</text>
    <rect x="10" y="490" width="360" height="160.1" rx="8" fill="#fff6f3" stroke="#b4321e" stroke-width="1.5" />
    <text x="22" y="514" font-size="14" fill="#b4321e" font-weight="bold">해설</text>
    <text x="22" y="534.3" font-size="14" fill="#b4321e">두 염색체 = 상동염색체 (부모에게서 하나씩)</text>
    <text x="22" y="554.6" font-size="14" fill="#b4321e">A/a, B/b, C/c = 같은 유전자 자리의 대립유전자</text>
    <text x="22" y="574.9" font-size="14" fill="#b4321e">A, B, C는 서로 다른 유전자</text>
    <text x="22" y="595.2" font-size="14" fill="#b4321e">X = 동원체 (방추사가 부착되는 부위)</text>
    <text x="22" y="615.5" font-size="14" fill="#b4321e">자매염색분체가 아니다: 자매염색분체는 복제로</text>
    <text x="22" y="635.8" font-size="14" fill="#b4321e">생겨 같은 대립유전자(A와 A)를 가진다</text>
  </g>
</svg>
