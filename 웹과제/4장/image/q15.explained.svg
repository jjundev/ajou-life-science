<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img"><title>수용체 양의 중간 표현형 해설</title><rect x="15" y="20" width="750" height="150" rx="0" fill="white" stroke="#999" stroke-width="2.5"/><line x1="265" y1="20" x2="265" y2="170" stroke="#aaa" stroke-width="1.5"/><line x1="515" y1="20" x2="515" y2="170" stroke="#aaa" stroke-width="1.5"/><line x1="15" y1="95" x2="765" y2="95" stroke="#aaa" stroke-width="1.5"/><text x="140" y="66" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="29" text-anchor="middle" fill="#202830" font-weight="400">HH</text><text x="140" y="141" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="25" text-anchor="middle" fill="#202830" font-weight="400">정상 수준</text><text x="390" y="66" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="29" text-anchor="middle" fill="#202830" font-weight="400">Hh</text><text x="390" y="141" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="25" text-anchor="middle" fill="#202830" font-weight="400">수용체를 절반만 가짐</text><text x="640" y="66" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="29" text-anchor="middle" fill="#202830" font-weight="400">hh</text><text x="640" y="141" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="25" text-anchor="middle" fill="#202830" font-weight="400">수용체가 없음</text><rect x="30" y="210" width="720" height="170" rx="8" fill="#f1f6fb" stroke="#b6c9dc" stroke-width="2.5"/><text x="58" y="253" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="30" text-anchor="start" fill="#202830" font-weight="400">수용체 양을 측정하는 조건</text><text x="58" y="295" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="28" text-anchor="start" fill="#202830" font-weight="400">HH: 정상 → Hh: 절반 → hh: 없음</text><text x="58" y="341" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="28" text-anchor="start" fill="#202830" font-weight="400">이형접합자의 중간 표현형 = 불완전우성</text></svg>
