    <path d="M115,176 L158,176 C170,176 172,114 192,114 L250,114 C290,114 282,352 355,352 L470,352" fill="none" stroke="#111" stroke-width="3" />
    <path d="M158,176 C172,176 182,68 220,68 C248,68 256,90 262,124" fill="none" stroke="#111" stroke-width="3" />
    <text x="140" y="152" font-size="20" text-anchor="middle">a+b</text>
    <text x="426" y="338" font-size="20" text-anchor="middle">c</text>
