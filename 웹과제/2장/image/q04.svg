<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" role="img" aria-label="효소 유무에 따른 반응의 자유에너지 변화 그래프" aria-labelledby="web-ch02-q04-exam-title web-ch02-q04-exam-desc">
  <title id="web-ch02-q04-exam-title">효소 유무에 따른 반응의 자유에너지 변화 그래프</title>
  <desc id="web-ch02-q04-exam-desc">세로축은 자유에너지, 가로축은 반응 진행이다. 반응물 a+b 수준에서 출발한 곡선 두 개가 각각 높은 봉우리와 낮은 봉우리를 지나 더 낮은 생성물 c 수준에 도달한다. 점선이 높은 봉우리 꼭대기, 낮은 봉우리 꼭대기, a+b 수준, c 수준에 그어져 있다. 양방향 화살표 I은 낮은 봉우리 꼭대기에서 c 수준까지, II는 낮은 봉우리 꼭대기에서 a+b 수준까지, III은 높은 봉우리 꼭대기에서 a+b 수준까지, IV는 a+b 수준에서 c 수준까지의 높이를 나타낸다.</desc>
  <rect x="0" y="0" width="520" height="450" fill="white" />
  <g fill="#172033" font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <line x1="115" y1="397" x2="115" y2="42" stroke="#172033" stroke-width="2.5" />
    <polygon points="115,32 121.6,44 108.4,44" fill="#172033" />
    <line x1="115" y1="397" x2="488" y2="397" stroke="#172033" stroke-width="2.5" />
    <polygon points="500,397 488,403.6 488,390.4" fill="#172033" />
    <line x1="98" y1="178" x2="98" y2="144" stroke="#172033" stroke-width="2" /><polygon points="98,136 103.5,146 92.5,146" fill="#172033" />
    <text x="98" y="215" font-size="28" text-anchor="middle">자</text>
    <text x="98" y="251" font-size="28" text-anchor="middle">유</text>
    <text x="98" y="287" font-size="28" text-anchor="middle">에</text>
    <text x="98" y="323" font-size="28" text-anchor="middle">너</text>
    <text x="98" y="359" font-size="28" text-anchor="middle">지</text>
    <text x="255" y="437" font-size="26" text-anchor="middle">반응 진행</text>
