<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 455.5" role="img" aria-label="ATP 분자의 구조 모식도 해설" aria-labelledby="web-ch02-q15-explained-title web-ch02-q15-explained-desc">
  <title id="web-ch02-q15-explained-title">ATP 분자의 구조 모식도 해설</title>
  <desc id="web-ch02-q15-explained-desc">왼쪽에 육각형과 오각형이 붙은 질소성 염기(아데닌, 오각형에 A 표시), 가운데에 O와 S가 표시된 짙은 오각형의 당(리보오스), 오른쪽에 P 세 개가 사슬로 이어진 3개의 음전하를 띤 인산이 있고 각 P 위에 음전하 기호가 있다. 가는 화살표 세 개가 각각 염기와 당 사이 결합, 당과 첫 번째 인산 사이 결합, 두 번째와 세 번째 인산 사이 결합을 가리킨다. 해설: 두 번째와 세 번째 인산 사이의 결합이 가수분해되어 ATP가 ADP와 무기인산(Pi)으로 바뀌며 에너지가 방출된다. 인산기의 음전하끼리 서로 밀어내어 이 결합은 불안정하다.</desc>
  <rect x="0" y="0" width="520" height="455.5" fill="white" />
  <g fill="#172033" font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <text x="85" y="34" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">질소성 염기</text>
    <text x="85" y="64" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">(아데닌)</text>
    <path d="M23,97 Q23,87 33,87 L78,87 Q88,87 88,79 Q88,87 98,87 L143,87 Q153,87 153,97" fill="none" stroke="#555555" stroke-width="2" />
    <text x="227" y="96" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">당</text>
    <text x="227" y="126" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">(리보오스)</text>
    <path d="M157,160 Q157,150 167,150 L217,150 Q227,150 227,142 Q227,150 237,150 L287,150 Q297,150 297,160" fill="none" stroke="#555555" stroke-width="2" />
    <text x="412" y="96" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">3개의 음전하를</text>
    <text x="412" y="126" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">띤 인산</text>
    <path d="M320,160 Q320,150 330,150 L400,150 Q410,150 410,142 Q410,150 420,150 L490,150 Q500,150 500,160" fill="none" stroke="#555555" stroke-width="2" />
    <polygon points="91.2,158 60,176 28.8,158 28.8,122 60,104 91.2,122" fill="#b3b3b3" stroke="#8a8a8a" stroke-width="2" />
    <polygon points="91,122 128,110 152,140 132,170 91,158" fill="#b3b3b3" stroke="#8a8a8a" stroke-width="2" />
    <text x="118" y="148" font-size="22" text-anchor="middle" fill="white" font-family="Georgia, serif">A</text>
    <line x1="140" y1="162" x2="160" y2="205" stroke="#333" stroke-width="2.5" />
    <polygon points="225,177 160,205 184,254 268,254 296,205" fill="#3c3c3c" />
    <polygon points="225,175 156,203 180,250 272,250 298,203" fill="#5d5d5d" stroke="#3c3c3c" stroke-width="2" />
    <circle cx="225" cy="176" r="11" fill="white" />
    <text x="225" y="184" font-size="20" text-anchor="middle" fill="#333" font-weight="bold" font-family="Georgia, serif">O</text>
    <text x="225" y="228" font-size="22" text-anchor="middle" fill="white" font-weight="bold" font-family="Georgia, serif">S</text>
    <line x1="298" y1="205" x2="470" y2="205" stroke="#333" stroke-width="3" />
    <circle cx="343" cy="205" r="14" fill="#555" stroke="#333" stroke-width="1.5" />
    <text x="343" y="212" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="Georgia, serif">P</text>
    <circle cx="360" cy="172" r="11" fill="white" stroke="#444" stroke-width="2" />
    <line x1="354" y1="172" x2="366" y2="172" stroke="#444" stroke-width="2" />
    <circle cx="398" cy="205" r="14" fill="#555" stroke="#333" stroke-width="1.5" />
    <text x="398" y="212" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="Georgia, serif">P</text>
    <circle cx="415" cy="172" r="11" fill="white" stroke="#444" stroke-width="2" />
    <line x1="409" y1="172" x2="421" y2="172" stroke="#444" stroke-width="2" />
    <circle cx="453" cy="205" r="14" fill="#555" stroke="#333" stroke-width="1.5" />
    <text x="453" y="212" font-size="19" text-anchor="middle" fill="white" font-weight="bold" font-family="Georgia, serif">P</text>
    <circle cx="470" cy="172" r="11" fill="white" stroke="#444" stroke-width="2" />
    <line x1="464" y1="172" x2="476" y2="172" stroke="#444" stroke-width="2" />
    <line x1="33" y1="216" x2="133.1" y2="184.2" stroke="#666" stroke-width="1.3" /><polygon points="140,182 132.9,189.4 129.9,180" fill="#666" />
    <line x1="315" y1="272" x2="315" y2="229.2" stroke="#666" stroke-width="1.3" /><polygon points="315,222 319.9,231 310.1,231" fill="#666" />
    <line x1="426" y1="272" x2="426" y2="229.2" stroke="#666" stroke-width="1.3" /><polygon points="426,222 430.9,231 421.1,231" fill="#666" />
    <line x1="426" y1="190" x2="426" y2="220" stroke="#b4321e" stroke-width="3" />
    <polygon points="418,188 434,188 426,198" fill="#b4321e" />
    <text x="440" y="262" font-size="15" fill="#b4321e" font-weight="bold">가수분해</text>
    <text x="440" y="280" font-size="15" fill="#b4321e" font-weight="bold">되는 결합</text>
    <rect x="20" y="295" width="480" height="148.5" rx="8" fill="#fff6f3" stroke="#b4321e" stroke-width="1.5" />
    <text x="32" y="320" font-size="15" fill="#b4321e" font-weight="bold">해설</text>
    <text x="32" y="341.8" font-size="15" fill="#b4321e">두 번째와 세 번째 인산 사이의 결합이 가수분해된다</text>
    <text x="32" y="363.5" font-size="15" fill="#b4321e">ATP + H₂O → ADP + Pi + 에너지</text>
    <text x="32" y="385.2" font-size="15" fill="#b4321e">인산기의 음전하끼리 서로 밀어내 불안정한 결합 →</text>
    <text x="32" y="407" font-size="15" fill="#b4321e">인산기를 잃으면서 에너지를 방출한다</text>
    <text x="32" y="428.8" font-size="15" fill="#b4321e">(염기를 잃거나 전자·양성자를 내놓는 것이 아님)</text>
  </g>
</svg>
