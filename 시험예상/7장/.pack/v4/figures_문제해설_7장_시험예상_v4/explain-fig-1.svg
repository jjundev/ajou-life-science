<svg xmlns="http://www.w3.org/2000/svg" width="590" height="172" viewBox="0 0 590 172" role="img" aria-label="세 그래프 (가), (나), (다). 가로축은 형질 값, 세로축은 개체 수. 점선은 선택 전 분포로 세 그래프 모두 가운데가 가장 높은 종 모양이다. 실선은 여러 세대 선택 후 분포이다. (가)의 실선은 같은 가운데 위치에서 폭이 좁고 높다. (나)의 실선은 종 모양이 오른쪽으로 옮겨 갔다. (다)의 실선은 가운데가 낮아지고 왼쪽과 오른쪽에 봉우리 두 개가 있다."><style>
