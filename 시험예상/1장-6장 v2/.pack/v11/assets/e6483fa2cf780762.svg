  <title id="web-ch03-q06-exam-title">두 염색체의 모식도</title>
  <desc id="web-ch03-q06-exam-desc">회색 막대 모양 염색체 두 개가 나란히 있고, 각각 위쪽 3분의 1 지점에 잘록한 부분이 있다. 왼쪽 염색체에는 위에서부터 띠 A, 잘록한 부분 바로 위의 띠 B, 잘록한 부분 X, 아래쪽 띠 C가 표시되어 있다. 오른쪽 염색체에는 같은 높이의 띠에 a, b, c가 표시되어 있다.</desc>
