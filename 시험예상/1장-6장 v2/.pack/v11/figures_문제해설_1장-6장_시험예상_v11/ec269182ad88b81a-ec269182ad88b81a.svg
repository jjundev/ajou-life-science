  <title id="web-ch02-q09-exam-title">세포호흡 전체 과정의 개요 모식도</title>
  <desc id="web-ch02-q09-exam-desc">배경에 미토콘드리아의 윤곽이 옅게 그려져 있다. 왼쪽의 (해당과정) 상자에서 화살표가 (가) 상자로 이어지고, (가)에서 굽은 화살표가 원형 회로 (나)로 들어간다. 오른쪽에는 큰 (다) 상자가 있다. 위쪽에는 (해당과정), (가), (나)에서 올라온 관 모양 선이 오른쪽으로 이어져 (다)로 내려간다. (해당과정) 아래에는 노란 화살표와 노란 별 모양, (나)와 (다) 아래에는 회색 화살표와 회색 별 모양이 있다.</desc>
